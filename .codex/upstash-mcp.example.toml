# Personal, local-only output shape. Generate the real table with
# `node scripts/render-upstash-mcp-config.mjs`; its paths must be absolute.
# Never merge it into this repository's .codex/config.toml: Codex Cloud cannot
# receive these credentials during the agent phase.

[mcp_servers.upstash]
args = ["/absolute/path/to/monitoring-monorepo/scripts/upstash-mcp-launcher.mjs"]
command = "/absolute/path/to/node"
default_tools_approval_mode = "prompt"
enabled = false
enabled_tools = [
  "redis_database_list_databases",
  "redis_database_run_redis_commands",
]
env_vars = ["UPSTASH_EMAIL", "UPSTASH_API_KEY"]
startup_timeout_sec = 40

[mcp_servers.upstash.tools.redis_database_run_redis_commands]
approval_mode = "prompt"
