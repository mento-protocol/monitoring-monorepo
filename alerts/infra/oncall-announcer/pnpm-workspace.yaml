packages:
  - .

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@grpc/grpc-js@1.14.5"
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
  - "@mento-protocol/*"
  - envio-cloud
  - "@envio-dev/envio-cloud-*"
  # Security override floors may be younger than the 3-day release-age gate.
  - "@esbuild/*"
  - brace-expansion
  - fast-uri
  - form-data
  - esbuild
  - js-yaml
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  - postcss@8.5.23
  - protobufjs
  - vite

overrides:
  # Nodemon watches literal directories; chokidar 4 removes unpatched braces.
  "nodemon>chokidar": 4.0.3
  "source-map-js@<1.2.2": 1.2.2
  "proxy-addr@<2.0.8": 2.0.8
  "@grpc/grpc-js": 1.14.5
  # GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr: patched 5.x floor.
  "brace-expansion@^1.0.0": 5.0.12
  "brace-expansion@>=5.0.0 <6": 5.0.12
  # GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g hit 3.1.6, the floor the
  # earlier fast-uri advisories set. 3.1.7 is the patched floor for the 3.x
  # line; ajv 8 needs fast-uri ^3.
  fast-uri@<3.1.7: 3.1.7
  form-data@<2.5.6: 2.5.6
  # GHSA-2883-xcg3-v3hh hits 4.3.1, the floor the superseded
  # GHSA-5p4m-2wfm-xmqj pin set. 4.3.2 is the patched floor for the 4.x line.
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  # GHSA-2v37-7h3g-55p8: 3.3.18 is the patched floor for the 3.x line.
  nanoid@<3.3.18: 3.3.18
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  postcss@<8.5.23: 8.5.23
  protobufjs@>=7.0.0 <7.6.5: 7.6.5
  qs@<6.15.2: 6.15.2
  # GHSA-w5hq-g745-h8pq: use each affected release line's patched backport.
  uuid@<11.1.1: 11.1.1
  "uuid@>=12.0.0 <12.0.1": 12.0.1
  "uuid@>=13.0.0 <13.0.1": 13.0.1
  vite@<8.0.16: 8.0.16

# pnpm 11 records dependency build-script policy explicitly.
allowBuilds:
  protobufjs: false
