packages:
  - .

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@mento-protocol/*"
  - envio-cloud
  - "@envio-dev/envio-cloud-*"
  # Security override floors may be younger than the 3-day release-age gate.
  - brace-expansion
  - fast-uri
  - form-data
  - js-yaml
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  - postcss@8.5.23
  - protobufjs
  - vite

overrides:
  # GHSA-rgw5-rvv9-x895: the 5.0.8 resource-limit fix is incomplete.
  "brace-expansion@^1.0.0": 5.0.9
  "brace-expansion@>=5.0.0 <6": 5.0.9
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp hit 3.1.5, the floor the old GHSA-7p8r-x3mc-p8w7 pin
  # set. 3.1.6 is the patched floor for the 3.x line; ajv 8 needs fast-uri ^3.
  fast-uri@<3.1.6: 3.1.6
  form-data@<2.5.6: 2.5.6
  "form-data@>=4.0.0 <4.0.6": 4.0.6
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # GHSA-2v37-7h3g-55p8: 3.3.18 is the patched floor for the 3.x line.
  nanoid@<3.3.18: 3.3.18
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  postcss@<8.5.23: 8.5.23
  protobufjs@>=7.0.0 <7.6.5: 7.6.5
  qs@<6.15.2: 6.15.2
  # GHSA-w5hq-g745-h8pq: use each affected release line's patched backport.
  uuid@<11.1.1: 11.1.1
  "uuid@>=12.0.0 <12.0.1": 12.0.1
  "uuid@>=13.0.0 <13.0.1": 13.0.1
  vite@<8.0.16: 8.0.16
  # GHSA-96hv-2xvq-fx4p: 8.21.0 fixes fragment-driven memory exhaustion.
  ws@<8.21.0: 8.21.0

# pnpm 11 records dependency build-script policy explicitly.
allowBuilds:
  protobufjs: false
