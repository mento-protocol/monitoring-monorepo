packages:
  - .

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@mento-protocol/*"
  - envio-cloud
  - "@envio-dev/envio-cloud-*"
  # Security override floors may be younger than the 3-day release-age gate.
  - brace-expansion
  - fast-uri
  - form-data
  - js-yaml
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  - postcss@8.5.23
  - protobufjs
  - vite

overrides:
  # GHSA-rgw5-rvv9-x895: the 5.0.8 resource-limit fix is incomplete.
  "brace-expansion@^1.0.0": 5.0.9
  "brace-expansion@>=5.0.0 <6": 5.0.9
  # GHSA-7p8r-x3mc-p8w7: 3.1.5 fixes backslash authority confusion.
  fast-uri@<3.1.5: 3.1.5
  form-data@<2.5.6: 2.5.6
  "form-data@>=4.0.0 <4.0.6": 4.0.6
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # GHSA-2v37-7h3g-55p8: the 3.3.17 fix is incomplete; 3.3.18 closes the
  # zero-size generator hang.
  nanoid@<3.3.18: 3.3.18
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  postcss@<8.5.23: 8.5.23
  protobufjs@>=7.0.0 <7.6.5: 7.6.5
  qs@<6.15.2: 6.15.2
  uuid: 11.1.1
  vite@<8.0.16: 8.0.16
  ws@<8.21.0: 8.21.0

# pnpm 11 records dependency build-script policy explicitly.
allowBuilds:
  protobufjs: false
