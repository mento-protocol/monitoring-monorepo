# Grafana Cloud BasicAuth secrets are fetched at runtime by `entrypoint.sh`
# inside the deployed Alloy container — see Dockerfile + entrypoint.sh here.
# The previous flow rendered secrets into agent.yaml on the Cloud Build VM
# and shipped the plaintext via `gcloud app deploy`, which retained the
# rendered file indefinitely in (a) the App Engine source staging bucket
# and (b) the container image layer. Runtime fetch keeps the secrets in
# Secret Manager only.
#
# The checked-in App Engine version identity is pinned to
# grafana-agent-runtime@mento-monitoring.iam.gserviceaccount.com. The local
# deploy wrapper runs the read-only identity/secret preflight and exports an
# immutable five-file commit snapshot before submitting this build as the
# dedicated builder below. The build creates a zero-traffic version; the
# wrapper assigns 100% traffic atomically. The runtime supervisor remains
# passive until every peer version is stopped, preventing collector overlap
# while leaving a temporary collection gap until activation or rollback. The
# wrapper verifies identity/allocation from a committed verifier snapshot,
# stops and proves a target whose verification fails, retires peers, and proves
# active collector health before completing the handoff.
steps:
  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        app,
        deploy,
        --quiet,
        --no-promote,
        '--version=${_VERSION}',
        grafana-agent.yaml,
      ]
serviceAccount: projects/mento-monitoring/serviceAccounts/grafana-agent-builder@mento-monitoring.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
