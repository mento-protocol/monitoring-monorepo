name: PR Description

# Enforces the repo PR-description standard (AGENTS.md "PR description standard"
# + .github/PULL_REQUEST_TEMPLATE.md): every PR body must lead with
# `## The Problem` and `## The Solution`, include visible explanatory Markdown content in both, and
# not still contain the unfilled template placeholders. The `## Deferrals`
# section is OPTIONAL — omit it when nothing is deferred; when present it must
# say "None" or link a GitHub issue per item (for everything knowingly deferred
# from the PR).
#
# ADVISORY STATUS: this check is not in the branch ruleset's required set
# (ci, Code Quality, Vercel, Vercel Preview Comments, Sentry suites). Its
# verdict is a function of `github.event.pull_request.body` plus a base-ref
# copy of the validator, so it is head-independent and `synchronize` cannot
# change it — dropped below. No workflow-level `paths:` filter is added:
# the check reads the body, not the diff. A title-only `edited` event skips
# the job via the `changes.body`/`changes.base` guard below rather than
# re-validating an unchanged body; a base-change `edited` event still runs,
# since retargeting to `main` can be the only event a PR ever gets.
# One exception: the bootstrap fallback below runs the PR-head copy when the
# base branch lacks the validator, so the PR that introduces or moves
# scripts/pr/check-pr-description.mjs is head-dependent. Recovery after a
# later head-commit fix needs a new qualifying event — a body or base edit,
# a reopen, or ready_for_review — because that refreshes
# `github.event.pull_request.head.sha` to the current head. A manual re-run
# of an existing job reuses the same cached event payload and SHA, so it
# checks out the old head and cannot pick up the fix.
# Promoting this check to required needs
# `synchronize` restored in the same change. Draft PRs and Dependabot PRs
# are skipped.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: PR description format
    # Skip drafts (work-in-progress), Dependabot (auto-generated bodies), and
    # a title-only `edited` event (body and base unchanged).
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.body != null ||
      github.event.changes.base != null)
    # Concurrency is job-level, not workflow-level: a skipped job (the `if:`
    # above is false) never enters the group, so a title-only edit can no
    # longer displace a queued validation-worthy run the way a workflow-level
    # group would (GitHub replaces a queued run in a shared group even when
    # `cancel-in-progress` is false — see ci.yml's own concurrency comment).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: >-
        ${{ github.event.action != 'edited' || github.event.changes.body !=
        null || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout bootstrap validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted-base/.node-version
          package-manager-cache: false
      - name: Install trusted validator dependencies
        working-directory: trusted-base
        run: >-
          pnpm --filter @mento-protocol/monitoring-monorepo install
          --frozen-lockfile --ignore-scripts
      - name: Validate PR description
        # Body is passed via env (never interpolated into the script) to avoid
        # shell injection from PR content.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Prefer the trusted base-ref copy and its locked dependencies over
          # the PR's own, so a PR cannot edit the rule it is judged by. The
          # dependency install disables lifecycle scripts, so this required
          # check does not execute repository-authored install hooks. The
          # legacy flat-path probe
          # (pre issue-1877-P5) retired in issue 1904: the checkout above
          # uses the base branch NAME, so trusted-base/ is always current
          # main at job-execution time, never a snapshot pinned to when a PR
          # branched — once main carries the validator at scripts/pr/, no
          # PR (old, reopened, or new) can still resolve the flat path. This
          # relies on the trigger above staying `branches: [main]`; widening
          # it to other long-lived base branches needs its own dual-probe
          # bridge until those branches carry scripts/pr/ too.
          if [ -f trusted-base/scripts/pr/check-pr-description.mjs ]; then
            node trusted-base/scripts/pr/check-pr-description.mjs
          elif [ -f pr-head/scripts/pr/check-pr-description.mjs ]; then
            echo "::warning::Trusted PR-description validator missing on the target branch; using the PR copy only for the bootstrap PR that introduces the script."
            node pr-head/scripts/pr/check-pr-description.mjs
          else
            echo "::error::PR-description validator is missing from both the target branch and PR head."
            exit 1
          fi
