name: Schema Diff — Advisory

on:
  pull_request:
    branches: [main]
    # Keep the workflow-level trigger unchanged in M2. Routing stays in-job.
    # Results now use the job summary. This workflow does not mutate PR comments.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-diff:
    # Advisory only. Fork and Dependabot PRs report a skip reason. A failed
    # path filter runs the schema diff fail-closed.
    name: GraphQL schema diff
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        # A failed filter must run the full check, not skip it.
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            schema:
              - indexer-envio/schema.graphql
              - .github/workflows/schema-diff.yml
              - scripts/schema-diff.mjs
              - scripts/schema-diff.test.mjs
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .npmrc
              - .node-version
              - .github/actions/pnpm-install/**
      - name: Decide whether to run schema diff
        id: decide
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          SCHEMA_CHANGED: ${{ steps.filter.outputs.schema }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          if [[ "$PR_ACTOR" == "dependabot[bot]" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Dependabot pull requests do not run schema diff." >> "$GITHUB_OUTPUT"
          elif [[ -n "$PR_HEAD_REPO" && "$PR_HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Fork pull requests do not run schema diff." >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_OUTCOME" != "success" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Path-filter outcome is '$FILTER_OUTCOME'; running schema diff fail-closed."
          elif [[ "$SCHEMA_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Schema inputs changed; running schema diff."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Schema inputs did not change." >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/pnpm-install
        if: steps.decide.outputs.run == 'true'
      - name: Test schema diff input handling
        if: steps.decide.outputs.run == 'true'
        run: node --test scripts/schema-diff.test.mjs
      - name: Export base schema
        if: steps.decide.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/${BASE_REF}:indexer-envio/schema.graphql" > /tmp/schema-base.graphql
      - name: Run schema diff
        if: steps.decide.outputs.run == 'true'
        # Parser failures stay advisory and become the visible result.
        run: |
          if ! node scripts/schema-diff.mjs /tmp/schema-base.graphql indexer-envio/schema.graphql \
              > /tmp/schema-diff-output.md 2>/tmp/schema-diff-stderr.txt; then
            {
              echo "## GraphQL Schema Diff"
              echo ""
              echo "> **Advisory:** schema-diff parser failed — the schema may use an unrecognised Envio directive or scalar. Manual review required."
              echo ""
              echo '```'
              cat /tmp/schema-diff-stderr.txt
              echo '```'
            } > /tmp/schema-diff-output.md
          fi
          cat /tmp/schema-diff-output.md
      - name: Publish schema diff summary
        if: always()
        env:
          SHOULD_RUN: ${{ steps.decide.outputs.run }}
          SKIP_REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [[ "$SHOULD_RUN" != "true" ]]; then
            {
              echo "## GraphQL Schema Diff"
              echo ""
              echo "${SKIP_REASON:-Schema-diff routing did not produce a decision; check the job log.}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ ! -s /tmp/schema-diff-output.md ]]; then
            {
              echo "## GraphQL Schema Diff"
              echo ""
              echo "> **Advisory:** Schema diff did not produce output; check the job log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          readonly max_summary_bytes=60000
          body_bytes="$(wc -c < /tmp/schema-diff-output.md)"
          if (( body_bytes > max_summary_bytes )); then
            head -c "$max_summary_bytes" /tmp/schema-diff-output.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo ""
              echo ""
              echo "> **Advisory:** Output truncated at ${max_summary_bytes} bytes; use the job log for the full diff."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/schema-diff-output.md >> "$GITHUB_STEP_SUMMARY"
          fi
