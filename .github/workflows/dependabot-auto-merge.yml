name: Dependabot auto-merge

# This default-branch workflow is the only machine-merge writer. The upstream
# run is an untrusted signal. This job re-reads the run and workflow identity,
# the attempt-specific jobs, and the current pull request. It accepts only the
# read-only classifier's exact success shape. It never checks out code, reads
# artifacts or caches, or executes pull-request content.
#
# The writer waits for every required check, repeats every classifier and pull
# request proof, including the pinned metadata action's current-body
# maintainer-change rule and the pull request's complete close history, then
# calls the synchronous exact-head REST merge endpoint. A recorded close remains
# a durable human veto after the same head is reopened. The endpoint cannot
# enqueue or leave a standing auto-merge request.
#
# Main's ruleset no longer requires a pull request to include the current base
# (ADR 0104), so this writer carries that validation itself: it compares the
# base tip against the verified head and merges only when the head contains it.
# A stale head is left alone for Dependabot's own rebase to recover.
#
# The repository GITHUB_TOKEN performs the evidence reads and the final write.
# Separate environment variables keep the read path and final-write seam
# testable, although both values resolve to the same job token by design. This
# token does not emit push-triggered workflows. Required pull-request checks are
# the accepted final automated evidence for this narrow lane.

on:
  workflow_run:
    workflows: [Dependabot auto-merge candidate]
    types: [completed]

permissions: {}

concurrency:
  # Concurrency is evaluated before the job trust check. Isolate a fork run
  # that reuses the Dependabot branch name from the base-repository writer.
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    # autofix-ci-trust: the job excludes the full sentry-autofix namespace and
    # revalidates the upstream bot, branch, head, commits, and files. It never
    # checks out or executes upstream content.
    if: >-
      github.repository == 'mento-protocol/monitoring-monorepo' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.name == 'Dependabot auto-merge candidate' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.triggering_actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.run_attempt == 1 &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/actions-minor-patch-') &&
      !startsWith(github.event.workflow_run.head_branch, 'sentry-autofix/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Merge the verified head after required checks
        env:
          GH_READ_TOKEN: ${{ github.token }}
          # Keep the final-write seam separate from every evidence read. Both
          # variables use the repository GITHUB_TOKEN by design.
          FINAL_MERGE_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          readonly EXPECTED_REPOSITORY='mento-protocol/monitoring-monorepo'
          readonly EXPECTED_OWNER='mento-protocol'
          readonly EXPECTED_BASE='main'
          readonly CANDIDATE_FILE='dependabot-auto-merge-candidate.yml'
          readonly CANDIDATE_PATH='.github/workflows/dependabot-auto-merge-candidate.yml'
          readonly CANDIDATE_NAME='Dependabot auto-merge candidate'
          readonly WRITER_PATH='.github/workflows/dependabot-auto-merge.yml'
          # dependabot/fetch-metadata at
          # 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 derives
          # maintainer-changes from this exact case-sensitive PR-body marker.
          readonly MAINTAINER_CHANGE_MARKER='Maintainer changes'
          EXPECTED_HEAD=''
          EXPECTED_HEAD_REF=''
          PR_NUMBER=''
          OBSERVED_BEHIND_BY=''

          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo '::error::The writer is outside the expected repository.'
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::The upstream run ID is invalid.'
            exit 1
          fi

          verify_authoritative_state() {
            local workflow_json
            local workflow_id
            local run_json
            local observed_head
            local observed_head_ref
            local job_pages
            local pr_pages
            local observed_pr_number
            local pr_json
            local history_pages
            local expected_commit_count
            local expected_file_count
            local commit_pages
            local file_pages
            local queue_json

            if ! workflow_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              "repos/$EXPECTED_REPOSITORY/actions/workflows/$CANDIDATE_FILE"); then
              echo '::error::The classifier workflow identity is unreadable.'
              exit 1
            fi
            if ! jq -e \
              --arg name "$CANDIDATE_NAME" \
              --arg path "$CANDIDATE_PATH" \
              '.id > 0 and .name == $name and .path == $path and .state == "active"' \
              <<< "$workflow_json" >/dev/null; then
              echo '::error::The classifier workflow identity is invalid.'
              exit 1
            fi
            if ! workflow_id=$(jq -er '.id' <<< "$workflow_json"); then
              echo '::error::The classifier workflow ID is invalid.'
              exit 1
            fi

            if ! run_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              "repos/$EXPECTED_REPOSITORY/actions/runs/$RUN_ID"); then
              echo '::error::The authoritative upstream run is unreadable.'
              exit 1
            fi
            if ! jq -e \
              --argjson run_id "$RUN_ID" \
              --argjson workflow_id "$workflow_id" \
              --arg repo "$EXPECTED_REPOSITORY" \
              --arg name "$CANDIDATE_NAME" \
              --arg path "$CANDIDATE_PATH" \
              '.id == $run_id and
               .repository.full_name == $repo and
               .head_repository.full_name == $repo and
               .workflow_id == $workflow_id and
               .name == $name and
               .path == $path and
               .event == "pull_request" and
               .status == "completed" and
               .conclusion == "success" and
               .run_attempt == 1 and
               .actor.login == "dependabot[bot]" and
               .triggering_actor.login == "dependabot[bot]" and
               (.head_branch | test("^dependabot/github_actions/actions-minor-patch-[0-9a-f]{10}$")) and
               (.head_sha | test("^[0-9a-f]{40}$")) and
               .head_commit.id == .head_sha' \
              <<< "$run_json" >/dev/null; then
              echo '::error::The authoritative upstream run is not an eligible classifier run.'
              exit 1
            fi
            if ! observed_head=$(jq -er '.head_sha' <<< "$run_json"); then
              echo '::error::The authoritative upstream head is invalid.'
              exit 1
            fi
            if ! observed_head_ref=$(jq -er '.head_branch' <<< "$run_json"); then
              echo '::error::The authoritative upstream branch is invalid.'
              exit 1
            fi
            if [[ -z "$EXPECTED_HEAD" ]]; then
              EXPECTED_HEAD="$observed_head"
              EXPECTED_HEAD_REF="$observed_head_ref"
            elif [[ "$observed_head" != "$EXPECTED_HEAD" || "$observed_head_ref" != "$EXPECTED_HEAD_REF" ]]; then
              echo '::error::The authoritative upstream run changed during required-check waiting.'
              exit 1
            fi

            if ! job_pages=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET --paginate --slurp \
              "repos/$EXPECTED_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs" \
              -f filter=all -f per_page=100); then
              echo '::error::The classifier attempt jobs are unreadable.'
              exit 1
            fi
            if ! jq -e \
              --argjson run_id "$RUN_ID" \
              --arg head "$EXPECTED_HEAD" \
              'def safe_integer:
                 if type == "number" then
                   . >= 0 and . <= 9007199254740991 and . == floor
                 else
                   false
                 end;
               type == "array" and
               (length >= 1) and
               all(.[]; type == "object" and
                 has("total_count") and
                 (.total_count | safe_integer) and
                 has("jobs") and
                 (.jobs | type == "array")) and
               (.[0].total_count as $total_count |
               all(.[]; .total_count == $total_count) and
               ([.[].jobs[]] as $jobs |
               $total_count == ($jobs | length) and
               ($jobs | length) == 1 and
               $jobs[0].name == "classify" and
               $jobs[0].run_id == $run_id and
               $jobs[0].head_sha == $head and
               $jobs[0].status == "completed" and
               $jobs[0].conclusion == "success" and
               ([ $jobs[0].steps[] | select(.name == "Validate candidate event" and .conclusion == "success") ] | length) == 1 and
               ([ $jobs[0].steps[] | select(.name == "Fetch verified Dependabot metadata" and .conclusion == "success") ] | length) == 1 and
               ([ $jobs[0].steps[] | select(.name == "Mark routine update eligible" and .conclusion == "success") ] | length) == 1))' \
              <<< "$job_pages" >/dev/null; then
              echo '::error::The classifier attempt does not have the exact successful job shape.'
              exit 1
            fi

            if ! pr_pages=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET --paginate --slurp \
              "repos/$EXPECTED_REPOSITORY/pulls" \
              -f state=open -f base="$EXPECTED_BASE" \
              -f head="$EXPECTED_OWNER:$EXPECTED_HEAD_REF" -f per_page=100); then
              echo '::error::The pull request lookup is unreadable.'
              exit 1
            fi
            if ! jq -e '[.[][]] | length == 1' <<< "$pr_pages" >/dev/null; then
              echo '::error::The verified branch must identify exactly one open pull request.'
              exit 1
            fi
            if ! observed_pr_number=$(jq -er '.[0][0].number' <<< "$pr_pages"); then
              echo '::error::The pull request number is invalid.'
              exit 1
            fi
            if [[ ! "$observed_pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::The pull request number is invalid.'
              exit 1
            fi
            if [[ -z "$PR_NUMBER" ]]; then
              PR_NUMBER="$observed_pr_number"
            elif [[ "$observed_pr_number" != "$PR_NUMBER" ]]; then
              echo '::error::The verified branch identified a different pull request after required-check waiting.'
              exit 1
            fi

            if ! pr_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              "repos/$EXPECTED_REPOSITORY/pulls/$PR_NUMBER"); then
              echo '::error::The current pull request is unreadable.'
              exit 1
            fi
            if ! jq -e \
              --arg repo "$EXPECTED_REPOSITORY" \
              --arg owner "$EXPECTED_OWNER" \
              --arg base "$EXPECTED_BASE" \
              --arg head "$EXPECTED_HEAD" \
              --arg head_ref "$EXPECTED_HEAD_REF" \
              '.state == "open" and
               .draft == false and
               .user.login == "dependabot[bot]" and
               .base.ref == $base and
               .base.repo.full_name == $repo and
               .head.repo.full_name == $repo and
               .head.repo.owner.login == $owner and
               .head.label == ($owner + ":" + $head_ref) and
               .head.ref == $head_ref and
               .head.sha == $head and
               (.commits | type) == "number" and
               .commits > 0 and
               .commits <= 250 and
               (.changed_files | type) == "number" and
               .changed_files > 0' \
              <<< "$pr_json" >/dev/null; then
              echo '::error::The current pull request does not match the verified run.'
              exit 1
            fi
            if ! jq -e \
              --arg marker "$MAINTAINER_CHANGE_MARKER" \
              '(.body | type) == "string" and
               (.body | contains($marker) | not)' \
              <<< "$pr_json" >/dev/null; then
              echo '::error::The current pull request reports maintainer changes.'
              exit 1
            fi

            if ! expected_commit_count=$(jq -er '.commits' <<< "$pr_json"); then
              echo '::error::The pull request commit count is invalid.'
              exit 1
            fi
            if ! expected_file_count=$(jq -er '.changed_files' <<< "$pr_json"); then
              echo '::error::The pull request file count is invalid.'
              exit 1
            fi

            if ! commit_pages=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET --paginate --slurp \
              "repos/$EXPECTED_REPOSITORY/pulls/$PR_NUMBER/commits" \
              -f per_page=100); then
              echo '::error::The pull request commits are unreadable.'
              exit 1
            fi
            if ! jq -e \
              --arg head "$EXPECTED_HEAD" \
              --argjson expected_count "$expected_commit_count" \
              '[.[][]] as $commits |
               ($commits | length) == $expected_count and
               ($commits | last | .sha) == $head and
               ([ $commits[].sha ] | unique | length) == ($commits | length) and
               all($commits[];
                 (.sha | test("^[0-9a-f]{40}$")) and
                 .author.login == "dependabot[bot]" and
                 .commit.verification.verified == true)' \
              <<< "$commit_pages" >/dev/null; then
              echo '::error::Every commit must be unique, verified, and authored by Dependabot.'
              exit 1
            fi

            if ! file_pages=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET --paginate --slurp \
              "repos/$EXPECTED_REPOSITORY/pulls/$PR_NUMBER/files" \
              -f per_page=100); then
              echo '::error::The pull request files are unreadable.'
              exit 1
            fi
            if ! jq -e \
              --argjson expected_count "$expected_file_count" \
              --arg candidate "$CANDIDATE_PATH" \
              --arg writer "$WRITER_PATH" \
              '[.[][]] as $files |
               ($files | length) == $expected_count and
               ([ $files[].filename ] | unique | length) == ($files | length) and
               all($files[];
                 .status == "modified" and
                 (.filename | test("^\\.github/workflows/[^/]+\\.ya?ml$")) and
                 .filename != $candidate and
                 .filename != $writer)' \
              <<< "$file_pages" >/dev/null; then
              echo '::error::Routine auto-merge accepts only modified top-level workflow YAML outside its own trust files.'
              exit 1
            fi

            if ! queue_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api graphql \
              -f query='query($owner:String!,$repo:String!,$branch:String!){repository(owner:$owner,name:$repo){mergeQueue(branch:$branch){url}}}' \
              -f owner="$EXPECTED_OWNER" -f repo='monitoring-monorepo' \
              -f branch="$EXPECTED_BASE"); then
              echo '::error::The main merge queue state is unreadable.'
              exit 1
            fi
            if ! jq -e \
              '((.errors // []) | length) == 0 and
               (.data.repository | type) == "object" and
               (.data.repository | has("mergeQueue")) and
               .data.repository.mergeQueue == null' \
              <<< "$queue_json" >/dev/null; then
              echo '::error::The routine auto-merge lane cannot prove that main has no merge queue.'
              exit 1
            fi

            # Keep this as the final authoritative read. It makes a human close
            # durable across a same-head reopen and keeps the residual request
            # window as short as this non-transactional API permits.
            if ! history_pages=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET --paginate --slurp \
              "repos/$EXPECTED_REPOSITORY/issues/$PR_NUMBER/events" \
              -f per_page=100); then
              echo '::error::The pull request close history is unreadable.'
              exit 1
            fi
            if ! jq -e \
              'type == "array" and
               length >= 1 and
               all(.[]; type == "array") and
               ([.[][]] as $events |
               all($events[];
                 type == "object" and
                 has("event") and
                 (.event | type) == "string") and
               all($events[];
                 .event != "closed" and
                 .event != "reopened"))' \
              <<< "$history_pages" >/dev/null; then
              echo '::error::The pull request history is malformed or contains a close or reopen event.'
              exit 1
            fi
          }

          # Read the base branch tip, then require the verified head to contain
          # it. Every failure path leaves OBSERVED_BEHIND_BY unset and exits
          # non-zero, so an unreadable comparison can never look like ancestry.
          verify_base_ancestry() {
            local base_json
            local base_sha
            local compare_json

            if ! base_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              "repos/$EXPECTED_REPOSITORY/branches/$EXPECTED_BASE"); then
              echo '::error::The base branch tip is unreadable.'
              exit 1
            fi
            if ! base_sha=$(jq -er '.commit.sha' <<< "$base_json"); then
              echo '::error::The base branch tip is invalid.'
              exit 1
            fi
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::The base branch tip is invalid.'
              exit 1
            fi

            if ! compare_json=$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              "repos/$EXPECTED_REPOSITORY/compare/$base_sha...$EXPECTED_HEAD"); then
              echo '::error::The base ancestry comparison is unreadable.'
              exit 1
            fi
            if ! jq -e \
              --arg base "$base_sha" \
              --arg head "$EXPECTED_HEAD" \
              '(.behind_by | type) == "number" and
               .behind_by >= 0 and
               .base_commit.sha == $base and
               .merge_base_commit.sha != null' \
              <<< "$compare_json" >/dev/null; then
              echo '::error::The base ancestry comparison does not have the expected shape.'
              exit 1
            fi
            if ! OBSERVED_BEHIND_BY=$(jq -er '.behind_by' <<< "$compare_json"); then
              echo '::error::The base ancestry count is invalid.'
              exit 1
            fi
            if [[ ! "$OBSERVED_BEHIND_BY" =~ ^[0-9]+$ ]]; then
              echo '::error::The base ancestry count is invalid.'
              exit 1
            fi
          }

          verify_authoritative_state
          readonly EXPECTED_HEAD EXPECTED_HEAD_REF PR_NUMBER

          if ! GH_TOKEN="$GH_READ_TOKEN" gh pr checks "$PR_NUMBER" \
            --repo "$EXPECTED_REPOSITORY" \
            --required \
            --watch \
            --fail-fast \
            --interval 10; then
            echo '::error::A required pull-request check failed or did not complete.'
            exit 1
          fi
          if ! REQUIRED_CHECKS_JSON=$(GH_TOKEN="$GH_READ_TOKEN" gh pr checks "$PR_NUMBER" \
            --repo "$EXPECTED_REPOSITORY" \
            --required \
            --json bucket,name,state); then
            echo '::error::The final required-check state is unreadable.'
            exit 1
          fi
          if ! jq -e \
            'length > 0 and all(.[]; .bucket == "pass")' \
            <<< "$REQUIRED_CHECKS_JSON" >/dev/null; then
            echo '::error::Every required pull-request check must pass.'
            exit 1
          fi

          # The wait is an untrusted delay. Repeat the complete workflow, run,
          # job, PR, head, maintainer-change body, durable close-history, commit,
          # file, and queue proof after it. The exact-head REST request below
          # cannot accept a later push or create queued state.
          verify_authoritative_state

          # ADR 0104 turned off strict required status checks on main, so
          # GitHub no longer refuses a merge whose head has not seen the
          # current base. This lane is unattended and merges with the
          # repository GITHUB_TOKEN, whose merge commit emits no
          # push-triggered workflows, so a stale merge would land with no
          # post-merge CI run at all. Current-base validation therefore lives
          # in this writer.
          #
          # Prove ancestry, do not read `mergeable_state`. Once the strict
          # policy is off, a stale but conflict-free head reports `clean`
          # rather than `behind` — `behind` only ever meant "a policy requires
          # an up-to-date branch", so it is not an ancestry proof here. Compare
          # the base tip against the verified head and require the head to
          # contain it. `behind_by == 0` also implies no conflict, since a head
          # containing the base tip merges trivially.
          verify_base_ancestry

          # The stale path is read-only. `update-branch` would write a merge
          # commit authored by this token, and the commit proof above accepts
          # only commits authored by dependabot[bot], so the repair would
          # disqualify the pull request from this lane for good; a
          # token-authored push also starts no workflow run, so nothing would
          # revalidate it. Posting `@dependabot rebase` is no better: the
          # comment would be recorded as github-actions[bot], whose commands
          # Dependabot ignores, so it would add noise and a false audit trail
          # without causing a rebase. Recovery needs no help from this job.
          # `.github/dependabot.yml` sets no `rebase-strategy`, so Dependabot
          # keeps its default `auto` and rebases its own out-of-date pull
          # requests. That push lands under its identity and starts a fresh
          # classifier run, which brings the pull request back here. Until then
          # it stays unmerged, which is the safe outcome.
          if [[ "$OBSERVED_BEHIND_BY" != '0' ]]; then
            echo "::notice::The verified head is $OBSERVED_BEHIND_BY commit(s) behind $EXPECTED_BASE. Leaving the pull request unmerged."
            exit 0
          fi

          if ! MERGE_JSON=$(GH_TOKEN="$FINAL_MERGE_TOKEN" gh api --method PUT \
            "repos/$EXPECTED_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_HEAD" \
            -f merge_method=squash); then
            echo '::error::The synchronous exact-head merge request failed.'
            exit 1
          fi
          if ! jq -e \
            '.merged == true and (.sha | test("^[0-9a-f]{40}$"))' \
            <<< "$MERGE_JSON" >/dev/null; then
            echo '::error::The merge endpoint did not confirm a synchronous merge.'
            exit 1
          fi
