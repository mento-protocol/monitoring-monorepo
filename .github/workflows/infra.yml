name: Infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - terraform/**
      - alerts/rules/**
      - alerts/peg-policy-publication/**
      - alerts/infra/**
      - aegis/terraform/**
      - governance-watchdog/infra/**
      - governance-watchdog/src/**
      - governance-watchdog/package.json
      - governance-watchdog/pnpm-lock.yaml
      - governance-watchdog/pnpm-workspace.yaml
      - governance-watchdog/tsconfig.json
      - governance-watchdog/tsconfig.build.json
      - terraform.stacks.json
      - scripts/check-metrics-bridge-template-plan.mjs
      - scripts/check-metrics-bridge-template-plan.test.mjs
      - scripts/alerts/check-peg-policy-publication.mjs
      - scripts/alerts/check-peg-policy-publication.test.mjs
      - scripts/production-infra-identity-contract/**
      # Shared parsing cores (ADR 0064) that sit outside the prefix above.
      - scripts/lib/hcl.mjs
      - scripts/lib/workflow-yaml.mjs
      # The peg registry integrity checker and the modules it imports. The stack
      # registry counts all three as Peg policy publication inputs, so this
      # filter has to be able to reach that inventory.
      - scripts/alerts/check-peg-registry-integrity.mjs
      - scripts/alerts/check-peg-registry-integrity-lineage.mjs
      - scripts/lib/peg-policy-digest.mjs
      - scripts/terraform-fmt-check.mjs
      - scripts/tf-platform-plan-guard.mjs
      - scripts/tf-stacks.mjs
      - scripts/tf-stacks.test.mjs
      - .github/workflows/alerts-infra.yml
      - .github/workflows/infra.yml
      - .github/workflows/governance-watchdog.yml
      - .github/workflows/peg-policy-publication.yml
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - alerts/rules/**
      - alerts/peg-policy-publication/**
      - alerts/infra/**
      - aegis/terraform/**
      - governance-watchdog/infra/**
      - governance-watchdog/src/**
      - governance-watchdog/package.json
      - governance-watchdog/pnpm-lock.yaml
      - governance-watchdog/pnpm-workspace.yaml
      - governance-watchdog/tsconfig.json
      - governance-watchdog/tsconfig.build.json
      - terraform.stacks.json
      - scripts/check-metrics-bridge-template-plan.mjs
      - scripts/check-metrics-bridge-template-plan.test.mjs
      - scripts/alerts/check-peg-policy-publication.mjs
      - scripts/alerts/check-peg-policy-publication.test.mjs
      - scripts/production-infra-identity-contract/**
      # Shared parsing cores (ADR 0064) that sit outside the prefix above.
      - scripts/lib/hcl.mjs
      - scripts/lib/workflow-yaml.mjs
      # The peg registry integrity checker and the modules it imports. The stack
      # registry counts all three as Peg policy publication inputs, so this
      # filter has to be able to reach that inventory.
      - scripts/alerts/check-peg-registry-integrity.mjs
      - scripts/alerts/check-peg-registry-integrity-lineage.mjs
      - scripts/lib/peg-policy-digest.mjs
      - scripts/terraform-fmt-check.mjs
      - scripts/tf-platform-plan-guard.mjs
      - scripts/tf-stacks.mjs
      - scripts/tf-stacks.test.mjs
      - .github/workflows/alerts-infra.yml
      - .github/workflows/infra.yml
      - .github/workflows/governance-watchdog.yml
      - .github/workflows/peg-policy-publication.yml

# See ci.yml for the concurrency rationale: PR runs cancel on new pushes
# to the same PR ref; push/dispatch events use a SHA-unique group so they
# never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions: read-all

jobs:
  discover:
    name: Discover Terraform stacks
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
      has-stacks: ${{ steps.stacks.outputs.has-stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build changed-stack matrix
        id: stacks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            matrix="$(node scripts/tf-stacks.mjs changed --base "origin/${BASE_REF}" --head HEAD --json)"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            matrix="$(node scripts/tf-stacks.mjs changed --base "$BEFORE_SHA" --head HEAD --json)"
          else
            matrix="$(node scripts/tf-stacks.mjs changed --json)"
          fi

          count="$(node -e 'const m = JSON.parse(process.argv[1]); console.log(m.include.length)' "$matrix")"
          {
            echo "matrix=${matrix}"
            if [[ "$count" == "0" ]]; then
              echo "has-stacks=false"
            else
              echo "has-stacks=true"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Terraform stacks"
            echo
            if [[ "$count" == "0" ]]; then
              echo "No Terraform stacks changed."
            else
              echo "| Stack | Path | State prefix | CI plan | CI apply | Apply policy |"
              echo "| --- | --- | --- | --- | --- | --- |"
              node -e '
                const m = JSON.parse(process.argv[1]);
                for (const s of m.include) {
                  console.log(`| ${s.id} | ${s.path} | ${s.state_prefix} | ${s.ci_plan} | ${s.ci_apply} | ${s.apply_policy} |`);
                }
              ' "$matrix"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  validate:
    name: Terraform Validate (${{ matrix.id }})
    needs: discover
    if: needs.discover.outputs.has-stacks == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
      - name: Validate stack
        run: node scripts/tf-stacks.mjs validate "${{ matrix.id }}"
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()
