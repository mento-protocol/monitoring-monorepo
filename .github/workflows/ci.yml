  scripts:
    name: Lint + test root scripts
    needs: changes
    if: needs.changes.outputs.rootScripts == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The expanded exact-identity lock suite reached 14m45s on this runner
    # after earlier job setup. The prior 15-minute cap cancelled it before
    # later steps could run. The waits bind real queue, cleanup, and no-signal
    # guarantees, so keep a bounded 10-minute margin for completion and runner
    # variance instead of weakening those assertions.
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Baseline validation reads source blobs from its claimed pre-baseline
          # commit so results remain reproducible after later doc changes.
          fetch-depth: 0
      - name: Validate trusted package-script pins
        # Runs BEFORE pnpm-install, and before any `pnpm <alias>` step below, so
        # it guards two execution surfaces this job would otherwise trust blind:
        #
        #   INSTALL — `pnpm install` runs the root lifecycle hooks (postinstall
        #   and friends). A package-only PR could add a `postinstall` that
        #   truncates this validator and the suites below it (Codex 3754887736).
        #   Validating first rejects any unsanctioned hook before install would
        #   execute it. `--ignore-scripts` is NOT used because the sanctioned
        #   `postinstall` builds @mento-protocol/config, whose dist the
        #   `Peg registry integrity` step below imports; this is the fail-close
        #   route that finding calls for instead. The validator needs only Node's
        #   built-in `fs`, so it runs before setup-node like the terraform job's
        #   pre-install `node` step.
        #
        #   RUN — this job invokes trusted aliases directly (`pnpm lint:scripts`,
        #   `pnpm agent:quality-gate:test`, the `docs:*` and `agent:context-*`
        #   suites); the pin validator keeps that trust safe by rejecting a
        #   drifted command (e.g. an appended `&& <command>`) before it executes.
        #   check-sentry-suites-in-ci.test.mjs pins this ordering, because the
        #   `sentry:*` aliases the local quality gate trusts are pinned by the
        #   same validator.
        run: node scripts/check-agent-quality-gate-package-scripts.mjs
      - uses: ./.github/actions/pnpm-install
      - name: ESLint root scripts
        run: pnpm lint:scripts
      - name: Peg registry integrity
        run: node scripts/alerts/check-peg-registry-integrity.mjs
      - name: Peg registry integrity checker suite
        run: node scripts/alerts/check-peg-registry-integrity.test.mjs
      - name: Lighthouse config assertion suite
        # Exercises route matching, per-route threshold boundaries, and
        # multi-run aggregation through the installed LHCI CLI. Keep this in
        # the required `ci` sentinel path so config-only regressions cannot
        # merge behind the advisory Lighthouse workflow.
        run: node scripts/lighthouse-config.test.mjs
      - name: Agent quality-gate routing regression suite
        # Verifies the path-to-command mapping in scripts/agent-quality-gate.sh.
        # Without this in CI, a routing regression only fails locally (pre-push)
        # and could merge if a contributor bypasses the local gate.
        run: pnpm agent:quality-gate:test
      - name: Gate routing-table suite
        # ADR 0069. The gate's routing is data in scripts/gate/routing-table/,
        # compiled by the Node mapping engine; D5c retired the bash `case` arms
        # that held it before. This suite is what checks the data: ADR 0064's
        # pairing lint, the path staleness check, the /bin/bash oracle for the
        # pattern compiler, the closed verb set against the engine, and the
        # `implementation_signature()` pin that keeps the freshness stamp honest.
        # It belongs in the required `ci` sentinel path for the same reason the
        # routing regression suite above does: the local pre-push gate is the
        # thing a contributor can bypass, and a broken table fails nowhere else.
        run: pnpm gate:routing-table:test
      - name: CodeRabbit config allowlist pin
        # ADR 0066. CodeRabbit resolves .coderabbit.yaml from the PR's SOURCE
        # branch, so a PR can weaken the reviewer that reviews it — and its
        # findings now feed the pr:feedback-state ledger. The pin asserts the
        # committed config exactly equals the canonical object in the suite, so
        # weakening it fails required CI until the pin is edited in the same PR.
        # This runs in CI, not only in the local pre-push gate, because the
        # local gate is the thing a config-weakening PR would skip.
        run: pnpm coderabbit:config:test
      - name: Terraform source-format target regression suite
        # Proves ignored operator tfvars stay outside the explicit format target
        # list while tracked and non-ignored source paths remain covered.
        run: node scripts/terraform/terraform-fmt-check.test.mjs
      - name: Hermetic Vitest setup consistency
        run: node scripts/repo-health/check-hermetic-vitest-setup.mjs
      - name: Hermetic Vitest setup consistency suite
        run: node scripts/repo-health/check-hermetic-vitest-setup.test.mjs
      - name: Deviation threshold drift suite
        run: node scripts/alerts/check-deviation-threshold-drift.test.mjs
      - name: Agent context checker unit tests
        # Behavioral coverage of scripts/context/check-agent-context.mjs's pure
        # helpers: frontmatter parsing and the last_verified staleness window.
        run: node scripts/context/check-agent-context.test.mjs
      - name: Agent settings contract tests
        # Behavioral coverage of the .claude/settings.json permission allowlist
        # and the SessionEnd hook wiring for both runtimes, which the context
        # checker runs but no longer defines.
        run: node scripts/context/check-settings-contract.test.mjs
      - name: Agent context checker
        # Runs the actual check-agent-context.mjs enforcement pass (managed
        # frontmatter + last_verified staleness policy) — the unit tests
        # above only cover the pure helpers in isolation.
        run: pnpm agent:context-check
      - name: Documentation catalog tests
        run: pnpm docs:index:test
      - name: Documentation catalog drift and link check
        run: pnpm docs:index --check
      - name: Documentation audit planner tests
        run: pnpm docs:audit:test
      - name: Documentation audit planner dry run
        run: pnpm docs:audit --dry-run
      - name: Documentation garden issue automation tests
        run: pnpm docs:garden:test
      - name: Documentation navigation evaluation tests
        run: pnpm docs:navigation-eval:test
      - name: Documentation navigation fixture contract
        run: pnpm docs:navigation-eval -- --check-fixtures
      - name: Documentation navigation committed baseline
        run: >-
          pnpm docs:navigation-eval -- --validate
          docs/evals/documentation-navigation-baseline.json
          --fixtures docs/evals/documentation-navigation-baseline-fixtures.json
      - name: Agent context budget tests
        run: pnpm agent:context-budget:test
      - name: Enforce agent context budgets
        run: pnpm agent:context-budget --strict
      - name: PR description validator suite
        run: node scripts/pr/check-pr-description.test.mjs
      - name: Deploy root-anchor regression suite
        # Verifies deploy wrappers run deploy-sensitive commands from the same
        # repo root that scripts/lib/deploy-guard.sh checked for cleanliness.
        run: node scripts/check-deploy-root-anchors.test.mjs
      - name: GitHub environment protection suite
        run: node scripts/verify-github-environment-protection.test.mjs
      - name: ESLint baseline-diff semantic suite
        # Direct behavioral coverage of scripts/eslint-baseline-diff.mjs
        # (matching, growth detection, line-proximity absorption, merge-base
        # check). The wrapper is now load-bearing CI policy; routing tests
        # alone don't prove it behaves correctly.
        run: node scripts/eslint-baseline-diff.test.mjs
      - name: Alert-rules PromQL lint + metric cross-check
        run: pnpm alerts:rules:lint
      - name: Alert-rules lint self-test
        run: pnpm alerts:rules:lint:test
      - name: Terraform output sanitizer fixture suite
        # Fixture coverage for scripts/sanitize-terraform-output.sh, the sole
        # redaction layer before terraform plan/apply output reaches public
        # GitHub issue bodies and PR sticky comments.
        run: pnpm sanitize:test
      - name: Notifier coverage unit tests
        # Behavioral coverage of scripts/workflows/check-notifier-coverage.mjs:
        # parse helpers (hasPushMain inline + block-sequence, hasSchedule,
        # parseNotifierList, parseName), the checked===0 guard, and an
        # end-to-end missing-workflow case.
        run: node scripts/workflows/check-notifier-coverage.test.mjs
      - name: Notifier coverage assertion
        # Asserts that every push-to-main or schedule-only workflow is listed
        # in notify-slack-on-main-failure.yml so failures are never silent.
        # Also triggered by changes to the notifier itself (rootScripts filter
        # above includes the notifier YAML).
        run: node scripts/workflows/check-notifier-coverage.mjs
      - name: Autofix CI trust unit tests
        # Behavioral coverage of scripts/workflows/check-autofix-ci-trust.mjs
        # (trigger/secret detectors, pull_request_target refusal, guard +
        # annotation acceptance).
        run: node scripts/workflows/check-autofix-ci-trust.test.mjs
      - name: Autofix CI trust assertion
        # Machine-authored sentry-autofix/* PRs pass every fork/dependabot
        # check, so every secret-bearing pull_request workflow must either
        # guard against them or document (autofix-ci-trust annotation) why its
        # secrets are unreachable from PR-head code. Issue #1388 — an
        # activation gate for the autofix leg.
        run: node scripts/workflows/check-autofix-ci-trust.mjs
      - name: Platform settings drift unit tests
        # Behavioral coverage of
        # scripts/workflows/check-workflow-permissions-drift.mjs — the decision
        # layer for .github/workflows/platform-settings-drift.yml (issue #1564):
        # ok/drift/malformed classification + CLI exit codes for the daily
        # "default workflow-token permission stays read-only" check.
        run: node scripts/workflows/check-workflow-permissions-drift.test.mjs
      - name: Override prune report self-tests
        # Behavioral coverage of scripts/supply-chain/override-prune-report.mjs
        # (verdict heuristic, lockfile parsing, git-blame age check). The report
        # itself only runs weekly via supply-chain.yml; this required job is
        # what catches a regression in the script on every PR.
        run: node scripts/supply-chain/override-prune-report.test.mjs
      - name: pnpm override selector parser self-tests
        # scripts/lib/pnpm-override-selector.mjs is read by two consumers with
        # opposite failure modes: the lockfile-lint override-range gate fails
        # CI, and the override prune report never fails anything. The suite's
        # dedup assertions fail the moment either consumer stops importing the
        # shared module, so they belong in a required job rather than only in
        # the advisory supply-chain workflow.
        run: node --test scripts/lib/pnpm-override-selector.test.mjs
      - name: Sentry fixture scan canary
        # Issues #1943/#1970, ADR 0068. Proves the four Sentry suites that carry
        # credential-shaped fixtures still scan clean as whole text under
        # scripts/agent-autoreview-core.mjs, and that none of the four paths has
        # vanished. It is NOT a `sentry-*.test.mjs`, so the `sentry-suites` gate
        # neither enumerates nor runs it; this step and the local quality gate
        # are its two routes. The `rootScripts` filter is `scripts/**`, so the
        # scanner, the four suites and the canary itself all admit this job —
        # the same recursive entry every other scripts/ suite here relies on,
        # rather than a new enumerated list to keep in sync.
        run: node scripts/sentry/fixture-scan-canary.test.mjs
      # The Sentry suites used to run here, one step each (issue #1721). They
      # now run in the unconditional `sentry-suites` job, which also proves from
      # their own output that each one asserted (issue #1779, ADR 0062) — a
      # strictly stronger claim than a step existing. Running them in both jobs
      # cost a second copy of the whole set and let the two paths disagree.
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  docs-checks:
    name: Documentation corpus checks
    needs: changes
    # ADR 0072. The nine checks below are the ones in the `scripts` job above
    # whose outcome a Markdown-only diff can change. Six read the live tracked
    # Markdown tree through `git ls-files`; two are unit suites that look like
    # fixture tests but assert against the real tree as well
    # (agent:context-budget:test pins the ten AGENTS.md routes,
    # docs:navigation-eval:test picks the cheapest route by live document
    # bytes); and the gate routing-table suite asserts that the 23 Markdown
    # paths its table names still exist.
    # Three suites stay in `scripts` because they cannot be affected by a
    # Markdown edit at all: docs:audit:test, docs:garden:test and
    # check-agent-context.test.mjs build their fixtures in a temporary
    # repository or stub their inputs.
    # Two more read this checkout and stay in `scripts` anyway, for a reason
    # worth writing down:
    #   - docs:index:test has one live-tree case that builds the inventory
    #     over the tracked Markdown tree and asserts inventory.errors is
    #     empty. That is a strict subset of `pnpm docs:index --check` below,
    #     which fails on errors OR warnings OR broken links, and a deleted or
    #     non-regular runtime document is rejected by the runtime registry
    #     that both carried checks import. No Markdown-only diff fails it while
    #     everything in this job stays green.
    #   - agent:quality-gate:test pins the targeted-Trunk branch on the
    #     tracked file docs/deployment.md, which flips to `--all` once that
    #     path leaves the worktree. docs/deployment.md is also one of the
    #     routing table's staleness subjects, so the gate routing-table step
    #     below fails first on the rename or delete that would break it. That
    #     coupling is transitive, not structural: drop docs/deployment.md from
    #     the routing table and this suite loses its cover.
    # Splitting these out lets a Markdown-only PR finish in
    # minutes instead of waiting on a job capped at 25. Each `run:` string here
    # is byte-identical to its counterpart in `scripts`, and the steps are NOT
    # removed from there: a change to the documentation tooling must still run
    # them against the corpus. A mixed diff runs both jobs and pays for one
    # duplicate pass, which is the accepted cost of the split.
    if: needs.changes.outputs.docs == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Baseline validation reads source blobs from its claimed pre-baseline
          # commit so results remain reproducible after later doc changes. That
          # commit is over a thousand commits behind main, so the default
          # shallow checkout would not hold the object and `git show` would
          # fail outright rather than degrade.
          fetch-depth: 0
      - name: Validate trusted package-script pins
        # The `scripts` job runs this first for two reasons that apply here
        # unchanged: `pnpm install` below executes the root lifecycle hooks,
        # and every step after it invokes a trusted `pnpm` alias
        # (`agent:context-*`, `docs:*`). Validating first rejects an
        # unsanctioned `postinstall` before install would run it, and a drifted
        # alias command before it executes. This job needs its own copy — on a
        # Markdown-only diff the `scripts` job no longer runs at all.
        # check-sentry-suites-in-ci.test.mjs pins this ordering for this job by
        # name, exactly as it does for `scripts`, so moving pnpm-install or an
        # alias above this step fails required CI.
        run: node scripts/check-agent-quality-gate-package-scripts.mjs
      - uses: ./.github/actions/pnpm-install
      - name: Agent context checker
        # Discovers canonical files from the tracked tree, so an added, renamed
        # or removed document changes which files it validates.
        run: pnpm agent:context-check
      - name: Documentation catalog drift and link check
        run: pnpm docs:index --check
      - name: Agent context budget tests
        # Not a pure fixture suite: its last case builds the report from
        # trackedInstructionFiles(repoRoot) against this checkout and pins the
        # route list to the ten AGENTS.md directories that exist today. Adding
        # docs/AGENTS.md or deleting alerts/AGENTS.md is a Markdown-only diff
        # that fails it, and the --strict run below would not catch that: it
        # only enforces byte caps.
        run: pnpm agent:context-budget:test
      - name: Enforce agent context budgets
        # Corpus-dependent for AGENTS.md and AGENTS.override.md specifically:
        # it measures their byte sizes per file and per route.
        run: pnpm agent:context-budget --strict
      - name: Documentation audit planner dry run
        run: pnpm docs:audit --dry-run
      - name: Documentation navigation evaluation tests
        # Also not a pure fixture suite: it loads the live inventory and
        # asserts which accepted route is cheapest in real document bytes, so a
        # content-only edit that grows one document past another flips it. The
        # --check-fixtures run below only rejects paths missing from the
        # inventory, so it would not catch that.
        run: pnpm docs:navigation-eval:test
      - name: Documentation navigation fixture contract
        run: pnpm docs:navigation-eval -- --check-fixtures
      - name: Documentation navigation committed baseline
        run: >-
          pnpm docs:navigation-eval -- --validate
          docs/evals/documentation-navigation-baseline.json
          --fixtures docs/evals/documentation-navigation-baseline-fixtures.json
      - name: Gate routing-table suite
        # ADR 0069's table names 799 repository paths, 23 of them Markdown:
        # eleven of the twelve docs/pr-checklists/*.md (all but
        # review-prompt-exclusions.md), README.md, AGENTS.md, BACKLOG.md,
        # SPEC.md, two ADRs and more. Its staleness check asserts each still
        # exists, so renaming or deleting one of those documents is a
        # Markdown-only diff that breaks the gate. Without this step here, such
        # a PR would merge green and leave the gate pointing reviewers at a
        # document that is not there. This is one of the two non-documentation
        # steps of `scripts` that read the Markdown corpus; it also covers the
        # other one, agent:quality-gate:test, whose docs/deployment.md
        # assertion depends on a path this staleness check already names.
        run: pnpm gate:routing-table:test
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  production-infra-contract:
    name: Production infrastructure contract
    # This required job is deliberately unconditional: tf:test validates
    # deployment and production-infrastructure contracts for every candidate.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Terraform production infrastructure contract
        run: pnpm tf:test
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  sentry-suites:
    name: Sentry suites
    # Unconditional by design (no `if:`): a skipped required check counts as
    # satisfied, so this job — like production-infra-contract — must never be
    # skippable. It runs the Sentry suites itself and proves, from their own
    # output, that each asserted (issue #1779, ADR 0062); the #1754 checker only
    # proves CI *would* run them.
    #
    # The step list is closed-world and its order is load-bearing. The two
    # upstream, SHA-pinned actions are the only things trusted before the gate.
    # `scripts/sentry/gate/sentry-suite-gate.mjs` is the FIRST and ONLY PR-authored code that
    # runs before the suites: `pnpm install` is deliberately ordered AFTER it
    # (the composite action's postinstall is PR-authored code) and there is no
    # other pre-gate step, which closes the R1 window where such a step could
    # append `NODE_OPTIONS=--import=…process.exit(0)` to $GITHUB_ENV and neuter
    # every later suite into a false-green no-op. The gate and every
    # scripts/sentry-*.mjs it spawns import only `node:` builtins, so it needs no
    # install. `env -u NODE_OPTIONS` strips a poisoned value from the gate's own
    # env for defense in depth; the gate additionally refuses to start if
    # NODE_OPTIONS or NODE_PATH is set and re-strips both per spawned suite.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run and assert the Sentry suites
        run: /usr/bin/env -u NODE_OPTIONS -u NODE_PATH node scripts/sentry/gate/sentry-suite-gate.mjs
      # Steps 4-5 run AFTER the gate, and only after it. The install's composite
      # `postinstall` is PR-authored code, so putting it first would restore the
      # R1 window the job exists to close; ordering it here keeps that window
      # shut and still gives the checker the `js-yaml` it needs.
      - uses: ./.github/actions/pnpm-install
      - name: Sentry CI wiring assertion
        # The static half of the pair (issue #1721, relocated by #1779 PR C).
        # The gate above proves the suites ran; it cannot prove its own job still
        # exists, is unconditional, and still reaches the required `ci` context —
        # so this pins that, re-proves the one suite the gate does not run
        # (sentry-provider-contract, via `pnpm tf:test`), and holds the local
        # gate's `sentry:*` allowlist to its pins. It ran in the path-gated
        # `scripts` job until this PR, where a dashboard-only, indexer-only or
        # non-Markdown doc-asset diff skipped it entirely.
        run: node scripts/sentry/ci-wiring/check-sentry-suites-in-ci.test.mjs

  autoreview-suite:
    name: Autoreview adversarial suite
    needs: changes
    if: needs.changes.outputs.autoreviewSuite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: Full sequential autoreview regression suite
        shell: bash
        run: |
          set -euo pipefail
          # setup-node lives below a runner toolcache whose writable ancestry is
          # intentionally rejected by the nested semantic helper. Stage the same
          # native binary under private runner-owned ancestry instead of relaxing
          # runtime trust; the root/container source path has its own focused job.
          trusted_node_dir="$(/usr/bin/mktemp -d "${HOME}/.autoreview-node.XXXXXX")"
          trap '/bin/rm -rf -- "${trusted_node_dir}"' EXIT
          /bin/chmod 0700 "$trusted_node_dir"
          node_source="$(node -p 'process.execPath')"
          /usr/bin/install -m 0500 "$node_source" "$trusted_node_dir/node"
          PATH="$trusted_node_dir:$PATH" pnpm agent:autoreview:test -- --jobs 1
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  autoreview-root-runtime:
    name: Autoreview root-runtime trust
    needs: changes
    if: needs.changes.outputs.autoreviewRootRuntime == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Exercise Blacksmith toolcache Node as root
        shell: bash
        run: |
          set -euo pipefail
          node_path="$(/usr/bin/readlink -f -- "$(command -v node)")"
          case "$node_path" in
            /opt/hostedtoolcache/node/*/x64/bin/node) ;;
            *)
              echo "expected the Blacksmith x64 toolcache Node runtime" >&2
              exit 1
              ;;
          esac
          root_path="${node_path%/node}:/usr/local/bin:/usr/bin:/bin"
          root_prefix=()
          if [[ "$EUID" -ne 0 ]]; then
            root_prefix=(/usr/bin/sudo)
          fi
          "${root_prefix[@]}" /usr/bin/env -i \
            "PATH=$root_path" \
            HOME=/root \
            CI=true \
            LC_ALL=C \
            AUTOREVIEW_TEST_REQUIRE_ROOT_SNAPSHOT=1 \
            AUTOREVIEW_TEST_NODE_SNAPSHOT_DIAGNOSTICS=1 \
            AUTOREVIEW_TEST_TRUSTED_FIXTURE_PARENT=/root \
            "$node_path" scripts/agent-autoreview-target-guard.test.mjs
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  version-skew:
    name: Version skew
    needs: changes
    if: needs.changes.outputs.versionSkew == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Version skew check
        # Required via the `ci` sentinel. Prevents catalog/literal package drift
        # in both agent and non-agent PRs that touch manifests or pnpm config.
        run: pnpm skew:check
      - name: Version skew checker tests
        run: pnpm skew:check:test
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  deps:
    name: Code Health (cross-package)
    needs: changes
    # Run on any workspace change. dep-cruiser is monorepo-wide — the rules
    # for "shared-config must stay a leaf" and "indexer-envio is isolated"
    # only fire when there's a path between packages, so we want every
    # workspace edit to recheck the architecture. Also fires on `codeHealth`
    # (dep-cruiser config + knip configs) so a PR that only edits the
    # rule file is validated against the codebase before merge.
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.indexer == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.integrationProbes == 'true' || needs.changes.outputs.aegis == 'true' || needs.changes.outputs.codeHealth == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: dependency-cruiser (cross-package boundaries, blocking)
        run: pnpm code-health:deps
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  ci:
    name: ci
    needs:
      [
        changes,
        shared,
        ui,
        indexer,
        bridge,
        integration-probes,
        aegis,
        alerts,
        gov-watchdog,
        terraform,
        deps,
        scripts,
        docs-checks,
        production-infra-contract,
        sentry-suites,
        autoreview-suite,
        autoreview-root-runtime,
        version-skew,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: shared,ui,indexer,bridge,integration-probes,aegis,alerts,gov-watchdog,terraform,deps,scripts,docs-checks,autoreview-suite,autoreview-root-runtime,version-skew
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()
