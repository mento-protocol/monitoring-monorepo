  # Registry-backed Terraform validation inside the required `ci` sentinel.
  # The separate `Infra` workflow prints richer stack summaries and validates
  # the same roots, but it is not part of the branch-protection sentinel.
  terraform:
    name: Terraform Validate (registry)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deviation threshold drift check
        run: node scripts/alerts/check-deviation-threshold-drift.mjs
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      # Terraform tests can execute PR-controlled provisioners. Run the Peg
      # assertions before any backend or cloud authentication, so the required
      # ci sentinel retains PR coverage without exposing credentials.
      - name: Test Peg rule definitions
        if: github.event_name == 'pull_request'
        working-directory: alerts/rules
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color
      - name: Validate changed stacks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            matrix="$(node scripts/tf-stacks.mjs changed --base "origin/${BASE_REF}" --head HEAD --json)"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            matrix="$(node scripts/tf-stacks.mjs changed --base "$BEFORE_SHA" --head HEAD --json)"
          else
            matrix="$(node scripts/tf-stacks.mjs changed --json)"
          fi

          count="$(node -e 'const m = JSON.parse(process.argv[1]); console.log(m.include.length)' "$matrix")"
          if [[ "$count" == "0" ]]; then
            echo "No Terraform stacks changed."
            exit 0
          fi

          stack_ids="$(node -e 'const m = JSON.parse(process.argv[1]); for (const s of m.include) console.log(s.id)' "$matrix")"
          while IFS= read -r stack; do
            [[ -n "$stack" ]] || continue
            node scripts/tf-stacks.mjs validate "$stack"
          done <<< "$stack_ids"
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

