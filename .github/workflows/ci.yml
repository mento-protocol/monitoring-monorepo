name: CI

# Aggregate workflow fanning out to package-scoped quality jobs gated on
# path changes. The `ci` sentinel aggregates the results so branch
# protection needs only one required check (`CI / ci`) instead of one per
# package. A PR that only touches ui-dashboard/ runs the `ui` job and the
# unconditional production-infrastructure contract; other irrelevant jobs skip
# cleanly (GitHub hides them from the checks list).
#
# Third-party actions are pinned to commit SHAs per the policy in
# .github/workflows/claude.yml — update via Dependabot
# (.github/dependabot.yml).
#
# autofix-ci-trust: the only repository secret here is CODECOV_TOKEN. It is
# step-scoped to the pinned codecov-action's `with: token`, but each package
# quality job runs the PR's build and tests EARLIER in the SAME job, and that
# PR-head code can write $GITHUB_ENV/$GITHUB_PATH to influence the later upload
# step — so step-scoping alone does not isolate the token from PR-controlled
# code (issue #1453). Therefore every codecov upload step additionally carries
# `if: !startsWith(github.event.pull_request.head.ref, 'sentry-autofix/')`: on a
# machine-authored sentry-autofix/* PR the upload step never runs, so
# CODECOV_TOKEN is never interpolated and never enters the runner while the
# autofix diff builds or tests. Every checkout also sets
# `persist-credentials: false`, so no checkout token sits in .git/config either.
# See check-autofix-ci-trust.mjs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Concurrency: on PRs, group by ref so new pushes to a PR cancel in-flight
# runs. On push to main (or any non-PR event), group by SHA so each commit
# gets its own run and main-branch runs never cancel each other. Prevents
# a fast-follow merge from cancelling a still-running main CI — important
# because main CI acts as the quality gate for the trust-main deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      # dorny/paths-filter reads PR file lists through the Pulls API.
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      ui: ${{ steps.filter.outputs.ui }}
      indexer: ${{ steps.filter.outputs.indexer }}
      bridge: ${{ steps.filter.outputs.bridge }}
      integrationProbes: ${{ steps.filter.outputs.integrationProbes }}
      aegis: ${{ steps.filter.outputs.aegis }}
      alerts: ${{ steps.filter.outputs.alerts }}
      govWatchdog: ${{ steps.filter.outputs.govWatchdog }}
      terraform: ${{ steps.filter.outputs.terraform }}
      codeHealth: ${{ steps.filter.outputs.codeHealth }}
      rootScripts: ${{ steps.filter.outputs.rootScripts }}
      docs: ${{ steps.filter.outputs.docs }}
      autoreviewSuite: ${{ steps.filter.outputs.autoreviewSuite }}
      autoreviewRootRuntime: ${{ steps.filter.outputs.autoreviewRootRuntime }}
      versionSkew: ${{ steps.filter.outputs.versionSkew }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # scripts/eslint-baseline-diff.mjs is the per-package lint
            # wrapper. Any change to it needs to re-run every package's lint
            # so a broken wrapper can't merge silently — see PR-423 codex
            # finding (Run package lint when the lint gate changes).
            shared:
              - shared-config/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            ui:
              - ui-dashboard/**
              - shared-config/**
              # GraphQL contract test validates dashboard queries against the
              # indexer schema, so schema-only PRs must run the ui job. The
              # shared Envio stub fragment feeds the same buildSchema() call.
              - indexer-envio/schema.graphql
              - scripts/envio-schema-stubs.graphql
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            # shared-config/** is included in the indexer filter because
            # indexer-envio/test/fx-calendar.test.ts and
            # indexer-envio/test/deployment-namespaces.test.ts deep-equal
            # the vendored copies in indexer-envio/config/*.json against the
            # shared-config originals (the indexer builds outside the pnpm
            # workspace — see indexer-envio/src/healthScore.ts). The indexer
            # does NOT import shared-config at runtime.
            indexer:
              - indexer-envio/**
              - shared-config/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            bridge:
              - metrics-bridge/**
              - shared-config/**
              # GraphQL contract test validates bridge queries against the
              # indexer schema, so schema-only PRs must run the bridge job. The
              # shared Envio stub fragment feeds the same buildSchema() call.
              - indexer-envio/schema.graphql
              - scripts/envio-schema-stubs.graphql
              - scripts/eslint-baseline-diff.mjs
              - cloudbuild.yaml
              - .gcloudignore
              - .node-version
              - pnpm-workspace.yaml
              - pnpm-lock.yaml
              - package.json
              - patches/**
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            integrationProbes:
              - integration-probes/**
              - shared-config/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/workflows/integration-probes.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            aegis:
              - aegis/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .gitmodules
              - .github/workflows/ci.yml
              - .github/workflows/aegis-app-engine.yml
              - .github/actions/pnpm-install/**
              - .github/actions/resolve-eslint-baseline/**
            terraform:
              # Coarse admission only. `scripts/tf-stacks.mjs` classifies the
              # exact stacks after this job starts. Keep this list equal to
              # terraform.stacks.json `workflowAdmissionPatterns`; `pnpm
              # tf:test` enforces equality and registry-pattern subsumption.
              - terraform/**
              - alerts/**
              - aegis/**
              - governance-watchdog/**
              - metrics-bridge/**
              - scripts/**
              - .github/workflows/**
              - terraform.stacks.json
            alerts:
              - alerts/infra/onchain-event-handler/**
              - alerts/infra/oncall-announcer/**
              - alerts/infra/scripts/**
              # Listener filter feeds into the handler — a regression like
              # dropping blockHash from the QuickNode filter would silently
              # break cross-chain chain detection in the handler, and the
              # 38 vitest cases cover that behavior. Trigger the alerts job
              # on listener + channel changes too.
              - alerts/infra/onchain-event-listeners/**
              - alerts/infra/channels/**
              - alerts/infra/sentry-ingest-watcher/**
              - alerts/infra/*.tf
              - shared-config/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
            # Governance Watchdog Cloud Function. Deploys as a standalone
            # source root (package-local pnpm-lock.yaml), so its quality job
            # installs from that lockfile like the alerts functions.
            govWatchdog:
              - governance-watchdog/**
              - scripts/eslint-baseline-diff.mjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
            # Code-health policy files. A PR that touches ONLY the dep-cruiser
            # rules or a package's knip config would otherwise leave all four
            # package filters false → the cross-package `deps` job would skip
            # → blocking architecture rule changes ship unvalidated. This
            # filter fires the `deps` job whenever the policy itself moves.
            codeHealth:
              - .dependency-cruiser.cjs
              - "*/knip.json"
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
            # Root scripts ESLint job. Per-package lint runs inside each
            # workspace and never reaches repo-root scripts/*. This filter
            # fires the standalone scripts-lint job so `no-undef`, unused
            # imports, and syntax issues in build/quality scripts can't
            # merge unnoticed — see PR-423 codex finding (Keep root scripts
            # under ESLint).
            rootScripts:
              # `scripts/**` matches every path under scripts/ at any depth,
              # including the extensionless directory symlinks the extension
              # globs below miss. The extension globs stay to document the
              # common cases this filter targets.
              - scripts/**
              - scripts/**/*.mjs
              - scripts/**/*.cjs
              - scripts/**/*.js
              - scripts/**/*.sh
              # The React Doctor wrappers live with the package they drive, but
              # agent-quality-gate.test.sh copies and executes the diff wrapper
              # in a stub repo. Without these two paths a wrapper edit would
              # skip the suite that proves its branch cleanup.
              - ui-dashboard/scripts/check-react-doctor-diff.sh
              - ui-dashboard/scripts/check-react-doctor-score.sh
              # CodeRabbit reads .coderabbit.yaml from the PR's own source
              # branch and its findings feed the pr:feedback-state ledger, so a
              # config-only PR must still run the allowlist pin below. Without
              # this entry the whole scripts job skips and the pin never runs.
              - .coderabbit.yaml
              - docs/evals/documentation-navigation-*.json
              - .lighthouserc.cjs
              - "**/vitest.hermetic-setup.ts"
              - "**/vitest.config.ts"
              - "**/vitest.mutation.config.ts"
              # These deployment and Terraform inputs also exercise root-script
              # regression suites. The dedicated unconditional job below owns
              # `pnpm tf:test` for the production-infrastructure contract.
              - terraform/**
              - aegis/terraform/**
              - aegis/bin/deploy.sh
              - aegis/grafana-agent/deploy.sh
              - aegis/grafana-agent/cloudbuild.yaml
              - alerts/infra/**
              - alerts/peg-policy-publication/**
              - governance-watchdog/infra/**
              # Alert-rules lint inputs: the scripts job parses alerts/rules
              # PromQL and cross-checks metric names against the metrics-bridge
              # gauge registry. This is also the fifth Terraform root covered
              # by the production infrastructure identity contract.
              - alerts/rules/**
              - metrics-bridge/src/metrics.ts
              - metrics-bridge/src/cdp-metrics.ts
              - metrics-bridge/src/peg/metrics.ts
              - terraform.stacks.json
              - eslint.config.mjs
              - .dependency-cruiser.cjs
              - pnpm-lock.yaml
              - package.json
              - pnpm-workspace.yaml
              - patches/**
              - .node-version
              # Notifier coverage check re-runs when any workflow changes —
              # a new workflow with push-main or schedule must be caught even
              # if only the new workflow file is touched (no script change).
              # check-autofix-ci-trust.mjs also reads workflow files rather than
              # scripts, scanning every one for PR-reachable secrets. Narrowing
              # this glob would let a workflow-only edit skip the checks that
              # exist to guard it.
              - .github/workflows/**
              # Local composite actions feed this job's steps — the install
              # action and the ESLint-baseline resolver below. An edit to any of
              # them must re-run it, so this covers all of them.
              - .github/actions/**
              # The baseline-resolve composite exports ESLINT_BASELINE_MAIN,
              # consumed by scripts/eslint-baseline-diff.mjs — the scripts
              # job's baseline-diff semantic suite must re-run when the
              # producing action changes.
              - .github/actions/resolve-eslint-baseline/**
              # Skill parity and hook checks consume non-Markdown assets
              # under the runtime-specific directories. The two Markdown globs
              # that used to sit here now live in the `docs` filter below
              # (ADR 0072): a Markdown-only diff runs the small `docs-checks`
              # job, which carries nine of the eleven checks in this job that
              # read the Markdown corpus — the two left behind fail only when a
              # carried check fails. Markdown that arrives alongside any path
              # above still sets both filters, and both jobs run — including a
              # Markdown-only edit under `.agents/**` or `.claude/skills/**`,
              # which those globs still route here for their non-Markdown
              # contents.
              - ".agents/**"
              - ".claude/skills/**"
              - .claude/settings.json
              - .codex/config.toml
              - .codex/hooks.json
            # Markdown corpus, plus the two non-Markdown inputs the
            # `docs-checks` job itself is built from. The Markdown globs are
            # the ones relocated out of `rootScripts` above, byte-identical, so
            # they match exactly what they matched there: `**/*.md` covers
            # documents in dot-directories such as `.github/`, and
            # dorny/paths-filter reports added, modified, renamed and deleted
            # files alike, so a removed or renamed document still fires the
            # job. ci.yml holds the job definition and pnpm-install is the
            # composite its steps run on: without those two entries a PR that
            # edits the job — its fetch-depth, its permissions, a step command
            # — would set only `rootScripts`, and the edited job would ship
            # without ever having run. Every other filter in this file lists
            # ci.yml for that same reason. Beyond those two, keep this filter
            # to Markdown: any other non-Markdown input belongs in the filter
            # of the job that consumes it.
            docs:
              - "*.md"
              - "**/*.md"
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
            # The adversarial autoreview suite is intentionally isolated from
            # the broader root-scripts job: it is expensive, path-specific,
            # and runs sequentially in CI for deterministic fixture/process
            # cleanup. The local quality gate may orchestrate the same complete
            # family set in parallel.
            autoreviewSuite:
              - scripts/agent-autoreview.sh
              - scripts/agent-autoreview.mjs
              - scripts/agent-autoreview-core.mjs
              - scripts/agent-autoreview-core.test.mjs
              - scripts/agent-autoreview-target-guard.test.mjs
              - scripts/agent-autoreview.test.sh
              - package.json
              - .node-version
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
            # Focused x64 Blacksmith proof for the Linux/root Node trust path.
            # Keep this separate from the broader scripts job so a regression
            # cannot skip unrelated root suites and does not need pnpm install.
            autoreviewRootRuntime:
              - scripts/agent-autoreview.sh
              - scripts/agent-autoreview*.mjs
              - .node-version
              - .github/workflows/ci.yml
            # Dependency manifest and pnpm catalog/lifecycle policy drift.
            # This runs independently of package quality jobs so a manifest-only
            # PR cannot satisfy the required `ci` sentinel while bypassing the
            # catalog-vs-literal version invariant.
            versionSkew:
              - package.json
              - "**/package.json"
              - pnpm-workspace.yaml
              - "**/pnpm-workspace.yaml"
              - patches/**
              # Enumerated on purpose: this job runs one checker, and widening
              # to scripts/supply-chain/** would fire it on every lockfile-lint
              # or audit-gate edit. An enumerated filter goes silent when a file
              # moves, so both paths move with the checker in the same PR.
              - scripts/supply-chain/version-skew-check.mjs
              - scripts/supply-chain/version-skew-check.test.mjs
              - .github/workflows/ci.yml
              - .github/actions/pnpm-install/**
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  shared:
    name: Quality Checks (shared-config)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Resolve main baseline (PR baseline-growth check)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/resolve-eslint-baseline
        with:
          package-path: shared-config
      - name: Typecheck
        run: pnpm --filter @mento-protocol/config typecheck
      - name: Lint
        run: pnpm --filter @mento-protocol/config lint
      - name: Deviation threshold drift check
        run: node scripts/alerts/check-deviation-threshold-drift.mjs
      - name: Knip (dead-code / dep hygiene, blocking)
        run: pnpm --filter @mento-protocol/config knip
      - name: Test with coverage
        run: pnpm --filter @mento-protocol/config test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'sentry-autofix/') }}
        with:
          fail_ci_if_error: false
          flags: config
          directory: shared-config/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  ui:
    name: Quality Checks (ui-dashboard)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # react-doctor --diff needs the base ref's history to compute the
          # changed-files set against origin/${{ github.base_ref }}.
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: Resolve main baseline (PR baseline-growth check)
        if: github.event_name == 'pull_request'
        # ui-dashboard uses checkout fetch-depth=0, so origin/main is
        # already available without an extra fetch.
        uses: ./.github/actions/resolve-eslint-baseline
        with:
          package-path: ui-dashboard
          fetch-main: "false"
      - name: GraphQL codegen
        run: pnpm --filter @mento-protocol/ui-dashboard codegen
      - name: Verify generated GraphQL types are committed
        run: |
          if [[ -n "$(git status --porcelain -- ui-dashboard/src/lib/__generated__/graphql.ts)" ]]; then
            git status --short -- ui-dashboard/src/lib/__generated__/graphql.ts
            echo "::error::Generated GraphQL types are not committed. Run pnpm dashboard:codegen and commit the result."
            exit 1
          fi
      - name: Typecheck
        run: pnpm --filter @mento-protocol/ui-dashboard typecheck
      - name: Lint
        # Diff-aware baseline check: prune-only, fails on any new or stale tuple.
        # Trunk no longer runs ESLint — this is the CI ESLint source of truth.
        run: pnpm --filter @mento-protocol/ui-dashboard lint
      - name: Knip (dead-code / dep hygiene, blocking)
        run: pnpm --filter @mento-protocol/ui-dashboard knip
      - name: React Doctor (diff vs base)
        # PR-only: scans files changed vs the PR base and fails on any
        # warning/error in those files. The full-score floor below keeps the
        # dashboard at 100 / 100; accepted project-wide silences live in
        # ui-dashboard/react-doctor.config.json.
        #
        # `git switch -c` reattaches HEAD to a named branch:
        # actions/checkout for PRs leaves us on a detached merge commit, and
        # react-doctor's `getDiffInfo` returns null when
        # `git rev-parse --abbrev-ref HEAD` is "HEAD", silently falling back
        # to a full scan that would surface the entire backlog.
        if: github.event_name == 'pull_request'
        run: |
          git switch -c __react_doctor_scan
          pnpm --filter @mento-protocol/ui-dashboard react-doctor --diff origin/${{ github.base_ref }} --fail-on warning --annotations --offline
      - name: React Doctor score floor
        run: |
          score="$(pnpm --filter @mento-protocol/ui-dashboard react-doctor --full --score --offline | tail -n 1 | tr -d '[:space:]')"
          if [ "$score" != "100" ]; then
            echo "Expected ui-dashboard react-doctor score 100, got ${score}" >&2
            exit 1
          fi
      - name: Test with coverage
        run: pnpm --filter @mento-protocol/ui-dashboard test:coverage
      - name: Cache Playwright Chromium
        # `playwright install chromium` re-downloads ~130 MB on every run
        # otherwise (~84s of uncached CI time). The cache key hashes BOTH
        # `ui-dashboard/package.json` (the version range, e.g. `^1.60.0`)
        # AND `pnpm-lock.yaml` (the resolved version pnpm actually picks).
        # Keying on package.json alone misses lockfile-only
        # `@playwright/test` updates within the caret range — in that case
        # the key would stay constant while the Chromium revision Playwright
        # wants flips, so every run restores the stale cache, the install
        # step re-downloads, but actions/cache won't re-save under the
        # already-hit key, so the next run re-downloads again indefinitely.
        # Hashing the lockfile makes the key flip on any real Playwright
        # version bump. Mirrors the proven step in lighthouse.yml.
        #
        # `runner.arch` is in the key so a runner-architecture change (e.g.
        # an ARM migration) can never restore another arch's Chromium —
        # binaries are arch-specific, and `playwright install` validates
        # version, not architecture, so a cross-arch restore would pass
        # validation and then die with an exec-format error.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.arch }}-${{ hashFiles('ui-dashboard/package.json', 'pnpm-lock.yaml') }}
          # `restore-keys` lets an unrelated lockfile or `package.json`
          # edit still reuse the most recent chromium cache instead of
          # triggering a ~130 MB fresh download. `playwright install` then
          # fast-validates the existing binary against the version it wants
          # (no-op on match, re-download only on a real Playwright version
          # bump). `--with-deps` still installs OS libraries (fast).
          restore-keys: |
            playwright-chromium-${{ runner.arch }}-
      - name: Install Playwright Chromium
        run: pnpm --filter @mento-protocol/ui-dashboard exec playwright install --with-deps chromium
      - name: Browser interaction tests
        run: pnpm --filter @mento-protocol/ui-dashboard test:browser
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-snapshot-diffs
          path: ui-dashboard/test-results/
          retention-days: 7
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'sentry-autofix/') }}
        with:
          fail_ci_if_error: false
          flags: ui-dashboard
          directory: ui-dashboard/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

  indexer:
    name: Quality Checks (indexer-envio)
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      checks: write
      contents: read
      actions: read
    # Job-level env so it's visible to both typecheck and tests. Tests import
    # EventHandlers.ts, which triggers runStartupChecks() at module load — with
    # strict=true, a start-block misconfiguration throws and fails CI before
    # reaching deploy. Codegen doesn't import EventHandlers, so the var is
    # inert there; scoping it to the job keeps the intent in one place.
    env:
      ENVIO_STRICT_START_BLOCK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      # Envio codegen output is deterministic on (envio version, config*.yaml,
      # schema.graphql, abis). v3 emits to `.envio/types.d.ts`, which the
      # tracked `envio-env.d.ts` triple-slash references — both `tsc` and
      # vitest depend on it being present. Cache the .envio/ dir keyed on
      # those inputs so PRs that don't touch indexer configs skip the 2-3
      # minute codegen pass entirely. src/** is intentionally NOT in the key
      # — handler code doesn't affect codegen output, and including it would
      # invalidate the cache on every indexer PR (the common case), defeating
      # the cache.
      - name: Cache Envio .envio/
        id: cache-generated
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: indexer-envio/.envio
          key: envio-generated-v3-${{ runner.os }}-${{ hashFiles('indexer-envio/config*.yaml', 'indexer-envio/schema.graphql', 'indexer-envio/package.json', 'indexer-envio/abis/**', 'indexer-envio/scripts/**') }}
      - name: Validate YAML address drift
        # Every hex address in config*.yaml must resolve to either
        # @mento-protocol/contracts, indexer-envio/config/nttAddresses.json,
        # or the inline ALLOWLIST. Runs before codegen so address drift
        # (e.g. an upstream rename of StabilityPool proxy/impl) fails loud
        # in <1s instead of going undetected until indexing breaks.
        # The script reads only the committed YAMLs + package files — no
        # untrusted PR input is interpolated into shell.
        run: pnpm --filter @mento-protocol/indexer-envio check:yaml-addresses
      - name: Validate all Envio configs (codegen)
        # Run codegen against every config file to catch schema/config drift
        # early. config.multichain.mainnet.yaml is run last — its output is
        # used by typecheck + tests below.
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @mento-protocol/indexer-envio codegen --config config.multichain.testnet.yaml
          pnpm --filter @mento-protocol/indexer-envio codegen --config config.multichain.mainnet.yaml
      - name: Test reserve-yield event indexer
        # The reserve-yield event suites are intentionally skipped by the
        # normal test:coverage command. Run the dedicated wrapper in CI so the
        # Ethereum sUSDS/stETH accounting paths stay covered after mainnet
        # codegen.
        run: pnpm --filter @mento-protocol/indexer-envio indexer:reserve-yield:test
      - name: Resolve main baseline (PR baseline-growth check)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/resolve-eslint-baseline
        with:
          package-path: indexer-envio
      - name: Typecheck
        run: pnpm --filter @mento-protocol/indexer-envio typecheck
      - name: Lint
        # Diff-aware baseline check: prune-only, fails on any new or stale tuple.
        run: pnpm --filter @mento-protocol/indexer-envio lint
      - name: Knip (dead-code / dep hygiene, blocking)
        run: pnpm --filter @mento-protocol/indexer-envio knip
      - name: Validate indexer invariant routing inventory
        run: node --test scripts/gate/routing-table/indexer-invariant-parity.test.mjs
      - name: Test with coverage
        run: pnpm --filter @mento-protocol/indexer-envio test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'sentry-autofix/') }}
        with:
          fail_ci_if_error: false
          flags: indexer-envio
          directory: indexer-envio/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()

