name: writer-env-secret-probe
on:
 push:
 branches: ['probe/**']
permissions:
 contents: read
jobs:
 probe:
 runs-on: ubuntu-latest
 environment: sentry-pipeline
 steps:
 - name: Report whether the env secret was injected (never prints the value)
 env:
 S: ${{ secrets.SENTRY_TRIAGE_TOKEN }}
 run: |
 if [ -n "$S" ]; then
 echo "PROBE_RESULT=SECRET_REACHED_NONADMIN"
 else
 echo "PROBE_RESULT=SECRET_WITHHELD_FROM_NONADMIN"
 fi
