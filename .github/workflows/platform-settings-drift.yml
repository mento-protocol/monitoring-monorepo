name: Platform Settings Drift Detection

# Daily lightweight check that HIGH-VALUE platform-managed repository SETTINGS
# have not been reverted out-of-band (issues #1564 and #2091). Companion to
# terraform-drift.yml, which runs `terraform plan` per stack: the `platform`
# stack (terraform/) is manual plan/apply and deliberately NOT in that matrix.
# A full platform plan would need the whole platform secret set — Vercel/Upstash
# tokens, the App private key, and the Administration-scoped GitHub PAT — in an
# unattended CI job, exactly the standing surface #1557 removed. Instead this
# asserts the narrow invariants #1557 and #2091 pin, through read-only REST
# calls.
#
# INVARIANT (#1564, #1557): the repo default GitHub Actions workflow-token
# permission stays `read` (and token PR-approval stays disabled). The autofix
# CI-trust checker (scripts/workflows/check-autofix-ci-trust.mjs) treats a job
# with no explicit `permissions:` as having no write scope — true ONLY while the
# repo default is read-only. A manual flip to `write` silently breaks that
# assumption; this catches it within a day and opens a `drift-detection` issue,
# mirroring terraform-drift's issue UX.
#
# INVARIANT (#2091): after the approved platform apply, the unchanged core
# ruleset, the `controlled-main-lifecycle` ruleset, and the main-only
# `dependabot-merge` Environment match their exact pinned shapes. The lifecycle
# ruleset covers creation, update, and deletion. It lets only the human merge
# Team and the dedicated repository-scoped Dependabot merge App bypass those
# lifecycle rules. The Environment disables admin bypass, uses one exact
# `main` branch policy, and exposes only the two reviewed secret names. The
# audit never reads a public key or secret value. The core ruleset stays
# unmanaged until the GitHub provider can preserve
# `require_extra_approval_for_unattributed_changes` losslessly.
#
# CREDENTIAL. The reads hit `GET /repos/{owner}/{repo}/actions/permissions/
# workflow`, repository ruleset list/detail endpoints, and the Dependabot merge
# Environment detail, deployment-policy, and secret-name endpoints. They
# require Administration:Read, Actions:Read, and Environments:Read.
# Authenticated by the
# dedicated `PLATFORM_SETTINGS_AUDIT_TOKEN` secret — a fine-grained PAT with
# Administration:Read, Actions:Read, and Environments:Read on THIS repo only,
# scoped to the `sentry-pipeline`
# GitHub Environment and modeled by the platform stack
# (terraform/github-environment.tf). Deliberately NOT the autofix App (whose minimal
# Contents+PR trust boundary we do not widen) and NOT the CI `TF_VAR_github_token`
# (which must not gain administration). Read-only by design: it can never CHANGE
# a setting. The ruleset check may be inert only while
# `terraform/main-lifecycle-boundary-policy.json` keeps its reviewed activation
# flag false. After activation, a missing credential fails the workflow.
# Runbook: docs/notes/local-agent-github-app-credential.md.

on:
  schedule:
    # Daily at 05:41 UTC — after terraform-drift's 05:23 leg, off-the-hour to
    # dodge GitHub scheduler contention.
    - cron: 41 5 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Assert read-only default workflow-token permission
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    # workflow_dispatch can target any ref; without this a manual dispatch from a
    # feature branch would check out that branch and run its code with the
    # Administration-scoped PLATFORM_SETTINGS_AUDIT_TOKEN in scope. Restrict the
    # secret-bearing job to main. Matches sentry-triage-ingest.yml /
    # sentry-triage-archive.yml. (Scheduled runs are always on the default
    # branch, so this only ever narrows manual dispatch.)
    if: github.ref == 'refs/heads/main'
    # sentry-pipeline Environment (issue #1289): its main-only deployment-branch
    # policy makes PLATFORM_SETTINGS_AUDIT_TOKEN access server-enforced — a
    # branch-modified workflow_dispatch on a non-main ref is refused before this
    # job runs, even if the `if:` main guard above is stripped on that branch.
    environment: sentry-pipeline
    permissions:
      contents: read
      issues: write
      # Read-only, for the actions-timeline post step's getWorkflowRun /
      # listJobsForWorkflowRunAttempt calls — an explicit permissions block
      # sets every unlisted scope (incl. actions) to none, so without this the
      # post step 403s and reddens every run. Matches terraform-drift.yml.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read live setting and evaluate drift
        id: check
        env:
          # The dedicated Administration:Read PAT — used ONLY to read the setting.
          # Issue writes below use github.token (issues: write), never this token.
          AUDIT_TOKEN: ${{ secrets.PLATFORM_SETTINGS_AUDIT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_TOKEN}" ]; then
            echo "::notice::PLATFORM_SETTINGS_AUDIT_TOKEN not provisioned — platform-settings drift check is inert (see terraform/github-environment.tf + docs/notes/sentry-triage-pipeline.md)."
            echo "state=inert" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A present-but-rejected token (401/403 — expired or revoked PAT, or
          # missing administration:read) is an OPERATIONAL problem, not drift:
          # fail loud so the red scheduled run signals "rotate the audit token",
          # never a false drift issue. Only a clean 200 feeds the evaluator.
          set +e
          resp=$(GH_TOKEN="${AUDIT_TOKEN}" gh api "repos/${REPO}/actions/permissions/workflow" 2>/tmp/gh-err)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not read actions/permissions/workflow with PLATFORM_SETTINGS_AUDIT_TOKEN (gh exit $rc) — token expired/revoked or lacking administration:read. Rotate it in terraform.tfvars and apply the platform stack."
            sed 's/[A-Za-z0-9_-]\{20,\}/[REDACTED]/g' /tmp/gh-err >&2 || true
            exit 1
          fi

          set +e
          verdict=$(printf '%s' "${resp}" | node scripts/workflows/check-workflow-permissions-drift.mjs)
          vc=$?
          set -e
          echo "${verdict}"
          {
            echo "verdict<<VERDICT_EOF"
            echo "${verdict}"
            echo "VERDICT_EOF"
          } >> "$GITHUB_OUTPUT"

          case "${vc}" in
            0)
              echo "state=ok" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "state=drift" >> "$GITHUB_OUTPUT"
              echo "::warning::Platform setting drift detected — opening/updating a drift-detection issue."
              ;;
            *)
              echo "::error::check-workflow-permissions-drift.mjs failed (exit ${vc}) — malformed API response; investigate the workflow logs."
              exit 1
              ;;
          esac

      - name: Read live main lifecycle boundary and evaluate drift
        id: rulesets
        env:
          # The same dedicated repository-scoped read-only PAT.
          # It performs only GET requests. Issue writes use github.token.
          GH_TOKEN: ${{ secrets.PLATFORM_SETTINGS_AUDIT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          policy="terraform/main-lifecycle-boundary-policy.json"
          audit_active=$(jq -r '
            if (.ruleset_audit_active | type) == "boolean" then
              .ruleset_audit_active | tostring
            else
              error("ruleset_audit_active must be boolean")
            end
          ' "$policy")
          if [ "${audit_active}" = "false" ]; then
            echo "::notice::Main-ruleset drift audit is source-disabled pending the approved cutover."
            echo "state=inert" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Main-lifecycle audit is active but PLATFORM_SETTINGS_AUDIT_TOKEN is absent. Provision the repository-scoped Administration:Read, Actions:Read, and Environments:Read credential through the approved platform plan/apply."
            exit 1
          fi

          set +e
          captured=$(node scripts/workflows/read-main-rulesets.mjs)
          capture_rc=$?
          set -e
          if [ "$capture_rc" -ne 0 ]; then
            echo "::error::Could not read the main lifecycle boundary with PLATFORM_SETTINGS_AUDIT_TOKEN — token expired/revoked, lacks a required read permission, or GitHub returned malformed data. Rotate it through the platform stack or inspect the fixed-error log."
            exit 1
          fi

          set +e
          verdict=$(
            printf '%s' "${captured}" |
              node scripts/workflows/check-main-rulesets-drift.mjs
          )
          vc=$?
          set -e
          echo "${verdict}"
          {
            echo "verdict<<VERDICT_EOF"
            echo "${verdict}"
            echo "VERDICT_EOF"
          } >> "$GITHUB_OUTPUT"

          case "${vc}" in
            0)
              echo "state=ok" >> "$GITHUB_OUTPUT"
              echo "main-lifecycle-boundary-audit state=ok"
              ;;
            2)
              echo "state=drift" >> "$GITHUB_OUTPUT"
              echo "::warning::Main lifecycle boundary drift detected — opening/updating a drift-detection issue."
              ;;
            *)
              echo "::error::check-main-rulesets-drift.mjs failed (exit ${vc}) — malformed boundary API response; investigate the workflow logs."
              exit 1
              ;;
          esac

      - name: Ensure drift labels exist
        if: ${{ !cancelled() && (steps.check.outputs.state == 'drift' || steps.rulesets.outputs.state == 'drift') }}
        env:
          GH_TOKEN: ${{ github.token }}
        # `github.rest.issues.create()` SILENTLY DROPS unknown label names, so a
        # missing label would make the issue land unlabelled and the next run's
        # dedup miss it — creating a duplicate every cycle. `gh label create
        # --force` is idempotent. Same labels as terraform-drift so platform
        # setting drift lands in the same triage view.
        run: |
          set -euo pipefail
          gh label create "drift-detection" --color "d73a4a" --description "Terraform drift detected by scheduled workflow" --force
          gh label create "stack:platform" --color "0e8a16" --description "Affects Terraform stack: platform" --force

      - name: Open or update drift issue
        if: ${{ !cancelled() && steps.check.outputs.state == 'drift' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
        with:
          script: |
            const verdict =
              process.env.VERDICT || "(evaluator produced no output — see workflow logs)";

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const now = new Date().toISOString();

            // A DISTINCT marker from terraform-drift's `terraform-drift-stack:*`
            // so this API-based check and a future platform terraform-plan drift
            // never fight over one issue, while sharing the `drift-detection` +
            // `stack:platform` labels for a single triage surface.
            const marker = "<!-- platform-settings-drift:workflow-permissions -->";

            const body =
              `**Stack:** \`platform\` (repository settings)\n` +
              `**Check:** default GitHub Actions workflow-token permission\n` +
              `**Last checked:** ${now}\n` +
              `[Full workflow logs](${runUrl})\n\n` +
              `A platform-managed repository setting no longer matches the value ` +
              `pinned in Terraform (\`github_workflow_repository_permissions.default_read\`, ` +
              `#1557). Either it was reverted out-of-band, or there is code on ` +
              `\`main\` that has not been applied. Re-assert it with ` +
              `\`pnpm tf apply platform -- -auto-approve\` from a clean \`main\` checkout after explicit human approval.\n\n` +
              `**Why it matters:** \`scripts/workflows/check-autofix-ci-trust.mjs\` assumes a ` +
              `job with no explicit \`permissions:\` has no write scope, which holds ` +
              `only while the repo default workflow-token permission is \`read\`.\n\n` +
              `<details><summary>Check output</summary>\n\n` +
              `\`\`\`\n${verdict}\n\`\`\`\n` +
              `</details>\n\n` +
              `${marker}`;

            const labels = ["drift-detection", "stack:platform"];

            // Dedup on the immutable marker, NOT on the labels: a human removing
            // either label from the open issue must not make the next run miss it
            // and open a duplicate. Scan all open issues (this step only runs on
            // the rare drift event, so the full walk is cheap) and skip PRs,
            // which listForRepo also returns.
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );

            const existing = issues.find(
              (i) => !i.pull_request && i.body && i.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              // Re-assert the drift labels additively (addLabels, not update's
              // replacing `labels`) so a stripped label is restored without
              // clobbering any triage labels a human added.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                labels,
              });
              console.log(`Updated existing drift issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Platform settings drift: default workflow-token permission",
                body,
                labels,
              });
              console.log(`Opened drift issue #${created.data.number}`);
            }

      - name: Open or update main-lifecycle-boundary drift issue
        if: ${{ !cancelled() && steps.rulesets.outputs.state == 'drift' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERDICT: ${{ steps.rulesets.outputs.verdict }}
        with:
          script: |
            const verdict =
              process.env.VERDICT || "(evaluator produced no output — see workflow logs)";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const marker = "<!-- platform-settings-drift:main-rulesets -->";
            const body =
              `**Stack:** \`platform\` (main lifecycle boundary)\n` +
              `**Check:** controlled main lifecycle boundary\n` +
              `**Last checked:** ${now}\n` +
              `[Full workflow logs](${runUrl})\n\n` +
              `The live repository rulesets or protected Dependabot merge Environment differ ` +
              `from the approved source. This can ` +
              `also mean that code on \`main\` has not received its separately approved ` +
              `platform apply. Do not repair this boundary with an unreviewed settings ` +
              `change. Run the full platform plan from a clean current \`main\` checkout, ` +
              `review the guarded plan, and obtain explicit approval before apply.\n\n` +
              `The existing core ruleset (ID 13494367) stays unmanaged until the native ` +
              `provider can preserve its unattributed-change approval field. Its exact ` +
              `live shape is still monitored here.\n\n` +
              `<details><summary>Check output</summary>\n\n` +
              `\`\`\`\n${verdict}\n\`\`\`\n` +
              `</details>\n\n` +
              `${marker}`;
            const labels = ["drift-detection", "stack:platform"];
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );
            const existing = issues.find(
              (issue) =>
                !issue.pull_request && issue.body && issue.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                labels,
              });
              console.log(`Updated existing main-lifecycle-boundary drift issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Platform settings drift: controlled main lifecycle boundary",
                body,
                labels,
              });
              console.log(`Opened main-lifecycle-boundary drift issue #${created.data.number}`);
            }

      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
        if: always()
