name: Code Health — Duplication

on:
  pull_request:
    branches: [main]
    # Advisory workflow — strictly non-blocking (never fails the PR; see the
    # job comment) and NOT in the branch ruleset's required checks, so a
    # positive `paths:` filter is safe (a skipped run cannot leave a
    # *required* check pending). These globs mirror .jscpd.json's `pattern`
    # scan roots: jscpd cannot flag duplication in a PR that touches none of
    # them. Keep both copies in sync with .jscpd.json if the scan roots change.
    paths:
      - shared-config/src/**
      - ui-dashboard/src/**
      - indexer-envio/src/**
      - metrics-bridge/src/**
      - aegis/src/**
      - governance-watchdog/src/**
      - alerts/infra/onchain-event-handler/src/**
      - alerts/infra/oncall-announcer/src/**
      - .jscpd.json
      - package.json
      - .github/workflows/code-health-duplication.yml
  push:
    branches: [main]
    paths:
      - shared-config/src/**
      - ui-dashboard/src/**
      - indexer-envio/src/**
      - metrics-bridge/src/**
      - aegis/src/**
      - governance-watchdog/src/**
      - alerts/infra/onchain-event-handler/src/**
      - alerts/infra/oncall-announcer/src/**
      - .jscpd.json
      - package.json
      - .github/workflows/code-health-duplication.yml

# PR runs cancel on new pushes to the same PR ref; push to main uses a
# SHA-unique group so consecutive main runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions: read-all

jobs:
  duplication:
    name: jscpd
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    # Strictly advisory — never fails the PR. Surfaces duplication signal via
    # the job log (.jscpd.json's console reporter) and an uploaded artifact.
    # No step posts a PR comment. If `jscpd` exits non-zero (it shouldn't,
    # given .jscpd.json's `exitCode: 0`), the next step still uploads it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Run jscpd
        run: pnpm code-health:duplication
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 14
