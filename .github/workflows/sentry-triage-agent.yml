name: Sentry Triage Agent

# Stage B of the Sentry triage pipeline (ADR 0036): a scheduled, READ-ONLY
# claude-code-action agent that posts a structured verdict on each pending queue
# issue (`sentry-triage` + `sentry:needs-triage`). It NEVER fixes code, never
# writes to Sentry, never opens PRs. Prompt-injection containment is the whole
# design point — see the security notes on the `triage` job below.
#
# Inert until activation: the `SENTRY_TRIAGE_ENABLED` repo variable gates the
# whole workflow, and the `select` job additionally no-ops when either secret
# (CLAUDE_CODE_OAUTH_TOKEN, SENTRY_TRIAGE_TOKEN) is absent. Secrets/variable are
# Terraform-owned (ADR 0030) and provisioned by a separate issue. This is NOT a
# required check.

on:
  schedule:
    # Weekdays only, after the same-morning ingest run (30 5 * * *, which
    # stays 2x/day every day for coverage) so the queue is fresh; the digest
    # job at the end of this run is the one daily Slack notification
    # (~08:10 UTC, later with GitHub cron drift). Off-the-hour like the
    # ingest workflow to dodge cron contention on GitHub's scheduler.
    - cron: 55 7 * * 1-5
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: issue_number is a single-issue dry-run selector,
    # validated to ^[0-9]+$ before use (see the select job). It only narrows
    # which queue issue is triaged — it cannot affect any build/deploy output
    # (this workflow reads Sentry and posts an issue comment; it builds nothing).
    # Required by issue #1275's dry-run acceptance criterion.
    inputs:
      issue_number:
        description: Single queue issue number to triage (dry-run). Leave blank for the normal oldest-first batch.
        required: false
        type: string

# Serialize runs so an overlapping schedule + dispatch can't double-triage the
# same queue issue. Never cancel an in-flight triage.
concurrency:
  group: sentry-triage-agent
  cancel-in-progress: false

# Minimal top-level default; every job below replaces this with its own
# least-privilege set (job permissions REPLACE workflow permissions).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # select: pick up to 10 oldest pending queue issues and emit them as a matrix.
  # This job ALWAYS runs and ALWAYS emits a valid JSON array — both the kill
  # switch (SENTRY_TRIAGE_ENABLED, same repo variable as the ingest workflow)
  # and the secret guard live inside the first step, so a disabled or
  # unprovisioned state is a clean no-op (`[]`, exit 0), never a failure and
  # never an empty matrix expression downstream.
  #
  # It also records, per selected stub, the verdict comment already on it — the
  # round binding for the `verdict` job below (issue #1717). This is the only
  # job that can: it is trusted AND it runs before the agent, so what it reads
  # is what the round started from. The read is GitHub-only; no Sentry call and
  # no Sentry credential enter this job.
  # ---------------------------------------------------------------------------
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # sentry-pipeline Environment (issue #1289): its main-only deployment-branch
    # policy makes the SENTRY_TRIAGE_TOKEN + CLAUDE_CODE_OAUTH_TOKEN presence
    # checks server-enforced — a branch-modified workflow_dispatch on a non-main
    # ref is refused before this job runs. (CLAUDE_CODE_OAUTH_TOKEN stays a
    # repo-level secret for claude.yml; on this main-gated job it resolves via the
    # repo-level fallback since the environment does not redefine it.)
    environment: sentry-pipeline
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
      count: ${{ steps.select.outputs.count }}
      priorVerdicts: ${{ steps.prior-verdicts.outputs.priorVerdicts }}
    steps:
      # SHA-pinned (not tags) so tag retargeting / a compromised release cannot
      # silently run new code. Bump via Dependabot (.github/dependabot.yml).
      # This checkout is PRISTINE — no agent runs in this job — so the
      # prior-verdict recorder below is safe to run from the checkout path, the
      # same reasoning the `verdict` job's plain `scripts/` invocation rests on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Select queue issues (kill-switch + secret guarded)
        id: select
        env:
          ENABLED: ${{ vars.SENTRY_TRIAGE_ENABLED }}
          # Presence-only guard: masked in logs, only tested for emptiness here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SENTRY_TRIAGE_TOKEN: ${{ secrets.SENTRY_TRIAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail

          # Always emit a valid JSON array so the downstream matrix never sees
          # an empty string.
          issues='[]'

          if [ "${ENABLED:-}" != "true" ]; then
            echo "::notice::SENTRY_TRIAGE_ENABLED is not 'true' — kill switch off, no-op."
          elif [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] || [ -z "${SENTRY_TRIAGE_TOKEN}" ]; then
            echo "::notice::Sentry triage secrets not provisioned yet — no-op."
          elif [ -n "${DISPATCH_ISSUE:-}" ]; then
            # Dry-run path: triage exactly the requested issue. Reject anything
            # that isn't a bare integer before it reaches the matrix / prompt,
            # and reject CLOSED issues: the scheduled selector only picks open
            # stubs, so a closed dispatch target that later fails and gets
            # sentry:needs-triage restored would never be retried — a stranded
            # closed-but-pending stub. (The verdict/close steps assume an open
            # stub throughout.)
            if [[ "${DISPATCH_ISSUE}" =~ ^[0-9]+$ ]]; then
              state=$(gh issue view "${DISPATCH_ISSUE}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json state --jq .state)
              if [ "${state}" != "OPEN" ]; then
                echo "::error::workflow_dispatch issue_number ${DISPATCH_ISSUE} is not an open issue (state: ${state}); refusing to triage a closed queue stub — reopen it first if a re-triage is intended."
                exit 1
              fi
              issues="[${DISPATCH_ISSUE}]"
            else
              echo "::error::workflow_dispatch input issue_number must be a plain integer"
              exit 1
            fi
          else
            # Oldest-first, capped at 10 per run (mandatory quota cap — do not
            # raise without re-checking the daily envelope: one weekday run at
            # 10 stays under the original 2-runs-of-6-per-day budget).
            # `gh issue list` returns newest-first by default, so a bare --limit
            # would window to the newest 100 and starve genuinely older queue
            # issues. `--search 'sort:created-asc'` makes the API return
            # oldest-first (--label/--state filters AND-merge into the search
            # query); the client-side sort_by + slice stays as defense-in-depth.
            issues=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --label sentry-triage \
              --label 'sentry:needs-triage' \
              --state open \
              --search 'sort:created-asc' \
              --json number,createdAt \
              --limit 100 \
              --jq '[sort_by(.createdAt)[].number][0:10]')
          fi

          count=$(printf '%s' "${issues}" | jq 'length')
          {
            echo "issues=${issues}"
            echo "count=${count}"
          } >> "${GITHUB_OUTPUT}"
          echo "Selected ${count} issue(s): ${issues}"

      # -----------------------------------------------------------------------
      # Round binding, recorded BEFORE the agent runs (issue #1717).
      #
      # The `verdict` job is `if: always()`, so a triage round that dies before
      # posting still reaches it, and it settles the stub on the newest
      # ADMISSIBLE verdict comment. The regression fence only makes a verdict
      # inadmissible when some producer posted a fence; ingest's stranded-stub
      # sweep re-queues for BOOKKEEPING and posts none, by design — nothing
      # about the Sentry issue changed as far as it can see. It reads GitHub
      # only, so a Sentry occurrence that landed after its own
      # `fetchMergedSentryIssues()` returned is invisible to it, and the
      # previous round's verdict — which describes the pre-regression
      # occurrence — stays admissible. Without this binding the `verdict` job
      # then labels and closes on it, and the close postdates the occurrence, so
      # ingest's dedup gate skips the stub until the NEXT occurrence: a live
      # regression laundered into a settled ledger entry.
      #
      # So record what each stub already carried and make the verdict job prove
      # the round moved it forward. This is the same generation-token plumbing
      # the autofix leg threads (issue #1506), and it kills the consequence
      # whatever the re-queue's cause was — no per-stub Sentry lookup is added
      # to the sweep, which is what makes it a design fix rather than a guard.
      #
      # `[]` (kill switch off, secrets unprovisioned, or an empty queue) emits
      # `{}` and costs nothing. A per-stub read failure records `unknown`, which
      # the verdict job refuses — fail closed for that stub only, never a
      # starved batch.
      # -----------------------------------------------------------------------
      - name: Record the verdict comment each stub arrives with
        id: prior-verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_ISSUES: ${{ steps.select.outputs.issues }}
        run: |
          set -euo pipefail
          # Plain scripts/ is correct here for the same reason it is in the
          # verdict job and nowhere near the agent: this job has its own runner
          # and its own pristine checkout, which no agent ever touched.
          prior_file="${RUNNER_TEMP}/prior-verdicts.json"
          node scripts/sentry/triage/sentry-triage-project.mjs \
            --prior-verdicts \
            --issues "${SELECTED_ISSUES}" \
            --repo "${GITHUB_REPOSITORY}" \
            > "${prior_file}"
          # Compact to one line: GITHUB_OUTPUT is line-oriented, and the script
          # already prints a single line — re-compacting is the cheap assertion
          # that it stayed that way.
          prior=$(jq -c . "${prior_file}")
          echo "priorVerdicts=${prior}" >> "${GITHUB_OUTPUT}"
          echo "Prior verdict comments: ${prior}"

  # ---------------------------------------------------------------------------
  # triage: one claude-code-action run per queue issue (max 2 in parallel).
  #
  # Prompt-injection containment (Sentry payloads are untrusted input):
  #   - permissions: issues:write + contents:read ONLY. No pull-requests, no
  #     id-token, no packages — the agent holds no write credential beyond
  #     commenting/labeling on THIS repo.
  #   - --allowedTools is an explicit allowlist: repo READ tools (Read/Grep/Glob),
  #     Sentry READ tools only, two read-only `gh issue` subcommands, and one
  #     write wrapper. view/list stay repo-wide (duplicate search needs them);
  #     the agent's ONLY write is the wrapper, and the grant names the IMMUTABLE
  #     staged copy under $RUNNER_TEMP, never the checkout path — the checkout is
  #     agent-writable, so a grant pointing there is a grant to run whatever the
  #     agent last wrote (see the staging step). It takes its target issue from
  #     the pinned file, not the environment, and accepts no issue argument — so
  #     the permission layer's string-prefix match can only extend the wrapper's
  #     ARGUMENTS, never the write target. That
  #     replaces the old `Bash(gh issue comment <n>:*)` grant, whose prefix match
  #     also admitted 1234, 12345, … (issue #1288). The wrapper additionally
  #     stamps every agent comment with the `sentry-triage-agent-authored:v1`
  #     marker and requires it to start with the verdict marker, so agent text
  #     stays distinguishable from deterministic-script text even though both
  #     post as `github-actions[bot]`. The label swap is NOT delegated to the
  #     agent: the separate `verdict` job parses the verdict out of the comment
  #     and applies the label itself. No bare Bash, no `gh api`, no
  #     `gh issue edit`, no `gh issue comment`, no Write/Edit, no Sentry
  #     write/execute tools, no WebFetch/WebSearch.
  #   - THIS JOB ENDS WITH THE AGENT. No step runs after the claude-code-action
  #     step, which is what makes $GITHUB_ENV injection inert: the agent can
  #     append `BASH_ENV=<payload it wrote>` to that file, and GitHub would
  #     export it to every LATER step in the same job, whose bash would source
  #     the payload before running its own command — defeating the immutable
  #     staged copies, since the payload runs first. There is no later step
  #     here to poison. Asserted by a test in
  #     scripts/sentry/triage/sentry-triage-agent-comment.test.mjs; do not add a step below
  #     the agent.
  #   - NO SENTRY CREDENTIAL IN THE AGENT'S ENV (issue #1711). The Sentry token
  #     is step-scoped to the broker step below and is NOT job env. The agent
  #     step holds only an opaque per-run HANDLE, which the loopback broker
  #     trades for the real token. That closes the class the old wiring could
  #     not: with the token in job env, the agent's Bash inherited it, and since
  #     the agent authors its own shell command, bash expands and transforms
  #     `$VAR` before any wrapper sees argv — `${TOKEN:0:4}x${TOKEN:4}` posts
  #     the whole token with one removable character spliced in. No check inside
  #     the wrapper can stop that.
  #   - RESIDUAL, stated plainly: CLAUDE_CODE_OAUTH_TOKEN is still live in the
  #     agent's Bash env. `claude-code-action` puts it there itself — its
  #     base-action/src/parse-sdk-options.ts spreads the whole `process.env`
  #     into the CLI subprocess, deleting only the OIDC request vars — and the
  #     pinned v1.0.190 offers no per-step or first-class MCP env forwarding to
  #     move it. It is inference-scoped: worst case is inference-quota abuse,
  #     not repo or queue compromise, and any use lands in an auditable public
  #     comment. Re-check on the next action bump.
  #   - RESIDUAL, stated plainly: the run handle IS in the agent's env, and
  #     three allow-listed tools (find_projects, search_issues, search_events)
  #     take an agent-controlled `regionUrl` that the MCP server's
  #     validateRegionUrl accepts for {sentry.io, us.sentry.io, de.sentry.io}.
  #     It keeps only the host and re-applies its own protocol, which is http
  #     under --insecure-http, so an injected agent can send its Authorization
  #     header to `http://us.sentry.io/...` in cleartext, past the broker. What
  #     leaks there is the HANDLE, and the handle is worthless outside this run:
  #     the broker binds 127.0.0.1 only and dies with the runner. Sentry egress
  #     is NOT closed here and this design does not pretend it is. Tracked
  #     separately (see the broker script header).
  # ---------------------------------------------------------------------------
  triage:
    needs: select
    if: ${{ needs.select.outputs.count != '' && needs.select.outputs.count != '0' }}
    # sentry-pipeline Environment (issue #1289): server-enforced main-only access
    # to SENTRY_TRIAGE_TOKEN (now read only by the broker step) and
    # CLAUDE_CODE_OAUTH_TOKEN (claude-code-action) — a non-main
    # workflow_dispatch is refused before this matrix job runs.
    environment: sentry-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: read
      issues: write
    # Job-level (NOT step-level) env: claude-code-action is a composite action,
    # and GitHub Actions does not pass a CALLER step's env: into a composite
    # action's steps at all; the action's internal run step additionally
    # declares its own env: block. Its action.yml says so in as many words for
    # its own MCP vars — "this step's env: block shadows the calling workflow's
    # job-level env vars … Set these in your workflow's job-level env: or via a
    # prior step that writes to $GITHUB_ENV". RE-VERIFIED for issue #1288, for
    # #1711, on the v1.0.183 bump (be7b93b1, byte-identical to the previously
    # verified v1.0.179 / b76a0776), and again on the bump to the version pinned
    # below, v1.0.190 (5ef2e550): its action.yml differs from v1.0.183 in three
    # places, none of them an input or an env channel — a new `conclusion`
    # output, one input DESCRIPTION reworded, and `no-cache: true` on its
    # setup-bun step. So there is still no per-step env passthrough and no
    # first-class MCP env input — upstream deprecated `mcp_config` in favour of
    # `claude_args: --mcp-config`, which takes a path or JSON, never env. So
    # anything the MCP server must read has to be job env — which is exactly why
    # the SENTRY TOKEN IS NO LONGER HERE and an opaque per-run handle is (issue
    # #1711). Re-check on the next action bump; do not re-open the question
    # without testing a version. Upstream cuts a GitHub Release per patch, so
    # "there is no newer version" is never the reason to skip that check.
    #   - GH_TOKEN: gh CLI auth for the agent's read-only `gh issue view/list`
    #     (this job's GITHUB_TOKEN: issues:write + contents:read only) and for
    #     the deterministic steps below.
    #   - SENTRY_MCP_BROKER_HANDLE: minted by the broker step below and exported
    #     through $GITHUB_ENV, then consumed by the ${SENTRY_MCP_BROKER_HANDLE}
    #     expansion in --mcp-config when the CLI launches the stdio Sentry MCP
    #     server. $GITHUB_ENV is correct HERE and would be wrong for the token:
    #     it exposes a value to every LATER step, and this value is not a
    #     secret. The handle authenticates to a 127.0.0.1-bound broker that dies
    #     with the runner, so it is worthless outside this run — which is what
    #     makes the regionUrl steering channel in the job banner survivable.
    #   - SENTRY_TRIAGE_COMMENT_ISSUE: a CROSS-CHECK on the wrapper's write
    #     target, never the binding itself. Env cannot fence the target: bash
    #     arithmetic expansion assigns, so a body containing
    #     `$((SENTRY_TRIAGE_COMMENT_ISSUE=1234))` rewrites this variable while
    #     the agent's own command line is expanded, before node starts. The
    #     authoritative target is the read-only file written by the "Pin the
    #     agent write target" step below; the wrapper refuses when the two
    #     disagree, because a disagreement is evidence of exactly that.
    #   - SENTRY_MCP_BROKER_PORT: the ONLY literal for the broker's port. The
    #     broker step reads it straight from the environment and the agent
    #     step's --mcp-config interpolates it, so the two cannot drift. The
    #     broker script REQUIRES it rather than defaulting — a default would be
    #     a second source of truth that disagrees only on a live run, as a
    #     connection refused.
    #   - SENTRY_MCP_SERVER_SPEC: the ONLY literal for the Sentry MCP server
    #     package. The pre-flight probe step spawns it and the agent step's
    #     --mcp-config interpolates it, so the two cannot address different
    #     servers — a probe that passed against a version the agent does not run
    #     would be worse than no probe. Bumping it re-derives the broker's path
    #     allowlist AND the probe's REQUIRED_TOOLS; see
    #     docs/notes/sentry-triage-pipeline.md.
    env:
      GH_TOKEN: ${{ github.token }}
      SENTRY_TRIAGE_COMMENT_ISSUE: ${{ matrix.issue }}
      SENTRY_MCP_BROKER_PORT: "9401"
      SENTRY_MCP_SERVER_SPEC: "@sentry/mcp-server@0.37.0"
    steps:
      # SHA-pinned (not tags) so tag retargeting / a compromised release cannot
      # silently run new code. Bump via Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The agent can write into this checkout (see the staging step below),
          # and it holds Read. Do NOT leave the checkout credential in
          # .git/config for it to read — same rule sentry-autofix.yml applies to
          # its agent job. Nothing in this job pushes or fetches.
          persist-credentials: false

      # The agent's comment wrapper runs under node, so pin it to .node-version
      # rather than relying on the runner image's system node (mirrors the
      # digest job). Nothing else in this job runs node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # -----------------------------------------------------------------------
      # Move everything the agent's grants can EXECUTE, and the target it writes
      # to, out of the checkout and make both immutable (issue #1288).
      #
      # THE CHECKOUT IS AGENT-WRITABLE. Claude Code documents that a
      # `Bash(cmd:*)` rule matches a command carrying an output redirection
      # (CHANGELOG v1.0.123), and `gh issue view … --template` renders arbitrary
      # constructed text (`gh help formatting`), so the agent's read-only `gh`
      # grants compose into "write any content to any path this user can write":
      #
      #     gh issue view <n> --json number --template '<literal JavaScript>' \
      #       > scripts/sentry/triage/sentry-triage-agent-comment.mjs
      #
      # That replaces the wrapper the agent is then allowed to run, defeating
      # the pinned target, the marker fences and the child-env scrub in one
      # step. Verified: the --template rendering above was reproduced against
      # the live API.
      #
      # So nothing executable is loaded from the checkout in this job. The
      # wrapper's whole runtime import closure is copied here, read-only, and
      # the agent's grant names THIS path. Everything trusted that used to run
      # after the agent now runs in the `verdict` job, on its own runner with
      # its own pristine checkout — see that job's banner for why a separate
      # job and not merely a separate file.
      #
      # The closure is copied rather than inlined so the marker constants keep a
      # single owner (sentry-triage-project-core.mjs) — inlining them into the
      # wrapper is the drift this pipeline already guards against elsewhere.
      # scripts/sentry/triage/sentry-triage-agent-comment.test.mjs recomputes the closure from
      # the source and fails if this list stops matching it.
      #
      # Modes are load-bearing, not decoration: 0444 files in a 0555 directory
      # make open(O_WRONLY), create, unlink and rename all fail EACCES for the
      # owning (non-root) user. Verified, with a control at 0755/0644 that
      # succeeds. The wrapper additionally refuses if it finds its pinned target
      # writable, which catches this step regressing.
      # -----------------------------------------------------------------------
      - name: Stage immutable agent tools and pin the write target (trusted)
        env:
          QUEUE_ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          set -euo pipefail

          # --- the write target -------------------------------------------------
          target_dir="${RUNNER_TEMP}/sentry-triage-target"
          mkdir -p "${target_dir}"
          chmod 0755 "${target_dir}"
          # jq emits the JSON so the values are quoted by a parser rather than
          # by string concatenation. Both inputs are trusted (a validated
          # integer and GITHUB_REPOSITORY); the wrapper still parses this as
          # JSON and must never be handed a hand-rolled document.
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg issue "${QUEUE_ISSUE_NUMBER}" \
            '{repo: $repo, issue: $issue}' > "${target_dir}/target.json"
          chmod 0444 "${target_dir}/target.json"
          chmod 0555 "${target_dir}"

          # --- the executable closure -------------------------------------------
          tools_dir="${RUNNER_TEMP}/sentry-triage-tools"
          mkdir -p "${tools_dir}"
          chmod 0755 "${tools_dir}"
          # sentry-mcp-broker.mjs and sentry-mcp-probe.mjs are NOT
          # agent-executable (no grant names either) — they are staged because
          # this job must execute nothing from the agent-writable checkout, and
          # staging them keeps that true even if their steps ever move. Each
          # one's import closure is itself; both closure checks live in
          # scripts/sentry/broker/sentry-mcp-broker.test.mjs.
          for f in \
            sentry-triage-agent-comment.mjs \
            sentry-triage-project-core.mjs \
            sentry-triage-escalation-contract.mjs \
            sentry-triage-text.mjs; do
            install -m 0444 "scripts/sentry/triage/${f}" "${tools_dir}/${f}"
          done
          install -m 0444 "scripts/sentry/broker/sentry-mcp-broker.mjs" \
            "${tools_dir}/sentry-mcp-broker.mjs"
          install -m 0444 "scripts/sentry/broker/sentry-mcp-probe.mjs" \
            "${tools_dir}/sentry-mcp-probe.mjs"
          chmod 0555 "${tools_dir}"

          echo "Pinned write target: ${GITHUB_REPOSITORY}#${QUEUE_ISSUE_NUMBER}"
          ls -ld "${target_dir}" "${tools_dir}"
          ls -l "${target_dir}/target.json" "${tools_dir}"

      # -----------------------------------------------------------------------
      # Take the Sentry credential OUT of the agent's process env (issue #1711).
      #
      # THIS STEP IS TRUSTED and it is the ONLY place SENTRY_TRIAGE_TOKEN
      # appears in this workflow. It starts a loopback broker holding the real
      # token, mints an opaque per-run handle, and exports only the handle. The
      # agent step then points the Sentry MCP server at 127.0.0.1 with the
      # handle as its access token, so the agent's Bash inherits no Sentry
      # credential at all. That is the fix: with the token in job env, the agent
      # authored its own shell command and bash expanded and transformed `$VAR`
      # before any wrapper saw argv, so no check inside the wrapper could stop
      # exfiltration.
      #
      # OUT OF THE AGENT'S ENV IS NOT ENOUGH — IT MUST BE OUT OF THE AGENT'S
      # REACH. Every step runs as `runner` and the agent holds `Read`, so
      # `/proc/<pid>/environ` of ANY process in this job is agent-readable, and
      # this step logs the broker's PID. So the broker must be EXEC'd without
      # the token: the value is copied to a shell-local and the exported name
      # is `unset` before node is spawned, and the token is handed over on
      # STDIN. Note `/proc/<pid>/environ` is the block captured at `exec` —
      # deleting the variable inside node afterwards would NOT clear it, which
      # is why the fix is here and not in the script. The broker independently
      # refuses to start if it finds the token in its own exec-time env.
      #
      # `printf` is a bash BUILTIN, so the token never becomes a process
      # argument in `/proc/<pid>/cmdline` (a builtin in a pipeline runs in a
      # forked subshell that never execs, so its cmdline stays the parent
      # shell's). A pipeline uses an anonymous pipe and creates no file — do NOT
      # rewrite it as a here-string (`<<<`) or heredoc, where bash may
      # materialise a temp file the agent could read.
      #
      # THIS step's own shell still holds the token in its environment, which is
      # fine only because each `run:` step is its own process and the runner
      # gates the next step on this one's exit code — so it is gone before the
      # agent starts. The broker deliberately outlives this step, which is
      # precisely why its environment is the one that had to be cleaned.
      #
      # `--insecure-http` is CLI-only (there is no env var for it), `SENTRY_URL`
      # must be HTTPS and cannot combine with it, and `SENTRY_HOST` takes a
      # hostname with no scheme — so the loopback wiring lives in the MCP
      # server's `args`, and `SENTRY_HOST` is gone along with the token.
      #
      # It runs the IMMUTABLE staged copy, not `scripts/`. This step is ordered
      # before the agent, so the checkout is still pristine here — but the rule
      # for this job is that it executes nothing from the agent-writable
      # checkout, full stop, and a rule with an ordering caveat is one refactor
      # away from being wrong.
      #
      # NO STOP STEP, deliberately. This job must END with the agent: the agent
      # can append `BASH_ENV=<payload it wrote>` to $GITHUB_ENV, and any later
      # step's bash would source that payload before running its own command —
      # an escape from the whole permission allowlist. So the broker bounds its
      # own life with a TTL instead, set to the job timeout; the runner is
      # ephemeral and is destroyed with the job either way.
      # -----------------------------------------------------------------------
      - name: Start the Sentry credential broker (trusted)
        env:
          # Step-scoped, and an `env:` binding rather than a `${{ secrets.* }}`
          # interpolation inside the run body ON PURPOSE: GitHub expands `${{ }}`
          # BEFORE writing the step script to $RUNNER_TEMP, so an inline secret
          # would sit in plaintext on disk for the life of the job, readable by
          # the agent. Through `env:` the script holds only the variable name.
          # Never written to $GITHUB_ENV either — that would hand it to every
          # later step, including the agent's.
          SENTRY_TRIAGE_TOKEN: ${{ secrets.SENTRY_TRIAGE_TOKEN }}
        run: |
          set -euo pipefail

          # Copy to a shell-local and drop the EXPORTED name, so every child
          # below — including node — is exec'd without it. This is the line that
          # keeps the token out of /proc/<broker-pid>/environ; a scrub inside
          # node could not, since that file is fixed at exec.
          token="${SENTRY_TRIAGE_TOKEN:-}"
          unset SENTRY_TRIAGE_TOKEN

          if [ -z "${token}" ]; then
            echo "::error::SENTRY_TRIAGE_TOKEN is empty in the triage job; refusing to start the agent without a working Sentry path."
            exit 1
          fi

          # Establishes the heap-residency residual recorded in ADR 0056:
          # ptrace_scope=1 (or higher) denies /proc/<pid>/mem to a non-descendant
          # same-user process; 0 does not. Logged, not assumed.
          echo "yama ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo unavailable)"

          # The handle is an authenticator for a 127.0.0.1-bound process that
          # dies with this runner, not a secret — $GITHUB_ENV is the right
          # channel for it, and the only one the CLI's --mcp-config expansion
          # can read.
          handle="$(openssl rand -hex 32)"
          ready_file="${RUNNER_TEMP}/sentry-mcp-broker.ready"
          log_file="${RUNNER_TEMP}/sentry-mcp-broker.log"
          rm -f "${ready_file}"

          # Token on STDIN via a builtin: no env var, no argv, no temp file.
          # Redirecting stdout/stderr to a file releases the step's pipe, so the
          # backgrounded broker does not hold the step open. `$!` is the last
          # element of the pipeline — node, which is the pid we wait on.
          printf '%s' "${token}" | \
          SENTRY_MCP_BROKER_HANDLE="${handle}" \
          SENTRY_MCP_BROKER_READY_FILE="${ready_file}" \
          SENTRY_MCP_BROKER_TTL_SECONDS=1800 \
            node "${RUNNER_TEMP}/sentry-triage-tools/sentry-mcp-broker.mjs" \
            > "${log_file}" 2>&1 &
          broker_pid=$!

          # Fail CLOSED: if the broker never came up, the agent would run
          # against a dead endpoint and burn its turn budget on failed reads.
          for _ in $(seq 1 50); do
            if [ -s "${ready_file}" ]; then break; fi
            if ! kill -0 "${broker_pid}" 2>/dev/null; then
              echo "::error::Sentry credential broker exited before becoming ready."
              cat "${log_file}" || true
              exit 1
            fi
            sleep 0.2
          done
          if [ ! -s "${ready_file}" ]; then
            echo "::error::Sentry credential broker did not become ready within 10s."
            cat "${log_file}" || true
            exit 1
          fi

          echo "SENTRY_MCP_BROKER_HANDLE=${handle}" >> "${GITHUB_ENV}"
          echo "Sentry credential broker listening on 127.0.0.1:$(cat "${ready_file}") (pid ${broker_pid})."

      # -----------------------------------------------------------------------
      # PRE-FLIGHT: prove the Sentry MCP toolset registers (issue #1938).
      #
      # THE FAIL-OPEN THIS CLOSES. claude-code-action spawns the Sentry MCP
      # server itself, and when that spawn fails it initialises WITHOUT the
      # server and prints nothing — no MCP error, no npm error, no exit notice.
      # The agent then holds no `mcp__sentry__*` tool at all and, reasonably,
      # reports that as its verdict; the `verdict` job cannot tell that comment
      # apart from a judgement, so it labels the stub, strips
      # `sentry:needs-triage` and parks it as human work. On 2026-08-19 that
      # turned one silent startup stall into seven stubs carrying escalations
      # nobody could act on.
      #
      # So the toolset is proven HERE, deterministically, before the agent
      # starts: same pinned spec, same loopback broker, MCP handshake,
      # `tools/list`, and the read-only Sentry tools required to be present.
      # Failing this step fails the job while `sentry:needs-triage` is still on
      # the stub, so the round ends the way a dead broker already ends — the
      # `verdict` job finds no usable verdict, says so loudly, and the next run
      # retries the stub. Fail-closed, and nothing to clean up afterwards.
      #
      # It must run BEFORE the agent, and not merely as a matter of taste: this
      # job ENDS with the agent (see the job banner — $GITHUB_ENV injection is
      # inert only because no step follows it, asserted by
      # sentry-triage-agent-comment.test.mjs), so a post-hoc check is not
      # available. It runs the IMMUTABLE staged copy for the same reason the
      # broker does: the rule for this job is that it executes nothing from the
      # agent-writable checkout, full stop.
      #
      # It also WARMS THE npx CACHE for the agent's own spawn moments later.
      # That is deliberate: the stall this issue was found through is
      # unexplained, and paying a cold fetch here — where the timeout is an
      # honest job failure — beats paying it inside a startup window whose
      # expiry is silent.
      # -----------------------------------------------------------------------
      - name: Verify the Sentry MCP toolset registers (trusted)
        run: node "${RUNNER_TEMP}/sentry-triage-tools/sentry-mcp-probe.mjs"

      - name: Render triage prompt
        id: render
        env:
          QUEUE_ISSUE_NUMBER: ${{ matrix.issue }}
          COMMENT_TOOL: ${{ runner.temp }}/sentry-triage-tools/sentry-triage-agent-comment.mjs
        run: |
          set -euo pipefail
          # Wire the queue-issue number and the staged wrapper path into the
          # checked-in prompt file; the SECURITY section and everything else
          # stay verbatim. sed instead of envsubst: gettext is not guaranteed on
          # ubuntu-latest. The issue number is a ^[0-9]+$-validated integer; the
          # tool path is runner-provided and contains no `|`, which is why that
          # substitution uses `|` as its delimiter rather than `/`.
          {
            echo 'prompt<<SENTRY_TRIAGE_PROMPT_EOF'
            sed -e "s/\$QUEUE_ISSUE_NUMBER/${QUEUE_ISSUE_NUMBER}/g" \
                -e "s|\$SENTRY_TRIAGE_COMMENT_TOOL|${COMMENT_TOOL}|g" \
                .github/prompts/sentry-triage.md
            echo 'SENTRY_TRIAGE_PROMPT_EOF'
          } >> "${GITHUB_OUTPUT}"

      - uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.render.outputs.prompt }}
          # Sentry MCP (stdio) is wired via --mcp-config, pointed at the
          # loopback credential broker started above: the agent's process env
          # holds the opaque per-run handle, never the Sentry token (#1711).
          # `--insecure-http` is CLI-only, so the loopback wiring goes in `args`
          # and `SENTRY_HOST` is gone. Plain http is safe here and only here:
          # the hop is 127.0.0.1 on this runner, and the broker makes the real
          # HTTPS call to Sentry itself.
          #
          # The allowlist excludes every Sentry write/mutation tool
          # (update_issue, add_issue_note, create_*/update_*/remove_*), the
          # search-tools/execute-tool meta-executor, and
          # analyze_issue_with_seer. Note that five names below
          # (get_issue_details, get_event_stacktrace, get_issue_tag_values,
          # get_issue_activity, search_issue_events) do not exist at the pinned
          # SENTRY_MCP_SERVER_SPEC — they are inert grants kept so a version
          # bump that restores them does not silently lose the grant. The
          # broker's path allowlist and the pre-flight probe's REQUIRED_TOOLS
          # are both derived from the five that DO exist (find_organizations,
          # find_projects, search_issues, search_events, get_sentry_resource);
          # re-derive both on a version bump, per
          # docs/notes/sentry-triage-pipeline.md. The version itself is NOT
          # restated here: it has one home, in job env, and a comment carrying a
          # copy is how the v1.0.183 action claims above went stale.
          #
          # --setting-sources user: do NOT load the checked-out repo's
          # .claude/settings.json — its permissions.allow list (e.g. `node *`)
          # would otherwise widen this contained agent past the allowlist below.
          # On the CI runner `user` settings are absent, so --allowedTools is the
          # sole permission source.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 50
            --setting-sources user
            --mcp-config '{"mcpServers":{"sentry":{"command":"npx","args":["-y","${{ env.SENTRY_MCP_SERVER_SPEC }}","--host","127.0.0.1:${{ env.SENTRY_MCP_BROKER_PORT }}","--insecure-http"],"env":{"SENTRY_ACCESS_TOKEN":"${SENTRY_MCP_BROKER_HANDLE}"}}}}'
            --allowedTools 'Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(node ${{ runner.temp }}/sentry-triage-tools/sentry-triage-agent-comment.mjs:*),mcp__sentry__find_organizations,mcp__sentry__find_projects,mcp__sentry__get_issue_details,mcp__sentry__get_event_stacktrace,mcp__sentry__get_issue_tag_values,mcp__sentry__get_issue_activity,mcp__sentry__search_issues,mcp__sentry__search_events,mcp__sentry__search_issue_events,mcp__sentry__get_sentry_resource'

  # ---------------------------------------------------------------------------
  # verdict: apply the verdict label and settle the queue stub (deterministic).
  #
  # A SEPARATE JOB, not steps at the end of `triage`, and that is the whole
  # point. The agent can append to $GITHUB_ENV — the path is in its environment
  # and a permitted `gh issue view --template` renders arbitrary text — so
  # `BASH_ENV=<payload it wrote into the checkout>` would be exported into any
  # later step IN THE SAME JOB, and bash would source that payload before
  # running the step's own command. Staging immutable copies does not help: the
  # payload runs first. Same shape sentry-autofix.yml uses (select → agent →
  # finalize): the untrusted job ends when the agent ends, and everything
  # credential-bearing happens on a fresh runner with a fresh checkout and a
  # fresh environment, where nothing the agent wrote to $GITHUB_ENV,
  # $GITHUB_PATH, $GITHUB_OUTPUT or the checkout exists at all.
  #
  # NOTHING crosses the job boundary from the agent. The handoff is the verdict
  # comment on the queue issue, which this job re-reads from GitHub through the
  # single authoritative parser and validates against the closed verdict enum —
  # the same untrusted-input discipline as before, unchanged by the split. The
  # only inputs are `matrix.issue` (the select job's ^[0-9]+$-validated integer)
  # and GITHUB_REPOSITORY.
  #
  # if: always() + a non-zero count, like `project` and `digest`: a failed
  # triage leg must not stop the other legs from settling. A leg whose agent
  # failed simply finds no usable verdict and fails loudly here, leaving
  # sentry:needs-triage for the next run — the same outcome as before the split.
  #
  # No `environment:` and no secret: this job holds only github.token. It is
  # deliberately not a copy of the agent job's block.
  # ---------------------------------------------------------------------------
  verdict:
    needs: [select, triage]
    if: ${{ always() && needs.select.outputs.count != '' && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # SHA-pinned (not tags) so tag retargeting / a compromised release cannot
      # silently run new code. Bump via Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Apply verdict label (deterministic)
        id: verdict
        env:
          QUEUE_ISSUE_NUMBER: ${{ matrix.issue }}
          # The select job's per-stub record of the verdict comment this round
          # started from (issue #1717). Bot-produced JSON, read with jq below
          # and shape-checked before it reaches the parser.
          PRIOR_VERDICTS: ${{ needs.select.outputs.priorVerdicts }}
        run: |
          set -euo pipefail
          # Round binding (#1717). This job runs under `if: always()`, so it
          # also runs when the triage round died before posting anything — and
          # the stub it is settling may have been re-queued by ingest's
          # stranded-stub sweep, which declares `bookkeeping` and therefore
          # posts no staleness fence. Without a binding, the resolution below
          # would then re-apply the PREVIOUS round's verdict and close the stub,
          # burying a Sentry regression that landed after ingest's own Sentry
          # query. So require the verdict comment to be strictly newer than the
          # one select recorded before the agent ran.
          #
          # A missing key is treated as `unknown`, which the parser refuses:
          # every selected stub gets a record, so an absent one means the two
          # jobs disagree about the batch — exactly when settling a stub is
          # least defensible. An unset/unparsable PRIOR_VERDICTS fails the jq
          # under set -e, which leaves sentry:needs-triage on for the next run.
          prior=$(printf '%s' "${PRIOR_VERDICTS:-}" \
            | jq -r --arg n "${QUEUE_ISSUE_NUMBER}" '.[$n] // "unknown"')
          if ! [[ "${prior}" =~ ^([0-9]+|none|unknown)$ ]]; then
            echo "::error::prior-verdict record for issue #${QUEUE_ISSUE_NUMBER} is '${prior}', not a comment id / none / unknown; refusing to settle the stub."
            exit 1
          fi
          # The agent's only write is the verdict comment. The label swap is
          # applied HERE, deterministically, so a prompt-injected agent cannot
          # touch labels at all. The PARSE is delegated to
          # scripts/sentry/triage/sentry-triage-project.mjs --parse-only — the exact same
          # parser the projection step runs — so labeling and projection can
          # never disagree about what the verdict is (single-parser rule: a
          # sed-vs-script divergence here could apply a label and then have the
          # projection silently skip while the stub closes as if handled). The
          # script reads the newest <!-- sentry-triage-verdict:v1 --> comment,
          # applies the round binding above and the regression fence (only a
          # verdict strictly newer than
          # the newest "Regressed in Sentry (last seen " reopen comment counts,
          # so a stale pre-regression verdict never re-labels a regressed
          # issue), validates the verdict against the closed four-value enum,
          # and emits {"verdict","label","projectable","shed","architecturalHold"}
          # JSON (on a local code-fix + fix_scope:architectural verdict `label`
          # is the two-name comma list and architecturalHold is true). The comment
          # body is agent-authored from untrusted Sentry data — it is only ever
          # parsed as data, never interpolated into a command, and the emitted
          # values are closed-enum. Missing/stale/invalid verdict -> nonzero exit ->
          # fail the job loudly and leave sentry:needs-triage in place so the
          # next scheduled run retries this issue. A `needs-human` verdict that
          # omits the required `human_question` field is treated exactly like an
          # invalid verdict (same fail-loud + retry) so a lazy, non-decision
          # escalation never lands a label — see the verdict contract in
          # docs/notes/sentry-triage-pipeline.md. `projectable` (actionable
          # verdict + allowlisted EXTERNAL owning repo) tells the close step
          # whether this stub is settled here or deferred to the serialized
          # `project` job.
          parse_file="${RUNNER_TEMP}/verdict-parse.json"
          # Plain scripts/ is correct HERE and nowhere else in this file: this
          # job has its own runner and its own pristine checkout, which the
          # agent never touched.
          if ! node scripts/sentry/triage/sentry-triage-project.mjs \
              --parse-only \
              --issue "${QUEUE_ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --prior-verdict-comment "${prior}" \
              > "${parse_file}"; then
            echo "::error::No usable verdict on issue #${QUEUE_ISSUE_NUMBER} (missing, stale pre-regression, invalid, or not produced by this triage round — see the log above); leaving sentry:needs-triage in place for retry."
            exit 1
          fi
          verdict=$(jq -r '.verdict' "${parse_file}")
          label=$(jq -r '.label' "${parse_file}")
          projectable=$(jq -r '.projectable' "${parse_file}")
          # `shed` is every OTHER verdict label, comma-joined, from the same
          # parser (#1745). The select job admits any OPEN numeric issue, so a
          # human re-dispatching an answered escalation hands this step a stub
          # that already carries a verdict label — and `--add-label` only adds.
          # Shedding in the SAME edit is what keeps a stub to exactly one
          # verdict; the digest buckets on the first matching label, so two
          # would make it report whichever GitHub ordered first. Removing a
          # label the stub does not carry is a no-op, so the first-pass case is
          # unaffected. Closed enum from a closed enum — never agent text.
          shed=$(jq -r '.shed' "${parse_file}")
          # The architectural hold (#1812): a local code-fix + fix_scope
          # architectural verdict. `label` above already carries
          # sentry:fix-scope-architectural (the parser appended it to the comma
          # list), so it rides the SAME atomic edit below. This flag tells the
          # close step to leave the stub OPEN. Shape-guarded to the closed
          # boolean in the style of the prior-verdict guard — the value is our own
          # parser's output, but a malformed one must never reach the close step's
          # `[ = "true" ]` branch, and it is never interpolated into a command.
          architectural_hold=$(jq -r '.architecturalHold' "${parse_file}")
          if ! [[ "${architectural_hold}" =~ ^(true|false)$ ]]; then
            echo "::error::architecturalHold for issue #${QUEUE_ISSUE_NUMBER} is '${architectural_hold}', not true/false; leaving sentry:needs-triage in place for retry."
            exit 1
          fi
          # The label edit below takes sentry:needs-triage OFF, so it and every
          # exit after it must put the stub back in the queue first. Nothing
          # downstream would: the close step never runs, the project job skips
          # a stub that is not needs-triage, and the scheduled selector only
          # admits sentry:needs-triage — a bare `exit 1` there would strand an
          # open, verdict-labeled stub with no retry path at all.
          #
          # Defined ABOVE the edit because the EDIT ITSELF is one of those
          # exits. `gh` sends --add-label and --remove-label as discrete
          # mutations and fails the whole command on a label the repo does not
          # have; the add can therefore land while the command exits nonzero,
          # leaving the stub carrying the verdict label AND sentry:needs-triage.
          # Defined below the edit — as it was — `set -e` killed the step before
          # any compensation existed to call (the run on 2026-08-13, issue
          # #1811).
          #
          # Every compensating exit in this workflow routes through the ONE
          # re-queue chokepoint (scripts/sentry/triage/sentry-triage-requeue.mjs, BOOKKEEPING
          # cause — nothing in Sentry moved), via its workflow CLI, and never an
          # open-coded label swap (#1782). The CLI owns the shed set
          # (REOPEN_SHED_LABELS, which covers the whole verdict namespace — this
          # is the one branch where more than one of them can be on the stub —
          # plus the projection, autofix and archive markers), the add-then-shed
          # ordering, the bookkeeping note, the end-state verification, and the
          # terminal revalidation that declines rather than reopening a stub the
          # archive leg settled underneath this step. Shedding an approval marker
          # is always allowed; ADDING one never is.
          #
          # Unguarded like the close step's compensation: this step is failing
          # either way, and a compensation that itself fails should fail loudly
          # under set -e.
          requeue_for_retry() {
            node scripts/sentry/triage/sentry-triage-workflow-requeue.mjs \
              --issue "${QUEUE_ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --reason verdict-unsettled
          }
          # SELF-HEAL every label the edit names — added AND shed, plus
          # sentry:needs-triage — from Stage A's LABEL_DEFINITIONS, before the
          # edit. Only the ingest job CREATES that label set, so a label added to
          # the definitions is absent from the repo until ingest next runs, and
          # `gh` errors on a repo-nonexistent name for --remove-label exactly as
          # for --add-label. That is what broke this step on 2026-08-13:
          # sentry:fix-scope-architectural (#1812) reached the shed list — which
          # every non-architectural verdict carries — hours before the next
          # ingest bootstrapped it, so the edit added the verdict label, failed
          # on the unknown removal, and left issue #1811 double-labeled.
          #
          # The three other settlement paths already do this before they write
          # labels (.github/workflows/sentry-autofix.yml via
          # `sentry-autofix-finalize.mjs label-def`, runProjectionBatch in
          # scripts/sentry/triage/sentry-triage-project.mjs, ensureArchiveLabels in
          # scripts/sentry/triage/sentry-triage-archive.mjs); this step was the last one that
          # did not. Best-effort per label, like theirs: the mode warns and
          # continues on a create it cannot make, so the ensure never becomes the
          # thing that kills settlement — a name that still does not exist fails
          # the guarded edit below, which compensates. Its JSON summary goes to a
          # temp file so it stays out of this step's log; what a reader needs —
          # a create that failed, a name missing from the definitions — is a
          # stderr warning annotation.
          #
          # Guarded like the --parse-only call above, and for the same reason: a
          # bare abort under set -e says nothing about which call died. It does
          # NOT re-queue, deliberately. Nothing has been written yet — the edit
          # below has not run — so `sentry:needs-triage` is still on the stub and
          # it stays selectable for the next scheduled run without any
          # compensation, exactly like the --parse-only refusal. The re-queue
          # window opens at the edit, not here.
          if ! node scripts/sentry/triage/sentry-triage-project.mjs \
              --ensure-labels "${label},${shed},sentry:needs-triage" \
              --repo "${GITHUB_REPOSITORY}" \
              > "${RUNNER_TEMP}/verdict-label-ensure.json"; then
            echo "::error::Could not self-heal the label set for issue #${QUEUE_ISSUE_NUMBER} (see the log above); refusing to attempt the verdict edit against a label set that may not exist. Nothing was written, so sentry:needs-triage is still on the stub and the next scheduled run retries it."
            exit 1
          fi
          if ! gh issue edit "${QUEUE_ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --remove-label "sentry:needs-triage,${shed}" \
            --add-label "${label}"; then
            echo "::error::Applying ${label} to issue #${QUEUE_ISSUE_NUMBER} failed (see the gh error above); the add and the removals are discrete mutations, so the stub may hold the verdict label and sentry:needs-triage at once. Re-queuing it so the next scheduled run re-triages it from a known state."
            requeue_for_retry
            exit 1
          fi
          echo "Applied ${label} to issue #${QUEUE_ISSUE_NUMBER}."
          # Post-condition, re-read from GitHub rather than assumed: refuse to
          # hand a double-verdicted stub to the close/project/digest legs. Only
          # >1 fails — the guarded edit above already exits nonzero if the
          # --add-label did not land, so zero is not reachable here. Fail CLOSED
          # on a read failure too: an unverifiable stub is treated as a violation
          # and re-queued, never waved through. Re-queueing is safe to replay: the
          # shed makes the whole step idempotent, so the retry run applies the
          # verdict onto a stub in exactly the state this run found it in.
          labels_file="${RUNNER_TEMP}/verdict-labels.json"
          if ! gh issue view "${QUEUE_ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json labels > "${labels_file}"; then
            echo "::error::Could not re-read issue #${QUEUE_ISSUE_NUMBER} to confirm it carries exactly one sentry:verdict-* label; restoring sentry:needs-triage (and shedding the verdict labels + sentry:projected) so the next scheduled run retries it."
            requeue_for_retry
            exit 1
          fi
          survivor_filter='[.labels[].name | select(startswith("sentry:verdict-"))]'
          surviving=$(jq -r "${survivor_filter} | join(\", \")" "${labels_file}")
          survivor_count=$(jq -r "${survivor_filter} | length" "${labels_file}")
          if [ "${survivor_count}" -gt 1 ]; then
            echo "::error::Issue #${QUEUE_ISSUE_NUMBER} still carries ${survivor_count} sentry:verdict-* labels (${surviving}) after applying ${label}; downstream buckets on a single verdict label, so this job restores sentry:needs-triage (and sheds the verdict labels + sentry:projected) and fails instead of reporting the stub wrong."
            requeue_for_retry
            exit 1
          fi
          # Hand the VALIDATED verdict + mapped label (closed enums, never
          # agent-authored text) + projectability to the close step below.
          # `shed` does NOT ride along any more: the later steps' compensations
          # run through the re-queue CLI, which derives the shed set from
          # REOPEN_SHED_LABELS itself, so nothing downstream needs a copy of the
          # verdict namespace (#1782).
          {
            echo "verdict=${verdict}"
            echo "label=${label}"
            echo "projectable=${projectable}"
            echo "architectural_hold=${architectural_hold}"
          } >> "${GITHUB_OUTPUT}"

      # -----------------------------------------------------------------------
      # needs-human brief (#1748). A needs-human stub stays OPEN for a person,
      # and the thing that person needs is the decision, not the yaml. This
      # deterministic, zero-LLM step renders the verdict's own brief fields as a
      # dedicated, updated-in-place COMMENT on the stub, so opening the issue
      # from a notification shows the question, how to check it and what each
      # answer leads to. It writes NO stub body — the archive leg is the single
      # body writer (#1766), and a comment races nothing, so the brief can never
      # drop the archive freshness baseline (the failure a body render risked
      # through the archive's unlabeled settlement window, #1769). It moves no
      # machine-readable text either: the verdict yaml stays in the verdict
      # comment and the metadata yaml stays where it is. Same untrusted-input
      # discipline as the label step above — the script re-reads the stub from
      # GitHub and resolves it through the single authoritative parser; the
      # agent's text is data, neutralized, bounded and markdown-escaped at
      # render.
      #
      # UNGATED on purpose. The script owns the whole lifecycle of the comment:
      # it renders on `needs-human` and DELETES on every other verdict,
      # regardless of any label. Gating this step on `needs-human` — as it was —
      # meant a stub re-triaged from needs-human to code-fix / config-fix /
      # upstream-transient kept a "Decision needed" brief forever, describing a
      # decision nobody has to make. The verdict it reads is resolved by the
      # script itself, so the step needs no verdict input to decide.
      #
      # RENDER is best-effort, CLEAR is not (#1769 rounds 8 + 10). The failure
      # splits on the verdict:
      #   - needs-human (RENDER): the verdict step already applied the verdict
      #     label and posted the raw verdict comment — the actual escalation — and
      #     the stub stays OPEN. A missing advisory rendering is not worth failing
      #     the job or re-queuing, so log and exit 0. (The verdict step keeps its
      #     OWN requeue_for_retry for a VERDICT failure, untouched.)
      #   - any other verdict (CLEAR): the stub is being re-triaged AWAY from
      #     needs-human and the close step below would then close it still showing
      #     the stale "Decision needed" comment — and the ordinary close path has
      #     NO later cleanup. A swallowed clear is therefore not advisory. Fail to
      #     BLOCK the close (this step failing skips the close step), so the stub
      #     is never closed on an obsolete decision. But the verdict step already
      #     removed sentry:needs-triage and applied the verdict label, so blocking
      #     the close ALONE would strand an open, verdict-labeled stub with no
      #     retry path — the scheduled selector admits only sentry:needs-triage,
      #     the project job skips a non-actionable/local outcome, and ingest's
      #     regression gate only reopens CLOSED stubs (#1769 round 16). So the
      #     clear-failure branch also RESTORES selectability through the single
      #     re-queue chokepoint (scripts/sentry/triage/sentry-triage-requeue.mjs, BOOKKEEPING
      #     cause — nothing in Sentry moved), never an open-coded label swap:
      #     block-the-close AND restore-select together. The chokepoint is
      #     idempotent and OPEN-safe (verify-end-state reopens only a closed stub),
      #     and the next round's brief step reconciles the still-stale brief.
      # A 404 while clearing (the comment already gone) is success, handled in
      # runBrief, so a concurrent delete does not trip this.
      # -----------------------------------------------------------------------
      - name: Render or clear the needs-human brief (deterministic)
        env:
          QUEUE_ISSUE_NUMBER: ${{ matrix.issue }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          set -euo pipefail
          # Plain scripts/ is correct HERE for the same reason as the label
          # step above: this job has its own runner and its own pristine
          # checkout, which the agent never touched.
          if ! node scripts/sentry/triage/sentry-triage-brief.mjs \
              --issue "${QUEUE_ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}"; then
            if [ "${VERDICT}" = "needs-human" ]; then
              echo "::warning::Could not render the needs-human brief on issue #${QUEUE_ISSUE_NUMBER} (see the log above); the verdict label and verdict comment already carry the escalation, so leaving the open stub and continuing (best-effort)."
            else
              echo "::error::Could not clear the stale needs-human brief on issue #${QUEUE_ISSUE_NUMBER} (verdict is now ${VERDICT}); restoring queue selectability through the re-queue chokepoint, then failing to BLOCK the close step so the stub is never closed showing an obsolete decision."
              # The verdict step already removed sentry:needs-triage and applied
              # the verdict label, so a bare exit would strand this open,
              # verdict-labeled stub (#1769 round 16). Restore selectability
              # through the ONE re-queue chokepoint (bookkeeping cause), never an
              # open-coded label swap. It is idempotent and OPEN-safe, and its
              # terminal revalidation DECLINES when sentry-triage-archive settled
              # the stub while this step was failing — a re-queue there would shed
              # `sentry:archived` and reopen a retry stub over an already-archived
              # Sentry issue that consumed a human approval (#1782). A re-queue
              # that itself fails is surfaced but must not stop the close-block.
              if ! node scripts/sentry/triage/sentry-triage-workflow-requeue.mjs \
                  --issue "${QUEUE_ISSUE_NUMBER}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --reason brief-clear-failure; then
                echo "::error::Re-queue of issue #${QUEUE_ISSUE_NUMBER} after the clear failure ALSO failed; it may need manual attention (reopen + sentry:needs-triage)."
              fi
              exit 1
            fi
          fi

      # -----------------------------------------------------------------------
      # Queue hygiene (#1338/#1354): a verdicted queue issue is a closed ledger
      # entry, not an archive record. This step settles every bucket EXCEPT two
      # that stay OPEN: actionable EXTERNAL verdicts, which are deferred (left
      # open, verdict-labeled) to the serialized `project` job below — projection
      # and its close must run one-at-a-time to kill the same-run duplicate-family
      # race, and the projection PAT must never reach these matrix jobs — and
      # local architectural code-fix (#1812), which stays open under
      # sentry:fix-scope-architectural as human design work (autofix excludes it
      # at query time). The
      # comment text is fixed; the only variables are closed-enum values —
      # never agent-authored text. Regression reopens closed issues
      # automatically (Stage A's reopen path in scripts/sentry/triage/sentry-triage-ingest.mjs)
      # — see docs/notes/sentry-triage-pipeline.md.
      # -----------------------------------------------------------------------
      - name: Close queue stub (deterministic)
        env:
          QUEUE_ISSUE_NUMBER: ${{ matrix.issue }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          VERDICT_LABEL: ${{ steps.verdict.outputs.label }}
          PROJECTABLE: ${{ steps.verdict.outputs.projectable }}
          ARCHITECTURAL_HOLD: ${{ steps.verdict.outputs.architectural_hold }}
        run: |
          set -euo pipefail
          projection_note=""
          case "${VERDICT}" in
            code-fix | config-fix)
              if [ "${PROJECTABLE}" = "true" ]; then
                echo "Issue #${QUEUE_ISSUE_NUMBER} has an actionable external verdict; leaving it open for the serialized project job."
                exit 0
              fi
              # Architectural hold (#1812): a LOCAL code-fix whose fix_scope is
              # architectural is open human design work. The verdict step already
              # applied sentry:verdict-code-fix + sentry:fix-scope-architectural in
              # one atomic edit; leave the stub OPEN as the visible backlog rather
              # than closing it. The exact shape of the needs-human exit above.
              # (A crash between that label edit and here leaves an open,
              # verdict+hold-labeled stub, which IS the intended terminal state.)
              if [ "${VERDICT}" = "code-fix" ] && [ "${ARCHITECTURAL_HOLD}" = "true" ]; then
                echo "Issue #${QUEUE_ISSUE_NUMBER} is a local code-fix with fix_scope: architectural; left OPEN under sentry:fix-scope-architectural for a human design decision."
                exit 0
              fi
              # Actionable but LOCAL/unrecognized affected_repo: nothing to
              # project anywhere — settle it here with the explicit note.
              projection_note=" No external projection (owning repo is this repo or unrecognized)."
              ;;
            needs-human)
              echo "Issue #${QUEUE_ISSUE_NUMBER} verdict is needs-human; left open for human review."
              exit 0
              ;;
          esac
          # If the close fails after the label swap, the issue would be
          # stranded: open, verdict-labeled, no longer selectable and outside
          # the regression-reopen path. Compensate through the ONE re-queue
          # chokepoint's workflow CLI (#1782) — it restores sentry:needs-triage
          # and sheds the previous round's markers (the verdict label, since a
          # retry may land a DIFFERENT one and two would misclassify the issue
          # for the digest and human label filters, plus any stale
          # sentry:projected and autofix/archive markers) — then fail the job
          # loudly so the main-failure notifier fires.
          #
          # A REPORTED close failure is not proof the close did not happen: the
          # mutation can land and only lose its response. That is exactly what
          # the CLI's TERMINAL revalidation is for — it re-reads the stub and
          # DECLINES on a CLOSED or sentry:archived one, so a lost close response
          # leaves the stub correctly settled instead of manufacturing the
          # closed-plus-needs-triage pairing no pipeline stage can see. Ingest's
          # stranded-stub sweep (isStrandedNeedsTriage in
          # scripts/sentry/triage/sentry-triage-ingest.mjs) still repairs that pairing from the
          # producers that can still write it — the archive leg's refusal, a
          # crash inside ingest's own reopen, a hand-edit.
          if ! gh issue close "${QUEUE_ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --reason completed \
            --comment "Triage complete: ${VERDICT}.${projection_note} Ledger entry closed; reopens automatically on Sentry regression."; then
            echo "::error::Failed to close issue #${QUEUE_ISSUE_NUMBER}; re-queuing it through the re-queue chokepoint (restore sentry:needs-triage, shed ${VERDICT_LABEL} + the other stale markers) for retry."
            node scripts/sentry/triage/sentry-triage-workflow-requeue.mjs \
              --issue "${QUEUE_ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --reason close-failure
            exit 1
          fi
          echo "Closed issue #${QUEUE_ISSUE_NUMBER} (verdict: ${VERDICT})."

  # ---------------------------------------------------------------------------
  # project: SERIALIZED verdict projection (deterministic, no LLM — ADR 0038).
  # Runs ONCE per triage run, after every matrix job settles, and processes the
  # batch's actionable EXTERNAL verdicts one at a time via the script's --batch
  # mode (single node process, shared in-run registry). Serialization is the
  # point:
  #   - Two duplicate-family SHORT-IDs in one batch could otherwise both pass
  #     the projection lookup in parallel matrix jobs (a just-created issue is
  #     not searchable for seconds/minutes) and double-file — with one
  #     serialized process and an in-memory registry the race class is gone.
  #   - Token isolation: SENTRY_PROJECTION_TOKEN reaches ONLY this job's single
  #     step — the triage matrix jobs (which host the LLM agent) never see it.
  #     The env expression is ref-gated: off-main it resolves to '' (branch
  #     dispatch runs branch-modified code; durable Environment protection is
  #     #1289), and the run block re-queues actionable stubs loudly instead of
  #     consuming them.
  #   - if: always() + count gate (like the digest): failed matrix jobs leave
  #     their stubs on sentry:needs-triage, which --batch skips; the rest of
  #     the batch still projects.
  # Per-row outcomes: projected/reused stubs are closed here with the
  # projected URL in the fixed closing comment; skipped-no-token (main) closes
  # with the visible "not provisioned" note; failed rows re-queue through the
  # single chokepoint's workflow CLI (restore sentry:needs-triage, shed the
  # previous round's markers) and turn the job red so the main-failure notifier
  # fires.
  # ---------------------------------------------------------------------------
  project:
    needs: [select, triage, verdict]
    if: ${{ always() && needs.select.outputs.count != '' && needs.select.outputs.count != '0' }}
    # sentry-pipeline Environment (issue #1289): SENTRY_PROJECTION_TOKEN is now an
    # environment secret, so this job MUST declare the environment to receive it;
    # the deployment-branch policy also makes the existing inline
    # `github.ref == 'refs/heads/main'` gate on that token a redundant backstop.
    environment: sentry-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # SHA-pinned (not tags) so tag retargeting / a compromised release cannot
      # silently run new code. Bump via Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Project actionable external verdicts (serialized)
        env:
          GH_TOKEN: ${{ github.token }}
          # The ONLY place in this workflow the cross-repo projection PAT is
          # exposed (see the job banner for the ref-gate rationale).
          SENTRY_PROJECTION_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_PROJECTION_TOKEN || '' }}
          # The exact batch this run selected (JSON int array from the select
          # job). Passed via env — never interpolated into the shell command.
          SENTRY_TRIAGE_ISSUES: ${{ needs.select.outputs.issues }}
        run: |
          set -euo pipefail
          # The script emits ONE JSON result row per batch issue on stdout
          # (diagnostics on stderr); every value consumed below is closed-enum
          # or a gh-derived URL — never agent-authored text.
          results_file="${RUNNER_TEMP}/projection-results.json"
          node scripts/sentry/triage/sentry-triage-project.mjs \
            --batch \
            --repo "${GITHUB_REPOSITORY}" \
            --issues "${SENTRY_TRIAGE_ISSUES}" \
            > "${results_file}"

          # (The batch script self-heals the sentry:projected label from
          # Stage A's LABEL_DEFINITIONS before settling — see
          # runProjectionBatch in scripts/sentry/triage/sentry-triage-project.mjs.)

          # Every compensating exit in this job re-queues through the ONE
          # chokepoint's workflow CLI (#1782), never an open-coded label swap:
          # it owns the shed set (REOPEN_SHED_LABELS — so a row that carries no
          # `label` still sheds correctly), the add-then-shed ordering, the
          # bookkeeping note, the end-state verification, and the terminal
          # revalidation that declines rather than reopening a stub the archive
          # leg — or a close whose response was lost — already settled.
          #
          # GUARDED, so it never aborts the loop under set -e: later rows have
          # already had owning-repo side effects and MUST still be settled below.
          # A compensation failure turns the job red and is called out for manual
          # repair instead of stranding the rest of the batch.
          requeue_row() {
            if ! node scripts/sentry/triage/sentry-triage-workflow-requeue.mjs \
              --issue "$1" \
              --repo "${GITHUB_REPOSITORY}" \
              --reason "$2"; then
              echo "::error::Compensation failed for issue #$1 — manually restore sentry:needs-triage and shed the stale verdict/projection markers."
            fi
          }
          failed=0
          while IFS= read -r row; do
            n=$(jq -r '.issue' <<<"${row}")
            status=$(jq -r '.status' <<<"${row}")
            url=$(jq -r '.url // ""' <<<"${row}")
            verdict=$(jq -r '.verdict // ""' <<<"${row}")
            case "${status}" in
              skipped-state)
                # Closed / needs-triage / non-actionable — settled elsewhere.
                continue
                ;;
              projected | reused)
                note=" Projected to ${url}."
                ;;
              skipped-no-token)
                if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
                  echo "::error::Non-main ref (${GITHUB_REF}): cannot project the actionable external verdict on issue #${n} (SENTRY_PROJECTION_TOKEN is only exposed on main; see #1289). Restoring sentry:needs-triage so the next main-ref run retries."
                  requeue_row "${n}" projection-unavailable
                  failed=1
                  continue
                fi
                note=" Projection skipped (SENTRY_PROJECTION_TOKEN not provisioned)."
                ;;
              failed)
                msg=$(jq -r '.message // "unknown"' <<<"${row}")
                echo "::error::Projection failed for issue #${n}: ${msg}. Re-queuing it through the re-queue chokepoint for retry."
                requeue_row "${n}" projection-failure
                failed=1
                continue
                ;;
              *)
                # skipped-verdict/skipped-repo cannot normally reach this job
                # (the matrix settles those stubs) — surface anything
                # unexpected instead of silently consuming it.
                echo "::error::Unexpected projection status '${status}' for issue #${n}; leaving the stub as-is."
                failed=1
                continue
                ;;
            esac
            # Close the projected stub (same fixed comment + compensation
            # semantics as the matrix close step, including the lost-close-
            # response case it documents — which the CLI's terminal
            # revalidation now declines on rather than re-queuing a stub that is
            # already closed).
            if ! gh issue close "${n}" \
              --repo "${GITHUB_REPOSITORY}" \
              --reason completed \
              --comment "Triage complete: ${verdict}.${note} Ledger entry closed; reopens automatically on Sentry regression."; then
              echo "::error::Failed to close issue #${n}; re-queuing it through the re-queue chokepoint for retry."
              requeue_row "${n}" close-failure
              failed=1
              continue
            fi
            echo "Closed issue #${n} (verdict: ${verdict}, ${status})."
          done < <(jq -c '.[]' "${results_file}")
          exit "${failed}"

  # ---------------------------------------------------------------------------
  # digest: post ONE deterministic Slack digest per run — what was triaged,
  # with what verdicts, with links — so verdict review needs zero GitHub
  # polling (ADR 0036's failure mode is "unauditable automation going dark").
  #
  #   - if: always() + a non-zero select count. `always()` makes the digest
  #     post even when some `triage` matrix jobs failed (partial visibility is
  #     the point — the failed-triage bucket lists issues still labeled
  #     sentry:needs-triage). The count gate keeps it SILENT on empty batches
  #     and kill-switch no-ops (select emits count '0'/'' then), so a run where
  #     nothing happened stays quiet. Runs after the project job so the digest
  #     reflects final per-issue state (projected + closed, not in-between).
  #   - permissions: issues:read + contents:read ONLY — the digest reads issue
  #     labels/comments and posts to Slack; it holds no write credential.
  #   - This is a pure CONSUMER of the verdict contract: no LLM, no label
  #     writes, no Sentry, no contract changes.
  #   - A digest-job failure fails the whole run, which the main-failure
  #     notifier (notify-slack-on-main-failure.yml, where this workflow is
  #     registered) surfaces to #ci-failures — so a broken digest can't go dark.
  # ---------------------------------------------------------------------------
  digest:
    needs: [select, triage, verdict, project]
    if: ${{ always() && needs.select.outputs.count != '' && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      # SHA-pinned (not tags) so tag retargeting / a compromised release cannot
      # silently run new code. Bump via Dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build digest payload
        env:
          # Read-only: the digest job's GITHUB_TOKEN is issues:read + contents:read.
          GH_TOKEN: ${{ github.token }}
          # The exact batch this run selected (JSON int array from the select
          # job). Passed via env — never interpolated into the shell command.
          # No Slack token in this step: it only reads issues and emits JSON.
          SENTRY_TRIAGE_ISSUES: ${{ needs.select.outputs.issues }}
        run: |
          set -euo pipefail
          # The digest channel is DELIBERATELY hardcoded here (not a secret or
          # repo variable): #engineering is the standing triage-review channel,
          # and changing it is a one-line PR. The bot's chat:write.public scope
          # lets it post to this public channel uninvited (same mechanism as
          # notify-slack-on-main-failure.yml). The script prints ONLY the Slack
          # payload JSON to stdout; diagnostics go to stderr.
          # --repo: same source of truth as the select/triage jobs
          # (GITHUB_REPOSITORY), so the digest reads the run's own repository
          # instead of assuming the script's default (matters on forks/renames).
          node scripts/sentry/triage/sentry-triage-digest.mjs \
            --channel '#engineering' \
            --repo "${GITHUB_REPOSITORY}" \
            > "${RUNNER_TEMP}/digest-payload.json"

      - name: Post digest to #engineering
        env:
          # SLACK_BOT_TOKEN reaches ONLY this posting step's env — never the
          # collector step, never echoed, never placed in a URL. Reuses the
          # existing Terraform-managed bot token (no new secret).
          SLACK_BOT_TOKEN: ${{ secrets.TF_VAR_SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail

          # Defense in depth: the job is already gated on a non-zero batch, but
          # if the collector produced no payload (empty-batch guard), there is
          # nothing to post — exit cleanly without touching Slack.
          if [ ! -s "${RUNNER_TEMP}/digest-payload.json" ]; then
            echo "::notice::No digest payload produced; nothing to post."
            exit 0
          fi

          # POST the pre-built payload verbatim (--data @file); the summary text
          # was already Slack-escaped by the collector. Mirrors the main-failure
          # notifier's curl + ok-check pattern.
          RESPONSE=$(curl -fsS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @"${RUNNER_TEMP}/digest-payload.json")

          # Slack returns 200 OK with {"ok": false, "error": "..."} on logical
          # errors; fail loudly so a silently-broken digest turns the run red
          # (the main-failure notifier then fires).
          if [ "$(echo "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack digest post failed: $(echo "$RESPONSE" | jq -r '.error // "unknown"')"
            echo "Full response: $RESPONSE"
            exit 1
          fi
          echo "Posted Sentry triage digest to #engineering."
