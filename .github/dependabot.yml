version: 2

# Keep GitHub Actions pinned to commit SHAs (not floating tags). This file is
# scoped to github-actions only so Dependabot opens a PR whenever an action
# we use tags a new release, letting us refresh the pinned SHA under review.
# npm updates for this monorepo are handled out-of-band (pnpm workspace,
# `minimumReleaseAge: 4320` in pnpm-workspace.yaml). GitHub-issued security
# advisories on pnpm-lock.yaml still come through as Dependabot PRs even
# without an `npm` entry here. Those PRs use the normal CI and operator-approved
# gates because the auto-merge lane accepts only GitHub-owned `actions/*`
# minor and patch updates in the named group below.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 10 leaves headroom for the current worst-case week: two grouped
    # minor/patch PRs, one grouped major PR, and one individual PR per
    # review-sensitive exclusion. Keep the headroom so Dependabot does not
    # silently stop opening PRs when another reviewed exclusion is added.
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies

    # Collapse the Monday batch into one PR per tier. Only GitHub-owned
    # `actions/*` minor and patch updates enter the narrow auto-merge group.
    # Other publishers, major updates, and every excluded action use the
    # normal operator-authorized merge path.
    #
    # Review-sensitive packages stay in separate, operator-authorized PRs:
    #   - `actions/create-github-app-token` — this action can mint GitHub App
    #     installation tokens. Keep credential tooling on the operator-authorized path so
    #     this lane cannot change an authentication boundary by itself.
    #   - `anthropics/*` — claude-code-action is the auto-review reviewer;
    #     a broken reviewer can break the gate that would review its
    #     follow-ups. Glob covers future Anthropic actions.
    #   - `dependabot/*` — dependabot/fetch-metadata classifies this workflow's
    #     eligibility. A regression could misclassify later updates, so every
    #     Dependabot-owned action stays outside its own automatic lane.
    groups:
      actions-minor-patch:
        patterns:
          - actions/*
        update-types:
          - minor
          - patch
        exclude-patterns:
          - actions/create-github-app-token
          - anthropics/*
          - dependabot/*
      third-party-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        exclude-patterns:
          - actions/*
          - anthropics/*
          - dependabot/*
      actions-major:
        update-types:
          - major
        exclude-patterns:
          - actions/create-github-app-token
          - anthropics/*
          - dependabot/*

    # Buy supply-chain detection time. ~80% of recent malicious-package
    # incidents (per GitGuardian's 2026 axios attack analysis) had a
    # detection window under 7 days, so a 7-day delay blocks most of them
    # at the door. Cooldown does NOT apply to security updates — those
    # still flow immediately with no delay.
    #
    # Per-semver-tier cooldown (`semver-major-days` etc.) is NOT supported
    # for the github-actions ecosystem — only `default-days` is honored.
    # Security updates bypass cooldown. They are not in the named routine
    # group, so they stay on the operator-authorized merge path. Routine group updates can
    # auto-merge after the delay and required checks.
    cooldown:
      default-days: 7
