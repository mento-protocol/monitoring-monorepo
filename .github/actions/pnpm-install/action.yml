name: pnpm install
description: Setup pnpm + Node + install deps (frozen lockfile)

# Composite action used by .github/workflows/ci.yml to DRY the setup sequence.
# Caller is responsible for `actions/checkout` before invoking this action.
# Third-party actions pinned to commit SHAs per the policy in
# .github/workflows/claude.yml — update via Dependabot (.github/dependabot.yml).

inputs:
  write-cache:
    description: Save the pnpm store after install on a protected main push
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    # Pin install and cache to one workspace-relative path. pnpm 11 can choose
    # different defaults when the workspace cannot hard-link to home. The
    # literal relative cache input also stays stable across runner providers.
    - name: Configure pnpm store
      shell: bash
      run: echo "PNPM_CONFIG_STORE_DIR=$GITHUB_WORKSPACE/.pnpm-store" >> "$GITHUB_ENV"
    - name: Prepare pnpm store target
      shell: bash
      run: >-
        node -e 'const { rmSync } = require("node:fs"); const { join } = require("node:path"); const root = process.env.GITHUB_WORKSPACE; if (!root) throw new Error("GITHUB_WORKSPACE is required"); rmSync(join(root, ".pnpm-store"), { force: true, recursive: true });'
    - name: Restore pnpm store
      id: pnpm-cache
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpm-store
        key: trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - name: Clear incomplete pnpm store restore
      if: steps.pnpm-cache.outputs.cache-hit == ''
      shell: bash
      run: >-
        node -e 'const { rmSync } = require("node:fs"); const { join } = require("node:path"); const root = process.env.GITHUB_WORKSPACE; if (!root) throw new Error("GITHUB_WORKSPACE is required"); rmSync(join(root, ".pnpm-store"), { force: true, recursive: true });'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Save pnpm store
      if: inputs.write-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpm-store
        key: trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
