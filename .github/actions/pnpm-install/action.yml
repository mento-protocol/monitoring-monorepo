name: pnpm install
description: Setup pnpm + Node + install deps (frozen lockfile)

# Composite action used by .github/workflows/ci.yml to DRY the setup sequence.
# Caller is responsible for `actions/checkout` before invoking this action.
# Third-party actions pinned to commit SHAs per the policy in
# .github/workflows/claude.yml — update via Dependabot (.github/dependabot.yml).

inputs:
  write-cache:
    description: Save the pnpm store after install on a protected main push
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        dest: ${{ github.workspace }}/.pnpm-store
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    # The pinned setup action exports PNPM_HOME under its destination. Keep that
    # destination in the workspace so install and every later pnpm command use
    # one store. The literal cache input stays stable across runner providers.
    - name: Prepare pnpm store target
      shell: bash
      run: >-
        node -e 'const { rmSync } = require("node:fs"); const { join } = require("node:path"); const root = process.env.GITHUB_WORKSPACE; if (!root) throw new Error("GITHUB_WORKSPACE is required"); rmSync(join(root, ".pnpm-store", "node_modules", ".bin", "store"), { force: true, recursive: true });'
    - name: Restore pnpm store
      id: pnpm-cache
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpm-store/node_modules/.bin/store
        key: trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/.npmrc', 'package.json', '.node-version') }}
        restore-keys: |
          trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - name: Clear incomplete pnpm store restore
      if: steps.pnpm-cache.outputs.cache-hit == ''
      shell: bash
      run: >-
        node -e 'const { rmSync } = require("node:fs"); const { join } = require("node:path"); const root = process.env.GITHUB_WORKSPACE; if (!root) throw new Error("GITHUB_WORKSPACE is required"); rmSync(join(root, ".pnpm-store", "node_modules", ".bin", "store"), { force: true, recursive: true });'
    - name: Verify pnpm store target
      shell: bash
      run: >-
        node -e 'const { execFileSync } = require("node:child_process"); const { isAbsolute, join, relative, sep } = require("node:path"); const root = process.env.GITHUB_WORKSPACE; if (!root) throw new Error("GITHUB_WORKSPACE is required"); const cache = join(root, ".pnpm-store", "node_modules", ".bin", "store"); const store = execFileSync("pnpm", ["store", "path", "--silent"], { encoding: "utf8" }).trim(); const path = relative(cache, store); if (isAbsolute(path) || path === ".." || path.startsWith(".." + sep)) throw new Error("pnpm store " + store + " is outside cache target " + cache);'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Save pnpm store
      if: inputs.write-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pnpm-store/node_modules/.bin/store
        key: trusted-main-v1-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/.npmrc', 'package.json', '.node-version') }}
