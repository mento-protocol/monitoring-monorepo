name: Resolve validation baseline
description: >
  Resolve a package's eslint-baseline.json at an immutable validation base and
  export it as ESLINT_BASELINE_MAIN for the baseline-growth check.

# Composite action used by .github/workflows/ci.yml to DRY the per-package
# baseline-growth step. Caller is responsible for its event guard and for
# `actions/checkout` before invoking this action.

inputs:
  package-path:
    description: Package directory the eslint-baseline.json lives in (e.g. shared-config).
    required: true
  fetch-main:
    description: >
      Fetch origin/main first. Set to 'false' when the caller's checkout
      already used fetch-depth: 0 (origin/main is already available).
    required: false
    default: "true"
  baseline-ref:
    description: Immutable Git object that owns the baseline file
    required: false
    default: origin/main

runs:
  using: composite
  steps:
    - shell: bash
      if: inputs.fetch-main == 'true'
      run: |
        set -euo pipefail
        # Fail closed if origin/main can't be reached — a silently-empty
        # main baseline would skip the merge-base growth check and let a
        # hand-grown HEAD baseline pass. Explicit refspec ensures
        # refs/remotes/origin/main is updated regardless of the remote's
        # configured fetch refmap.
        git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
    - shell: bash
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
      run: |
        set -euo pipefail
        # A no-skip audit passes its admitted base SHA. Ordinary pull request
        # runs keep origin/main. Resolve either form exactly before reading it.
        if ! git rev-parse --verify --quiet "${BASELINE_REF}^{commit}" >/dev/null; then
          echo "::error::Baseline ref ${BASELINE_REF} is not available. Fetch it before invoking this action." >&2
          exit 1
        fi
        # Only tolerate a genuinely missing baseline file at the validated
        # base. A missing object or tree read still fails closed.
        if git ls-tree --name-only "$BASELINE_REF" -- "${{ inputs.package-path }}/eslint-baseline.json" | grep -q .; then
          git show "${BASELINE_REF}:${{ inputs.package-path }}/eslint-baseline.json" > "/tmp/main-baseline-${{ inputs.package-path }}.json"
        else
          : > "/tmp/main-baseline-${{ inputs.package-path }}.json"
        fi
        echo "ESLINT_BASELINE_MAIN=/tmp/main-baseline-${{ inputs.package-path }}.json" >> "$GITHUB_ENV"
