steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - metrics-bridge/Dockerfile
      - -t
      - $_IMAGE
      - .
images:
  - $_IMAGE
# Pin Metrics Bridge builds to its Terraform-managed least-privilege executor.
# Submitters have Service Account User only on this identity. Default Compute
# keeps temporary source-bucket read access through both canaries; ADR 0058
# moves its removal to a later approved cleanup.
serviceAccount: projects/mento-monitoring/serviceAccounts/metrics-bridge-builder@mento-monitoring.iam.gserviceaccount.com
options:
  # Write logs ONLY to Cloud Logging (not the default GCS log bucket), so the
  # deploy SA can stream them with `roles/logging.viewer` alone. The default
  # GCS log bucket would require project Viewer/Owner, which we don't want
  # to grant to the deploy SA.
  logging: CLOUD_LOGGING_ONLY
