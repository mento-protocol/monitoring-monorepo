steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - metrics-bridge/Dockerfile
      - -t
      - $_IMAGE
      - .
images:
  - $_IMAGE
# Pin Metrics Bridge builds to its Terraform-managed least-privilege executor.
# Submitters have Service Account User only on this identity. ADR 0058's cleanup
# removes default Compute's direct source-bucket Object Viewer; its separate
# project-level Editor role remains out of scope. Cloud Build expands PROJECT_ID
# from the selected build project so the resource path and email stay aligned.
serviceAccount: projects/$PROJECT_ID/serviceAccounts/metrics-bridge-builder@$PROJECT_ID.iam.gserviceaccount.com
options:
  # Write logs ONLY to Cloud Logging (not the default GCS log bucket), so the
  # deploy SA can stream them with `roles/logging.viewer` alone. The default
  # GCS log bucket would require project Viewer/Owner, which we don't want
  # to grant to the deploy SA.
  logging: CLOUD_LOGGING_ONLY
