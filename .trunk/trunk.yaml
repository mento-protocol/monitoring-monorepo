# https://docs.trunk.io/cli
version: 0.1
cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.7.5
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - node@24.13.1
    - python@3.10.8

lint:
  ignore:
    - linters: [ALL]
      paths:
        - "**/node_modules/**"
        - "**/.next/**"
        - "**/.next-fixture/**"
        - "**/coverage/**"
        - "**/generated/**"
        - "**/.envio/**"
        # Raw Arkham extraction output (gitignored locally; JSONLs of API
        # responses that contain harmless misspellings + are not formatted
        # for human review).
        - "**/.intel-marathon/**"
    - linters: [ALL]
      paths:
        # Byte-frozen inputs of the review-skill eval. The contract pins a
        # sha256 for every truth file, finder report and run prompt, and the
        # contract's own bytes are the digest every ledger row is compared
        # across. A formatter rewrite here is not cosmetic: it fails
        # `review:eval -- --check-fixtures` and breaks comparability. Observed:
        # prettier rewrote `__tests__` to `**tests**` inside a frozen report.
        - docs/evals/review-skill-fixtures.json
        - docs/evals/review-skill-judge-calibration.json
        - docs/evals/review-skill-truth/**
        - docs/evals/review-skill-finder-reports/**
        - docs/evals/review-skill-runs/**
        - scripts/review/prompts/**
    - linters: [markdownlint]
      paths:
        # LLM prompt payloads (e.g. the Sentry triage-agent prompt), not rendered
        # documentation — prose rules like MD041 (first line must be an H1) don't
        # apply. Prettier still normalizes their formatting.
        - .github/prompts/**
    - linters: [prettier]
      paths:
        # Generated deterministically by scripts/context/docs-index.mjs. Formatting it
        # independently would make `docs:index --check` report false drift.
        - docs/README.md
    - linters: [osv-scanner]
      paths:
        - indexer-envio/pnpm-lock.yaml
        - pnpm-lock.yaml
        # Standalone Cloud Build lockfile for governance-watchdog. The required
        # Code Quality job runs scripts/supply-chain/pnpm-audit-high-gate.mjs
        # against this lockfile and applies the path-scoped Discord undici
        # exception there;
        # OSV ignores are only vulnerability-scoped, so using them here would
        # be too broad.
        - governance-watchdog/pnpm-lock.yaml
        # Per-package npm lockfile committed for Cloud Build's `npm ci`. Vulns
        # surface against the workspace pnpm-lock.yaml (already ignored above);
        # scanning this derived artifact would just double-report transitive
        # findings with no fix path.
        - alerts/infra/onchain-event-handler/package-lock.json
        # Standalone Cloud Build lockfiles for the alerts handlers. The
        # required Code Quality job runs
        # scripts/supply-chain/pnpm-audit-high-gate.mjs
        # against both directly (same duplication as governance-watchdog
        # above), so a ruleset-required check still fails on a high/critical
        # advisory; .github/workflows/supply-chain.yml's pnpm-audit step
        # covers the same two directories for the non-required daily/weekly
        # cadence. They were the last lockfiles trunk's osv-scanner still
        # scanned inline, which made every same-day OSV publication against
        # any pinned transitive fail Code Quality repo-wide on files no open
        # PR touches (2026-08-13: nanoid, then uuid and ws within hours).
        # Security floors stay maintained via each package's
        # pnpm-workspace.yaml overrides.
        - alerts/infra/oncall-announcer/pnpm-lock.yaml
        - alerts/infra/onchain-event-handler/pnpm-lock.yaml
    - linters: [checkov]
      paths:
        - terraform/main.tf
        # Platform root resources are bootstrapping/project-shape resources
        # with existing reviewed IAM/WIF tradeoffs. Keep the pre-split
        # terraform/main.tf checkov behavior stable after moving resources
        # into concern files.
        - terraform/aegis-bootstrap.tf
        - terraform/ci-wif.tf
        - terraform/dashboard.tf
        - terraform/gcp-project.tf
        - terraform/metrics-bridge.tf
        - terraform/project-iam.tf
        - terraform/providers.tf
        - pnpm-lock.yaml
        # Ethereum contract addresses look like base64 high-entropy strings to checkov;
        # this file holds only public proxy + token addresses generated from
        # @mento-protocol/contracts by scripts/generateNttAddresses.mjs.
        - indexer-envio/config/nttAddresses.json
        # Regression fixture — public pool + token addresses used to verify
        # `poolName(chainId, token0, token1)` matches the old hand-rolled
        # POOL_PAIR_LABELS list. No secrets.
        - shared-config/__tests__/fixtures/known-pools.json
        # QuickNode webhook test fixture — base64-encoded on-chain event log
        # data (MedianUpdated payloads) reads as high-entropy to checkov. No
        # secrets; it's a recorded public-chain event used by the unit tests.
        - governance-watchdog/src/events/fixtures/health-check.fixture.json
        # Service-local peg topology contains only public token, pool, and
        # rate-feed addresses. Checkov misclassifies the EUROP token address as
        # a high-entropy secret; referential integrity is checked separately.
        - metrics-bridge/peg-registry.json
  enabled:
    - checkov@3.2.506
    # eslint is run per-package via `pnpm --filter X lint`, wired into the
    # agent quality gate. Each package's lint script invokes
    # `scripts/eslint-baseline-diff.mjs` against its `eslint-baseline.json`
    # (prune-only diff check; fails on any new or stale tuple). Root-level
    # build scripts under `scripts/` are linted by the standalone
    # `pnpm lint:scripts` job in CI — see eslint.config.mjs at the repo
    # root. Re-enabling trunk-eslint here would either duplicate that work
    # or fight the baseline mechanism (trunk treats every warning as a
    # check failure).
    - prettier@3.8.1
    - markdownlint@0.48.0
    - git-diff-check
    - trufflehog@3.93.6
    - osv-scanner@2.3.3
    - codespell@2.4.1
    - actionlint@1.7.8
    - yamllint@1.38.0
    - shellcheck@0.11.0

actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push # Use custom pre-push below
  definitions:
    - id: agent-quality-gate-pre-push
      display_name: Agent Quality Gate Pre-Push
      description: >
        Runs the path-aware agent quality gate before push. The gate maps the
        branch diff to the required local checks instead of always running the
        full monorepo pre-push suite.
      run: git fetch --quiet origin main && ./scripts/agent-quality-gate.sh --run --parallel 3 --skip-if-fresh --base origin/main
      triggers:
        - git_hooks: [pre-push]
  enabled:
    - trunk-fmt-pre-commit
    - agent-quality-gate-pre-push
    - trunk-upgrade-available
