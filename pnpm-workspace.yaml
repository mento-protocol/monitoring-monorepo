packages:
  - shared-config
  - indexer-envio
  - ui-dashboard
  - metrics-bridge
  - integration-probes
  - aegis
  - alerts/infra/onchain-event-handler
  - alerts/infra/oncall-announcer
  - governance-watchdog

catalog:
  # Single source of truth for viem. ui-dashboard/metrics-bridge reference it
  # via "catalog:"; indexer-envio, aegis, governance-watchdog and the alerts
  # handler are also built as standalone source roots outside this workspace,
  # so they keep literal pins; scripts/supply-chain/version-skew-check.mjs
  # enforces they stay equal to this entry.
  viem: 2.56.5

# pnpm-workspace.yaml overrides carry bounded undici security pins for root
# workspace consumers such as @vercel/blob/jsdom. Keep them bounded: unbounded
# range overrides forward-resolve the whole graph to undici 8.x on fresh
# installs, which broke Discord delivery (#831/#833/#837). Keep standalone
# deploy roots on narrow runtime dependencies instead of forcing incompatible
# transitive transport versions.

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@grpc/grpc-js@1.14.5"
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
  - compression@1.8.2
  - basic-ftp@6.2.1
  - sharp@0.35.5
  - "@img/sharp-linux-arm@0.35.5"
  - "@img/sharp-linux-x64@0.35.5"
  - "@img/sharp-win32-x64@0.35.5"
  - "@img/sharp-darwin-x64@0.35.5"
  - "@img/sharp-win32-ia32@0.35.5"
  - "@img/sharp-linux-arm64@0.35.5"
  - "@img/sharp-linux-ppc64@0.35.5"
  - "@img/sharp-linux-s390x@0.35.5"
  - "@img/sharp-win32-arm64@0.35.5"
  - "@img/sharp-darwin-arm64@0.35.5"
  - "@img/sharp-linux-riscv64@0.35.5"
  - "@img/sharp-linuxmusl-x64@0.35.5"
  - "@img/sharp-freebsd-wasm32@0.35.5"
  - "@img/sharp-linuxmusl-arm64@0.35.5"
  - "@img/sharp-webcontainers-wasm32@0.35.5"
  - handlebars@4.7.10
  - undici@6.28.1
  - "@mento-protocol/*"
  - envio-cloud
  - "@envio-dev/envio-cloud-*"
  # Security override floors may be younger than the 3-day release-age gate.
  - "@babel/core"
  - brace-expansion
  - esbuild
  - "@esbuild/*"
  - fast-uri
  - form-data
  - js-yaml
  # July 2026 security release: Auth.js 5.0.0-beta.32.
  - next-auth@5.0.0-beta.32
  - "@auth/core@0.41.3"
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  - postcss@8.5.23
  - protobufjs
  - tar
  - undici@7.29.0
  - vite

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@nestjs/core"
  - envio-cloud
  - "@sentry/cli"
  - es5-ext
  - esbuild
  - rescript

# Root pnpm settings live here for pnpm 11+.
packageConfigs:
  # indexer-envio pins Envio CLI/runtime versions exactly; pnpm 11 ignores
  # non-auth package .npmrc settings, so keep the policy in the workspace file.
  "@mento-protocol/indexer-envio":
    saveExact: true

overrides:
  # Nodemon watches literal directories; chokidar 4 removes unpatched braces.
  "nodemon>chokidar": 4.0.3
  "source-map-js@<1.2.2": 1.2.2
  "proxy-addr@<2.0.8": 2.0.8
  "compression@<1.8.2": 1.8.2
  "basic-ftp@<6.2.1": 6.2.1
  # Next only uses globSync for root-directory matching. The companion patch
  # disables tinyglobby directory expansion to preserve fast-glob semantics.
  "@next/eslint-plugin-next>fast-glob": npm:tinyglobby@0.2.17
  # react-doctor 0.1.6 scores the dashboard with Knip 6.12.2. Newer Knip
  # releases change its dead-code result and lower the required score to 99.
  "react-doctor>knip": 6.12.2
  # The Envio CLI renders its terminal UI with Ink. Its react-dom arrives as a
  # peer of @rescript/react and resolves from the hoisted copy, so this pin must
  # track the dashboard's react version or react-dom's own `react: ^x` peer
  # breaks inside envio's subtree.
  "envio>react": 19.2.8
  # GHSA-wq5f-xc86-pv6w: 0.35.5 is the patched floor. Stable Next
  # 16.2.x still requests sharp ^0.34.5; remove once the supported stable Next
  # line selects sharp >=0.35.5.
  "sharp@<0.35.5": 0.35.5
  "flatted@<3.4.2": 3.4.2
  # GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr: patched 5.x floor.
  "brace-expansion@>=2.0.0 <3": 5.0.12
  "brace-expansion@>=5.0.0 <6": 5.0.12
  # GHSA-fxqj-rqcc-2cmp: all releases through 8.5.22 are vulnerable.
  "postcss@<8.5.23": 8.5.23
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  "vite@>=8.0.0 <8.0.16": 8.0.16
  "@grpc/grpc-js": 1.14.5
  "esbuild": 0.28.1
  "@babel/core@>=7.0.0 <7.29.6": 7.29.6
  # GHSA-v422-hmwv-36x6: enforce limit validation on both supported lines.
  "body-parser@<1.20.6": 1.20.6
  "path-to-regexp@<0.1.13": 0.1.13
  # GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g hit 3.1.6, the floor the
  # earlier fast-uri advisories set. 3.1.7 is the patched floor for the 3.x
  # line; ajv 8 needs fast-uri ^3.
  "fast-uri@<3.1.7": 3.1.7
  "express@<4.20.0": 4.22.1
  "form-data@<2.5.6": 2.5.6
  "form-data@>=4.0.0 <4.0.6": 4.0.6
  # GHSA-2883-xcg3-v3hh hits 4.3.1, the floor the superseded
  # GHSA-5p4m-2wfm-xmqj pin set. 4.3.2 is the patched floor for the 4.x line.
  # The two scoped clauses keep parents that still request js-yaml 3.x on 4.x,
  # which is why no root resolves the separately affected 3.x line.
  "@istanbuljs/load-nyc-config>js-yaml": 4.3.2
  "@lhci/utils>js-yaml": 4.3.2
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # GHSA-2v37-7h3g-55p8: 3.3.18 is the patched floor for the 3.x line.
  "nanoid@<3.3.18": 3.3.18
  "protobufjs@>=7.0.0 <7.6.5": 7.6.5
  "qs@<6.15.2": 6.15.2
  "cookie@<0.7.0": 0.7.2
  "send@<0.19.0": 0.19.2
  "serve-static@<1.16.0": 1.16.3
  "@eslint/eslintrc@<3.3.5": 3.3.5
  "ajv@^6.0.0": ^6.14.0
  "ajv@^8.0.0": ^8.18.0
  "body-parser@>=2.0.0 <2.3.0": 2.3.0
  # GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr: patched 5.x floor.
  "brace-expansion@^1.0.0": 5.0.12
  "cron": 4.3.4
  "diff@^4.0.0": ^4.0.4
  "file-type@^21.0.0": ^21.3.2
  "handlebars@<4.7.10": 4.7.10
  # GHSA-mwp4-54f8-5fhr: 10.3.1 rejects ambiguous leading-zero IPv4 octets.
  "ip-address@<10.3.1": 10.3.1
  "lodash@>=4.0.0 <4.17.23": 4.18.1
  "minimatch@^3.0.0": ^3.1.4
  "minimatch@^9.0.0": ^9.0.7
  "minimatch@^10.0.0": ^10.2.3
  # GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf and GHSA-535w-7cp7-47q4 hit
  # 2.2.0, the floor the superseded GHSA-72gw-mp4g-v24j pin set. 2.3.0 is
  # the patched floor; @nestjs/platform-express 11.x still requests 2.0.2.
  "multer@<2.3.0": 2.3.0
  "@opentelemetry/core@<2.8.0": 2.8.0
  "path-to-regexp@^8.0.0": ^8.4.0
  "picomatch@^2.0.0": ^2.3.2
  # GHSA-r292-9mhp-454m: 7.5.21 bounds long-path selection recursion.
  "@trunkio/launcher>tar": 7.5.21
  "tar@>=7.0.0 <7.5.21": 7.5.21
  "@lhci/cli>tmp": 0.2.7
  "external-editor>tmp": 0.2.7
  "uuid@<11.1.1": 11.1.1
  # GHSA-4cwx-7wf7-3272: 7.29.0 fixes private cache directive handling.
  "undici@>=7.23.0 <7.29.0": 7.29.0
  "webpack@>=5.0.0 <5.104.1": 5.106.2
  "lighthouse>ws": 7.5.11
  "ws@>=8.0.0 <8.21.0": 8.21.0
  # GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5, GHSA-v3r7-h72x-cjcm.
  "undici@<6.28.1": 6.28.1
  "yaml@^2.0.0": ^2.8.3

patchedDependencies:
  "@next/eslint-plugin-next@16.3.5": patches/@next__eslint-plugin-next@16.3.5.patch
  "@lhci/utils@0.15.1": patches/@lhci__utils@0.15.1.patch

# pnpm 11 records dependency build-script policy explicitly.
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": false
  "@sentry/cli": true
  "envio-cloud": true
  "es5-ext": true
  "esbuild": true
  "protobufjs": false
  "rescript": true
  "sharp": false
  "unrs-resolver": false
