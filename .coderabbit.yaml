# CodeRabbit is retired. Disable automatic reviews and replies.
# Remove the organization app installation; Global overrides can supersede this file.
reviews:
  profile: chill

  request_changes_workflow: false

  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  collapse_walkthrough: true

  path_instructions:
    - path: "ui-dashboard/src/**/*.{ts,tsx}"
      instructions: |
        Apply the file-size policy in `ui-dashboard/AGENTS.md` and `ui-dashboard/eslint.config.mjs`.
        Count effective lines after excluding blank lines and comments.
        Treat 600 effective lines as the soft review threshold and 1,000 effective lines as the lint cap.
        Do not apply these thresholds to `ui-dashboard/src/lib/__generated__/**`, `**/__tests__/**`, `**/*.test.{ts,tsx}`, or `ui-dashboard/src/lib/types.ts`.
        Compare the effective count with the merge base. Do not request a split when the change reduces an already-over-threshold file.
        Do not request a split only from the physical line count. Report threshold drift only when the change grows a file that remains above policy; report a separate cohesion defect independently.

  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/pnpm-lock.yaml"
    - "!docs/README.md"
    - "!docs/evals/documentation-navigation-baseline*.json"
    - "!ui-dashboard/src/lib/__generated__/**"
    - "!indexer-envio/generated/**"
    - "!indexer-envio/abis/**"
    - "!alerts/infra/onchain-event-handler/src/safe-abi.json"
    - "!alerts/infra/onchain-event-listeners/event-hashes.json"
    - "!**/eslint-baseline.json"
    - "!**/__snapshots__/**"
    - "!docs/evals/review-skill-runs/**"
    - "!docs/evals/review-skill-truth/**"
    - "!docs/evals/review-skill-finder-reports/**"
    - "!docs/evals/review-skill-ledger.jsonl"
    - "!docs/evals/review-skill-judge-calibration.json"
    - "!.claude/skills/**"
    - "!docs/metrics/**"
    - "!scripts/repo-health/**"

  auto_review:
    enabled: false
    base_branches: []
    drafts: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 5

chat:
  auto_reply: false
