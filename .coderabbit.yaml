# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review profile (ADR 0066). CodeRabbit resolves this file from the
# SOURCE branch of the PR it reviews, so a PR can weaken the reviewer that
# reviews it. `scripts/coderabbit-config.test.mjs` pins every key and value
# below against an allowlist, so any edit here fails CI until the pin is
# updated in the same PR.
#
# Key names and defaults verified against docs.coderabbit.ai/reference/configuration
# and the published schema.v2.json on 2026-08-18.
reviews:
  # quiet | chill | assertive. `chill` is the documented default; pinned here so
  # a UI-level or vendor default change cannot silently raise verbosity.
  profile: chill

  # Documented as "Automatically approve once CodeRabbit's comments are resolved
  # and no pre-merge checks are failing." No documented setting suppresses the
  # CHANGES_REQUESTED verdict itself, and enabling this would add a bot APPROVED
  # review to a repo whose merge oracle reads review state. Left off; stale
  # CHANGES_REQUESTED containers are cleared with the repo's dismissals PUT
  # (docs/notes/pr-ready-state.md).
  request_changes_workflow: false

  # Verbosity levers. The ADR names CodeRabbit's known weakness as verbosity and
  # these as the levers.
  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  collapse_walkthrough: true

  # Evidence for dashboard size guidance:
  # - PRs #2115 and #2143 repeated the same invalid max-lines finding on
  #   dashboard tests. CodeRabbit withdrew both after reading the test exemptions.
  # - PR #2142 counted physical lines. CodeRabbit withdrew the finding after the
  #   repository's effective-line count showed 540 lines.
  # Canonical sources: `ui-dashboard/AGENTS.md` and
  # `ui-dashboard/eslint.config.mjs`. Revalidate this instruction if the package
  # line budgets, effective-line calculation, or exemptions change.
  #
  # Evidence for gate lifecycle guidance:
  # - PR #2075 inferred execution order from mapper insertion order.
  # - PR #2131 inferred settlement order from the deferred release site.
  # CodeRabbit withdrew both after tracing the executor and focused tests.
  # Canonical source: `docs/notes/agent-quality-gate-mechanics.md`. Revalidate
  # this instruction if execution phases, command classification, or settlement
  # ownership change.
  #
  # Canary after a human-approved merge: observe at least 40 eligible PRs and
  # five applicable changes per instruction. Remove an instruction immediately
  # if independent evidence shows that it suppressed a valid defect.
  path_instructions:
    - path: "ui-dashboard/src/**/*.{ts,tsx}"
      instructions: |
        Apply the file-size policy in `ui-dashboard/AGENTS.md` and `ui-dashboard/eslint.config.mjs`.
        Count effective lines after excluding blank lines and comments.
        Treat 600 effective lines as the soft review threshold and 1,000 effective lines as the lint cap.
        Do not apply these thresholds to `**/__tests__/**`, `**/*.test.{ts,tsx}`, or `ui-dashboard/src/lib/types.ts`.
        Do not request a split only from the physical line count. Report a size finding only when the effective count exceeds policy or the changed file has a separate cohesion defect.
    - path: "scripts/gate/**/*.{mjs,sh}"
      instructions: |
        Apply the execution and settlement model in `docs/notes/agent-quality-gate-mechanics.md`.
        Before reporting an ordering or lifecycle defect, trace route mapping through executor phases, command classification, settlement ownership, and the focused regression tests.
        Mapper insertion order and the location of a deferred cleanup call do not prove runtime order.
        Report an ordering or lifecycle finding only when the changed path can bypass a required prerequisite or settlement step, or when focused coverage no longer reaches that path.

  # Generated, vendored, and machine-written trees. Reviewing them spends
  # reviewed-file capacity (the Pro+ fair-usage ladder is finite; no usage-based
  # add-on is enabled) on diffs no human authored.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/pnpm-lock.yaml"
    # Generated by `pnpm docs:index`.
    - "!docs/README.md"
    # Generated by `pnpm docs:navigation-eval`.
    - "!docs/evals/documentation-navigation-baseline*.json"
    # GraphQL codegen output, verified-committed by CI.
    - "!ui-dashboard/src/lib/__generated__/**"
    # Envio codegen output.
    - "!indexer-envio/generated/**"
    # Vendored ABIs (ADR 0015) and the hashes derived from them.
    - "!indexer-envio/abis/**"
    - "!alerts/infra/onchain-event-handler/src/safe-abi.json"
    - "!alerts/infra/onchain-event-listeners/event-hashes.json"
    # Machine-maintained lint baselines and test snapshots.
    - "!**/eslint-baseline.json"
    - "!**/__snapshots__/**"
    # Review-skill eval artifacts: byte-frozen inputs and machine-written run
    # records/ledger rows. Ledger PRs are read by a human against report.md.
    - "!docs/evals/review-skill-runs/**"
    - "!docs/evals/review-skill-truth/**"
    - "!docs/evals/review-skill-finder-reports/**"
    - "!docs/evals/review-skill-ledger.jsonl"
    - "!docs/evals/review-skill-judge-calibration.json"

  auto_review:
    enabled: true
    # Empty means the default branch flow only.
    base_branches: []
    drafts: false
    auto_incremental_review: true
    # Keep the vendor default of 5. A threshold of 2 paused 16 of the first 29
    # PRs after rollout, including six PRs with only 2-4 total commits. Five
    # avoids treating one normal fix round as an active-development burst while
    # still bounding long agent commit sequences. `@coderabbitai review`
    # requests one exact-head closeout review after a pause.
    auto_pause_after_reviewed_commits: 5
